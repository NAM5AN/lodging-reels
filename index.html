  var RE_SIDE=new RegExp([
    "소문나면|망하는|잘못됐|0 하나|말이 되|이게 맞|실수",
    "|남들은 모르|아는 사람만|알려지기 전|알려지면",
    "|나누지 마|덤으로|돈이 안 ?아까|갓성비|비싸서 못했던",
    "|갈 돈으로|이 값에|이 가격에|이래도 안|어떻게\\.\\.\\.|어떻게\\?"
  ].join(""));
  // 업체가 할 말투. 손님이 하는 말이 아니다. A-01(0.07%) 이 이걸로 가득하다.
  var RE_BRAND=/(해보세요|이용해 ?보세요|즐겨 ?보세요|다녀오세요|방문해 ?보세요|추천해 ?드려요|완비|보유|최상급|제공합니다)/;

  function sideWarnings(lines){
    var w=[];
    if(lines.length<8) return w;
    if(!lines.some(function(t){ return RE_SIDE.test(t) }))
      w.push("시청자 편에 선 줄이 없어요 (규칙 9)");
    // 마지막 두 줄은 CTA 라 권유형이 정상이다. A-19(3.28%) 가 '호강하러 다녀오세요' 로 끝낸다.
    var body=lines.slice(0, Math.max(0, lines.length-2));
    var brand=body.filter(function(t){ return RE_BRAND.test(t) }).length;
    if(brand) w.push("업체 말투 "+brand+"줄");
    return w;
  }

  function sceneWarnings(lines){
    if(lines.length<8) return [];
    var scene=0;
    lines.forEach(function(t){ if(RE_SCENE.test(t)) scene++; });
    // 길이에 비례시키면 A-23(전환율 11.4%)처럼 장면 대신 희소성으로 끄는 대본이 걸린다.
    // 레퍼런스 5개로 맞춰본 결과 고정 4줄이 상위군과 최하위군을 정확히 가른다.
    //   A-19(3.28%) / A-15(2.37%) 가 4줄 기준에 걸려 3줄로 낮췄다.
    return scene<3 ? ["장면이 "+scene+"줄뿐 (3줄 이상 필요)"] : [];
  }

  // 줄 단위로 못 잡는 것들. 수리 루프에 넣지 않고 보고만 한다.
  function scriptWarnings(lines){
    var w=[];
    if(!lines.length) return w;

    var last=lines[lines.length-1].replace(/[)\s"'’”]+$/,"");
    if(RE_UNFINISHED.test(last)) w.push("마지막 줄이 끊겼어요");

    // A-20(5.05%) 도 조건 주석을 한 컷 쓴다. 하나는 정상, 둘부터 낭비다.
    var paren=lines.filter(function(t){ return RE_PAREN_ONLY.test(t.trim()) }).length;
    if(paren>=2) w.push("괄호만 있는 컷 "+paren+"개");

    // 긴 줄은 비율로 본다. 상위군은 12자 초과가 0~4.8% 였다.
    var long12=lines.filter(function(t){
      return !/[(（]/.test(t) && t.replace(/\s/g,"").length>12;
    }).length;
    if(long12/lines.length > 0.10) w.push("12자 넘는 줄 "+long12+"/"+lines.length);


    // 마지막 두 줄은 닫아야 하므로 세지 않는다.
    var body=lines.slice(0, Math.max(0, lines.length-2));
    if(body.length>=6){
      var closed=body.filter(function(t){ return RE_CLOSED.test(t.replace(/[\s"'’”)]+$/,"")) }).length;
      if(closed/body.length > 0.25)
        w.push("문장을 닫은 줄 "+closed+"/"+body.length+" (25% 이하로)");
    }

    // 상한만 막으면 모델이 0% 로 간다. 그러면 전부 끊긴 느낌이 든다.
    // 레퍼런스 상위 8개는 완결 종결이 평균 15% 였고, 6개가 2~4번째 줄에서 한 번 닫는다.
    // 중간 간격은 기준이 아니다. 상위 8개도 중간에서 10~28줄씩 안 닫는다.
    // 실제로 갈리는 건 두 가지뿐 — 착지 개수 3개 이상, 그리고 첫 착지가 앞쪽에 있는지.
    var land=[];
    lines.forEach(function(t,i){
      if(RE_CLOSED.test(t.replace(/[\s"'’”)\]!?.…]+$/,""))) land.push(i);
    });
    if(lines.length>=12){
      // 상위 8개는 전부 착지 3개 이상이고, 첫 착지가 늦어도 7번째 줄이었다.
      if(land.length<3)
        w.push("문장을 닫은 줄이 "+land.length+"개뿐 (3개 이상 필요)");
      if(!land.length || land[0]>6)
        w.push("첫 착지가 "+(land.length?(land[0]+1)+"번째 줄":"없어요")+" (앞쪽 2~4번째에 하나)");
    }

    // 돈 드는 걸 공짜처럼 쓰면 DM 받은 사람이 바로 돌아선다.
    // 조건을 같이 적은 줄은 정상이다. '조식·사우나는 별도 유료' 를 잡으면 안 된다.
    var RE_PAID_OK=/(유료|별도|추가|따로|[0-9][0-9,]*\s*원)/;
    var paid=paidTerms(), hit={};
    lines.forEach(function(t){
      if(RE_PAID_OK.test(t)) return;
      paid.forEach(function(term){ if(t.indexOf(term)>=0) hit[term]=1; });
    });
    var hits=Object.keys(hit);
    if(hits.length) w.push("돈 드는 항목이 조건 없이 나왔어요: "+hits.slice(0,3).join("·"));

    // 인원 기준이 없으면 금액이 몇 명 값인지 모른다.
    // 추가비까지 있으면 4인 기준으로 14만원이 더 붙는데 3만원대로만 노출되므로 경고를 세게 쓴다.
    if(!(current.people||"").trim()
       && lines.some(function(t){ return /만원|원대|\d{2,}원/.test(t) }))
      w.push(/추가비|추가 ?요금|인원 추가|엑스트라/.test(current.memo||"")
        ? "인원 추가비가 있는데 인원 기준이 비었어요 — ② 인원 칸 채우세요"
        : "인원 기준 비어 있음");

    // 좁은 지명은 숙소를 특정하고, 위치를 알려주면 댓글 달 이유가 사라진다.
    // 댓글 키워드가 그 지명이면 CTA 줄이 걸린다. 그건 일부러 쓰는 거라 빼고 센다.
    var kwNow=(current.keyword||"").trim();
    areaNarrow().forEach(function(narrow){
      if(narrow===kwNow) return;
      var n=lines.filter(function(t){ return t.indexOf(narrow)>=0 }).length;
      if(n) w.push("좁은 지명 '"+narrow+"' "+n+"회");
    });

    var hearsay=lines.filter(function(t){ return RE_HEARSAY.test(t.trim()) }).length;
    if(hearsay) w.push("전해 들은 투 "+hearsay+"줄");

    var tease=lines.filter(function(t){ return RE_TEASE.test(t) }).length;
    if(tease>=2) w.push("빈 예고 "+tease+"줄");

    var causal=lines.filter(function(t){ return RE_CAUSAL.test(t.trim()) }).length;
    if(causal>=3) w.push("인과 연결 "+causal+"줄");

    return w;
  }

  function summarize(probs){
    var m={};
    probs.forEach(function(o){ (o.tag||[]).forEach(function(w){ m[w]=(m[w]||0)+1; }); });
    return Object.keys(m).map(function(k){ return k+" "+m[k]+"줄"; }).slice(0,3);
  }

  // ---------- 모델 호출 ----------
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms) }); }

  // 키는 Edge Function 안에 있다. 브라우저는 토큰만 들고 간다.
  async function askOnce(prompt, purpose, repairIndices){
    // Backend pins script, repair, and extension to Opus 5.5. OCR stays on Sonnet 5.
    var request={prompt:prompt,json:true,max_tokens:purpose?6000:3000};
    if(purpose)request.purpose=purpose;
    if(purpose==="script_repair")request.repair_indices=repairIndices||[];
    var r=await api(FN.ai,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(request)
    });
    var t=await r.text();
    if(!r.ok){
      var code="upstream_error";
      try{ code=(JSON.parse(t).error)||code; }catch(e){}
      var err=new Error(t.slice(0,200)); err.code=code; throw err;
    }
    var got=JSON.parse(t).text||"";
    // 모델이 코드블록으로 감싸는 경우가 있어 벗겨낸다.
    got=got.replace(/^```(json)?/i,"").replace(/```\s*$/,"").trim();
    try{ return JSON.parse(got); }
    catch(e){
      var i=got.indexOf("{"), j=got.lastIndexOf("}");
      if(i>=0 && j>i) return JSON.parse(got.slice(i,j+1));
      var e2=new Error("JSON 해석 실패"); e2.code="bad_json"; throw e2;
    }
  }

  // upstream_error 는 규칙 문제가 아니라 호출이 끊긴 것이다. 몇 번은 그냥 다시 걸면 된다.
  async function askJSON(prompt, tries, onTry, purpose, repairIndices){
    var last=null;
    for(var i=0;i<tries;i++){
      if(onTry && i) onTry(i+1, tries);
      try{
        var r=await askOnce(prompt, purpose, repairIndices);
        if(r) return r;
        last=new Error("empty");
      }catch(e){
        last=e;
        var c=(e&&e.code)||"";
        if(c==="unauthorized" || c==="no_key" || c==="bad_key" || c==="bad_model"
           || c==="bad_repair_indices" || c==="bad_purpose") throw e;  // 다시 걸어도 해결되지 않는 설정 오류
      }
      await sleep(800*(i+1));
    }
    throw last || new Error("failed");
  }

  // 규칙을 다 넣은 프롬프트가 계속 실패하면, 핵심만 남긴 짧은 걸로 한 번 더 간다.
  function shortPrompt(){
    var L=targetLines();
    var f=function(k){ return (current[k]||"").trim(); };
    var kw=f("keyword")||"특가";
    return "인스타 숙소 홍보 릴스 대본을 써주세요. 목표는 댓글이에요.\n\n"+
      "숙소: "+f("name")+" / "+f("area")+" / "+f("type")+" / "+f("people")+" / "+f("price")+"\n"+
      "혜택:\n"+f("perks")+"\n\n"+
      "- 컷 자막 "+L+"줄. 한 줄 6~10자, 최대 14자. 띄어쓰기는 정확히.\n"+
      "- 첫 두 줄은 긴장으로. 사양 나열 금지.\n"+
      "- 숙소명·주소·브랜드명은 쓰지 마세요.\n"+
      "- 금액은 '30만원대' 처럼 만원 단위로.\n"+
      "- 마지막 3~4줄은 댓글 유도. 키워드는 \""+kw+"\".\n"+
      "- 커버 2줄: 1줄째 윗줄(16자 이내), 2줄째 아랫줄(10자 이내).\n\n"+
      'JSON 만: {"cover":["윗줄","아랫줄"],"script":["1컷", ... "'+L+'컷"]}';
  }

  // 틀린 줄만 다시 받는다. 전체를 다시 만들면 멀쩡한 줄까지 바뀐다.
  async function repairLines(lines, probs, cover){
    var list=probs.slice(0,8);
    var prompt="인스타 릴스 자막 중 몇 줄이 규칙을 어겼어요. 그 줄만 고쳐주세요.\n\n"+
      "커버 문구:\n"+String(cover||"")+"\n\n"+
      "전체 자막 (흐름 참고용, 번호는 1부터):\n"+
      lines.map(function(t,i){ return (i+1)+". "+t; }).join("\n")+"\n\n"+
      "고칠 줄:\n"+
      list.map(function(o){ return (o.i+1)+". \""+o.text+"\" → "+o.why; }).join("\n")+"\n\n"+
      "규칙:\n"+
      "- 뜻과 역할은 그대로 두고 표현만 고치세요. 앞뒤 줄과 이어져야 해요.\n"+
      "- 한 줄은 공백 빼고 6~10자, 최대 14자.\n"+
      "- 띄어쓰기는 평소대로 정확히 하세요.\n"+
      "- 금액은 만원 단위로. 숙소명·브랜드명은 쓰지 마세요.\n"+
      "- 고치라고 한 줄만 주세요. 나머지는 건드리지 마세요.\n\n"+
      "JSON 하나만 답하세요. 키는 줄 번호(1부터)예요.\n"+
      '{"fixed":{"'+(list[0].i+1)+'":"고친 줄", ...}}';
    var got=await askJSON(prompt, 2, null, "script_repair",
      list.map(function(o){return o.i+1;}));
    var fx=got && got.fixed;
    if(!fx) return 0;
    var n=0;
    list.forEach(function(o){
      var v=fx[String(o.i+1)];
      if(v==null) v=fx[o.i+1];
      if(v==null) return;
      v=String(v).trim();
      if(v && v!==lines[o.i]){ lines[o.i]=v; n++; }
    });
    return n;
  }

  // 줄 수가 모자라면 모자란 만큼만 더 받는다.
  async function extendLines(lines, want, cover){
    var need=want-lines.length;
    if(need<=0) return 0;
    var prompt="인스타 릴스 자막이 "+need+"줄 모자라요. 뒤에 이어질 "+need+"줄만 써주세요.\n\n"+
      "커버 문구:\n"+String(cover||"")+"\n\n"+
      "지금까지의 자막:\n"+lines.map(function(t,i){return (i+1)+". "+t}).join("\n")+"\n\n"+
      "규칙:\n"+
      "- 한 줄은 공백 빼고 6~10자, 최대 14자. 띄어쓰기는 정확히.\n"+
      "- 마지막 3~4줄은 댓글 유도로 끝나야 해요. 키워드는 \""+((current.keyword||"").trim()||"특가")+"\".\n"+
      "- 숙소명·브랜드명·원 단위 금액은 쓰지 마세요.\n\n"+
      'JSON 하나만: {"more":["...", ... '+need+'개]}';
    var got=await askJSON(prompt, 2, null, "script_extend");
    var more=got && [].concat(got.more||[]).map(function(x){return String(x).trim()}).filter(Boolean);
    if(!more || !more.length) return 0;
    more.slice(0,need).forEach(function(t){ lines.push(t); });
    return more.length;
  }

  async function makeScript(){
    var st=function(m,bad){var e=document.getElementById("scstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!uid){ st("로그인이 필요해요.",true); return; }
    if(!(current.name||"").trim() && !(current.perks||"").trim()){
      st("숙소 정보가 비어 있어요. 먼저 채워주세요.",true); return;
    }

    var want=targetLines(), got=null, why="";
    st("대본을 쓰는 중이에요... 20~60초 걸려요");
    try{
      got=await askJSON(scriptPrompt(), 3, function(i,n){
        st("같은 원본 프롬프트로 다시 시도 중 "+i+"/"+n+"...");
      }, "script");
    }catch(e){
      why=(e&&e.code)||(e&&e.message)||"";
      if(why==="unauthorized"){ st("로그인이 풀렸어요. 새로고침해주세요.",true); return; }
      if(why==="no_key"||why==="bad_key"){
        st("AI API 키가 설정되지 않았거나 잘못됐어요.",true); return; }
      // 품질을 떨어뜨리는 짧은 프롬프트 fallback은 사용하지 않는다.
      // 실패해도 동일한 원본 프롬프트만 재시도하고, 끝까지 실패하면 사용자에게 그대로 알린다.
    }
    if(!got || !got.script){
      st("원본 대본 프롬프트로 생성에 실패했어요"+(why?" ("+why+")":"")+". 잠시 뒤 다시 눌러주세요.",true);
      return;
    }

    var lines=[].concat(got.script).map(function(x){return String(x).trim()}).filter(Boolean);
    var cvText=[].concat(got.cover||[]).map(function(x){return String(x).trim()}).join("\n");

    // 모자란 줄 채우기
    if(lines.length < want){
      st("자막이 "+(want-lines.length)+"줄 모자라요. 그만큼만 더 받는 중...");
      try{ await extendLines(lines, want, cvText); }catch(e3){}
    }
    if(lines.length > want) lines=lines.slice(0, want);

    // 틀린 줄만 고치기. 될 때까지가 아니라 나아지는 동안만 돈다.
    var probs=lineProblems(lines, cvText), round=0;
    while(probs.length && round<3){
      round++;
      st("규칙을 어긴 "+probs.length+"줄을 고치는 중... ("+round+"/3)");
      var fixed=0;
      try{ fixed=await repairLines(lines, probs, cvText); }catch(e4){ break; }
      if(!fixed) break;                       // 더 못 고치면 사람에게 넘긴다
      var next=lineProblems(lines, cvText);
      if(next.length>=probs.length) { probs=next; break; }
      probs=next;
    }

    current.script=lines.join("\n");
    current.map=[];
    current.cover=cvText;
    invalidateTtsTags();
    await persist(current);
    renderEdit(current);

    var e2=document.getElementById("scstat");
    if(e2){
      // 줄 단위로 고치다 남은 것(summarize)과 전체 검사를 합쳐 보여준다.
      var st=scStat(), rest=summarize(probs);
      e2.className="status"+((st.bad||rest.length)?" bad":"");
      e2.textContent=st.text+(rest.length?"  남은 줄 문제: "+rest.join(" / "):"");
    }
  }

  // ---------- 영상 만들기 ----------
  function wrapText(t,max){
    var out=[],cur="";
    String(t).split(/\s+/).forEach(function(w){
      var c=(cur+" "+w).trim();
      if(c.length<=max||!cur) cur=c; else { out.push(cur); cur=w; }
    });
    if(cur) out.push(cur);
    return out;
  }

  function loadImg(url){
    return new Promise(function(res,rej){
      var im=new Image(); im.crossOrigin="anonymous";
      im.onload=function(){res(im)}; im.onerror=function(){rej(new Error("이미지 로드 실패"))};
      im.src=url;
    });
  }
  // ⑪은 미리 저장된 Kling MP4를 재생하면서 Canvas에 그린다. Kling API 호출이나 영상 오디오 입력은 없다.
  function loadClipVideo(url){
    return new Promise(function(res,rej){
      var video=document.createElement("video"), settled=false;
      video.crossOrigin="anonymous"; video.preload="auto"; video.playsInline=true;
      video.muted=true; video.loop=false; // 절대로 자동 반복하지 않는다.
      var timeout=setTimeout(function(){settle(new Error("영상 로드 시간 초과"));},30000);
      function cleanup(){
        clearTimeout(timeout);
        video.removeEventListener("loadeddata",onReady);
        video.removeEventListener("error",onError);
      }
      function settle(err){
        if(settled)return; settled=true; cleanup();
        if(err){
          video.removeAttribute("src");try{video.load();}catch(e){}
          rej(err);
        }else res(video);
      }
      function onReady(){
        if(!(video.videoWidth>0 && video.videoHeight>0 &&
             Number.isFinite(video.duration) && video.duration>0)){
          settle(new Error("영상의 크기나 길이를 확인하지 못했어요."));return;
        }
        settle(null);
      }
      function onError(){settle(new Error("Kling MP4를 재생할 수 없어요."));}
      video.addEventListener("loadeddata",onReady);
      video.addEventListener("error",onError);
      video.src=url; video.load();
      if(video.readyState>=2)onReady();
    });
  }
  function releaseClipVideos(clips){
    (clips||[]).forEach(function(c){
      if(!c || !c.video)return;
      try{c.video.pause();c.video.removeAttribute("src");c.video.load();}catch(e){}
    });
  }

  // 폰트가 없으면 브라우저/기기의 기본 sans-serif를 명시적으로 쓴다.
  // 라이선스 폰트는 선택사항이며, 없어도 썸네일/영상 생성은 계속된다.
  function canvasFontFamily(k){
    if(k==="cover" && fontsReady.cover) return '"ReelCover", sans-serif';
    if(k==="body" && fontsReady.body) return '"ReelBody", sans-serif';
    return 'sans-serif';
  }

  // 글자가 화면을 넘지 않는 가장 큰 크기를 찾는다.
  function fitSize(g,lines,family,want,maxW){
    var sz=want;
    for(; sz>30; sz-=2){
      g.font=sz+'px '+family;
      var ok=true;
      for(var i=0;i<lines.length;i++){
        if(g.measureText(lines[i]).width>maxW){ ok=false; break; }
      }
      if(ok) break;
    }
    g.font=sz+'px '+family;
    return sz;
  }

  function drawCover(g,im,lines){
    drawFill(g,im,1,0.5,0.5);
    drawCoverOverlay(g,lines);
  }
  // 미리보기·JPG·최종 MP4 첫 프레임이 같은 타이틀과 어둡기를 쓰도록 공유.
  function drawCoverOverlay(g,lines){
    var W=VIDEO.w,H=VIDEO.h;
    g.fillStyle="rgba(0,0,0,0.40)"; g.fillRect(0,0,W,H);
    g.textAlign="center"; g.lineJoin="round";

    // 레퍼런스 커버는 전부 '설정 → 펀치' 순서다.
    // 윗줄로 상황을 깔고, 아랫줄에서 결론을 때린다. 글자 크기도 그 순서를 따른다.
    var lead =wrapText(lines[0]||"",16);
    var punch=wrapText(lines[1]||"",10);
    if(!punch.length){ punch=lead; lead=[]; }   // 한 줄만 썼으면 그 줄이 펀치다

    var coverFamily=canvasFontFamily("cover");
    var ls = lead.length  ? fitSize(g,lead,coverFamily,80,940)  : 0;
    var ps = punch.length ? fitSize(g,punch,coverFamily,176,930) : 0;
    var lh = ls*1.30, ph = ps*1.14;
    var gap = lead.length ? Math.round(ps*0.22) : 0;
    var total = lead.length*lh + gap + punch.length*ph;

    // 인스타 그리드는 가운데 1:1 만 보여준다. 그 한가운데에 블록을 둔다.
    var y = H/2 - total/2;

    if(lead.length){
      g.font=ls+'px '+coverFamily;
      lead.forEach(function(t,i){
        stroked(g,t,W/2,y+i*lh+lh*0.78,"#FFE55C",Math.max(6,Math.round(ls*0.13)));
      });
      y += lead.length*lh + gap;
    }
    g.font=ps+'px '+coverFamily;
    punch.forEach(function(t,i){
      stroked(g,t,W/2,y+i*ph+ph*0.8,"#fff",Math.max(8,Math.round(ps*0.085)));
    });
  }

  function stroked(g,t,x,y,fill,w){
    g.strokeStyle="rgba(0,0,0,0.9)"; g.lineWidth=w; g.strokeText(t,x,y);
    g.fillStyle=fill; g.fillText(t,x,y);
  }

  // 사진을 화면에 꽉 채우되 비율을 유지한다. zoom 과 중심점으로 켄번즈를 만든다.
  function drawFill(g,im,zoom,cx,cy){
    var W=VIDEO.w,H=VIDEO.h;
    // 이미지에는 width/height, 영상에는 videoWidth/videoHeight가 들어 있다.
    var iw=im.videoWidth||im.width, ih=im.videoHeight||im.height;
    if(!(iw>0 && ih>0)) throw new Error("렌더링할 이미지/영상 크기를 확인하지 못했어요.");
    var s=Math.max(W/iw,H/ih)*zoom;
    var dw=iw*s, dh=ih*s;
    var dx=(W-dw)*cx, dy=(H-dh)*cy;
    g.drawImage(im,dx,dy,dw,dh);
  }

  function drawCutText(g,text){
    if(!text) return;
    g.textAlign="center"; g.lineJoin="round";
    // 자막은 줄을 접지 않는다. 길면 글자를 줄여서 한 줄에 넣는다.
    var sz=fitSize(g,[text],canvasFontFamily("body"),72,980);
    stroked(g, text, VIDEO.w/2, VIDEO.subY, "#fff", Math.max(4,Math.round(sz*0.07)));
  }
  function drawCut(g,im,text,t){
    drawFill(g,im,1.0+0.18*t,0.5,0.5);
    drawCutText(g,text);
  }
  function drawMagentaCut(g,text){
    g.fillStyle="#FF00FF";
    g.fillRect(0,0,VIDEO.w,VIDEO.h);
    drawCutText(g,text);
  }
  // 연속된 자막 컷이 같은 사진을 쓰면 재생을 초기화하지 않고 시간도 이어 쓴다.
  // 같은 영상이라도 다른 사진 사이에 끼어 있다가 재등장한 경우 새 구간으로 계산한다.
  function clipElapsedInRun(windows,runFrom,index,rel){
    return Math.max(0,rel-windows[runFrom[index]].start);
  }
  function drawClipCut(g,video,text,elapsed,duration){
    // 실제 영상 길이 이후에는 마지막 프레임 고정이나 반복 없이 마젠타(#FF00FF).
    if(elapsed>=duration || video.ended || video.readyState<2 || video.seeking){
      drawMagentaCut(g,text);return;
    }
    drawFill(g,video,1,0.5,0.5);
    drawCutText(g,text);
  }

  // ---------- ⑪ 전체 영상 타임라인에서 자막 없는 썸네일 프레임 선택 ----------
  // 프로젝트별 시간(thumbTime)은 기존 프로젝트 JSON에 저장한다. 새 API/과금 호출은 없다.
  function thumbnailDuration(proj){
    var timeline=(proj && proj.cutTimeline)||[];
    var last=timeline.length ? Number(timeline[timeline.length-1].end)||0 : 0;
    var voice=Number(proj && proj.ttsDuration);
    return VIDEO.coverHold+(Number.isFinite(voice)&&voice>0 ? voice : last);
  }
  function thumbnailLastFrame(proj){
    return Math.max(0,thumbnailDuration(proj)-1/VIDEO.fps);
  }
  function thumbnailSelectedTime(proj){
    var v=Number(proj && proj.thumbTime);
    if(!proj || proj.thumbTime===undefined || proj.thumbTime===null || !Number.isFinite(v)){
      v=0; // 이전 숙소는 기존 커버 사진으로 시작. 슬라이더 이동 시에만 다른 시점으로 바뀜
    }
    return Math.max(0,Math.min(thumbnailLastFrame(proj),v));
  }
  function thumbClock(time){
    var v=Math.max(0,Number(time)||0),m=Math.floor(v/60),s=v-m*60;
    return m+":"+s.toFixed(2).padStart(5,"0");
  }
  // 최종 릴스 makeVideo()의 ⑩ 사진 매핑/컷 타임라인/연속 사진 재생 시간과 같은 원리를 사용.
  function thumbnailFramePlan(proj, time){
    var photos=(proj && proj.photos)||[], windows=(proj && proj.cutTimeline)||[];
    if(!photos.length)return null;
    var at=Math.max(0,Math.min(thumbnailLastFrame(proj),Number(time)||0));
    var photoSource=function(pi){
      var p=photos[pi], e=(proj.edits||{})[p.id];
      return (e && e.id)||p.id;
    };
    if(at<VIDEO.coverHold || !windows.length){
      var ci=(typeof proj.coverPhoto==="number" && proj.coverPhoto>=0 &&
        proj.coverPhoto<photos.length)?proj.coverPhoto:0;
      return {kind:"image",path:photoSource(ci),photoIndex:ci,zoom:1,cover:true,time:at};
    }
    var rel=at-VIDEO.coverHold, n=windows.length, idx=0;
    while(idx<n-1 && windows[idx+1].start<=rel)idx++;
    var map=proj.map||[];
    var photoIndex=function(i){
      var v=map[i];
      return (typeof v==="number" && v>=0 && v<photos.length)
        ?v:Math.min(photos.length-1,Math.floor(i*photos.length/n));
    };
    var pi=photoIndex(idx),from=idx,to=idx;
    while(from>0 && photoIndex(from-1)===pi)from--;
    while(to<n-1 && photoIndex(to+1)===pi)to++;
    var clip=renderClipForPhoto(proj,photos[pi]);
    if(clip){
      return {kind:"video",path:clip.id,photoIndex:pi,time:at,
        elapsed:Math.max(0,rel-windows[from].start),clipDuration:Number(clip.dur)||0,
        runFrom:from};
    }
    var runStart=windows[from].start,runEnd=windows[to].end;
    var fraction=Math.max(0,Math.min(1,(rel-runStart)/Math.max(0.01,runEnd-runStart)));
    return {kind:"image",path:photoSource(pi),photoIndex:pi,time:at,
      zoom:1+0.18*fraction,runFrom:from};
  }
  // HTMLVideoElement은 재생하지 않고 seeked로 특정 프레임을 디코딩한다.
  function seekClipFrame(video, time){
    return new Promise(function(resolve,reject){
      var last=Math.max(0,video.duration-1/VIDEO.fps);
      var target=Math.max(0,Math.min(last,Number(time)||0));
      if(Math.abs(video.currentTime-target)<0.015 && video.readyState>=2 && !video.seeking){
        resolve();return;
      }
      var done=false;
      var timer=setTimeout(function(){finish(new Error("선택한 영상 프레임을 불러오는 시간이 초과됐어요."));},12000);
      function cleanup(){
        clearTimeout(timer);
        video.removeEventListener("seeked",check);
        video.removeEventListener("loadeddata",check);
        video.removeEventListener("error",fail);
      }
      function finish(err){
        if(done)return;done=true;cleanup();err?reject(err):resolve();
      }
      function check(){if(!video.seeking && video.readyState>=2)finish(null);}
      function fail(){finish(new Error("영상 프레임 디코딩에 실패했어요."));}
      video.addEventListener("seeked",check);
      video.addEventListener("loadeddata",check);
      video.addEventListener("error",fail);
      try{
        video.pause();
        video.currentTime=target;
        check();
      }catch(e){finish(e);}
    });
  }
  function drawThumbnailFrame(g, plan, media){
    // ⑪ 본문 자막 없이 선택 시점의 사진/영상/마젠타만 먼저 그린다.
    if(plan.kind==="video"){
      if(plan.elapsed>=media.duration || media.ended || media.readyState<2 || media.seeking){
        drawMagentaCut(g,"");return "마젠타";
      }
      drawFill(g,media,1,0.5,0.5);
      return "Kling 영상";
    }
    drawFill(g,media,plan.zoom,0.5,0.5);
    return plan.cover?"커버 구간의 원본 사진":"사진";
  }
  // 선택한 장면 위에 ⑪ 첫 커버와 동일한 어둡기·커버 타이틀을 합성한다.
  // 일반 본문 자막은 한 줄도 그리지 않는다.
  function drawSelectedCover(g,plan,media,proj){
    var label=drawThumbnailFrame(g,plan,media);
    var cover=(proj.cover||"").split("\n").map(function(x){return x.trim()});
    drawCoverOverlay(g,cover);
    return label;
  }
  // 최종 영상 제작 전 선택한 프레임을 독립 캔버스에 확정한다.
  // 이를 커버 0.5초 동안 그대로 사용하므로 드래그/디코딩 타이밍에 따라 첫 장이 바뀌지 않는다.
  async function makeSelectedCoverCanvas(proj){
    var plan=thumbnailFramePlan(proj,thumbnailSelectedTime(proj));
    if(!plan)throw new Error("썸네일로 사용할 사진이 없어요.");
    var canvas=document.createElement("canvas");
    canvas.width=VIDEO.w;canvas.height=VIDEO.h;
    var media=null;
    try{
      media=plan.kind==="video"?await loadClipVideo(blobUrl(plan.path))
                                 :await loadImg(blobUrl(plan.path));
      if(plan.kind==="video" && plan.elapsed<media.duration)await seekClipFrame(media,plan.elapsed);
      drawSelectedCover(canvas.getContext("2d"),plan,media,proj);
      return canvas;
    }finally{
      if(plan.kind==="video" && media)releaseClipVideos([{video:media}]);
    }
  }

  var thumbMedia=null,thumbRequestSeq=0,thumbRenderQueue=Promise.resolve(),thumbDebounce=null,thumbProjectId=null;
  function releaseThumbnailMedia(){
    if(thumbMedia && thumbMedia.kind==="video")releaseClipVideos([{video:thumbMedia.value}]);
    thumbMedia=null;
  }
  async function thumbnailMediaFor(plan){
    if(thumbMedia && thumbMedia.path===plan.path && thumbMedia.kind===plan.kind)return thumbMedia.value;
    releaseThumbnailMedia();
    var item=plan.kind==="video" ? await loadClipVideo(blobUrl(plan.path))
                                  : await loadImg(blobUrl(plan.path));
    thumbMedia={kind:plan.kind,path:plan.path,value:item};
    return item;
  }
  function requestThumbnailFrame(proj, time){
    var seq=++thumbRequestSeq;
    // 드래그 중 연속 seek가 충돌하지 않도록 큐로 직렬화하고 지난 요청은 버린다.
    var pending=thumbRenderQueue.catch(function(){}).then(async function(){
      if(seq!==thumbRequestSeq || current!==proj)return false;
      var canvas=document.getElementById("thumbframe");
      if(!canvas)return false;
      var plan=thumbnailFramePlan(proj,time);
      if(!plan)return false;
      var status=document.getElementById("thumbstat");
      if(status){status.textContent="프레임 "+thumbClock(time)+" 불러오는 중...";status.className="status";}
      try{
        var media=await thumbnailMediaFor(plan);
        if(seq!==thumbRequestSeq || current!==proj || canvas!==document.getElementById("thumbframe"))return false;
        if(plan.kind==="video" && plan.elapsed<media.duration)await seekClipFrame(media,plan.elapsed);
        if(seq!==thumbRequestSeq || current!==proj || canvas!==document.getElementById("thumbframe"))return false;
        var g=canvas.getContext("2d");
        var label=drawSelectedCover(g,plan,media,proj);
        if(status){status.textContent="프레임 "+thumbClock(time)+" · "+label+" · 커버 타이틀 표시 / 본문 자막 없음";status.className="status";}
        return true;
      }catch(e){
        if(status && seq===thumbRequestSeq){
          status.textContent="썸네일 프레임을 불러오지 못했어요: "+((e&&e.message)||e);
          status.className="status bad";
        }
        throw e;
      }
    });
    thumbRenderQueue=pending.catch(function(){});
    return pending;
  }
  async function makeThumb(){
    var btn=document.getElementById("savethumb");
    var slider=document.getElementById("thumbtime");
    var canvas=document.getElementById("thumbframe");
    var status=document.getElementById("thumbstat");
    if(!btn || !slider || !canvas || !timelineReady())return;
    var proj=current,time=thumbnailSelectedTime(proj);
    btn.disabled=true;slider.disabled=true;
    clearTimeout(thumbDebounce);
    try{
      if(!(await requestThumbnailFrame(proj,time)))throw new Error("선택한 화면이 바뀌었어요. 다시 눌러주세요.");
      if(current!==proj || document.getElementById("thumbframe")!==canvas)throw new Error("프로젝트 화면이 바뀌었어요.");
      var blob=await new Promise(function(resolve){canvas.toBlob(resolve,"image/jpeg",0.95);});
      if(!blob)throw new Error("JPG 변환에 실패했어요.");
      if(!downloads)throw new Error("이 화면에서는 저장을 못 해요.");
      await downloads.save({filename:((proj.folder||"reels").trim())+"_cover.jpg",data:blob});
      if(status){status.textContent="커버 타이틀이 포함된 썸네일 "+thumbClock(time)+" 프레임을 저장했어요.";status.className="status";}
    }catch(e){
      if(status){status.textContent=(e&&e.message)||"썸네일을 저장하지 못했어요.";status.className="status bad";}
    }finally{
      if(document.getElementById("savethumb")===btn){btn.disabled=false;slider.disabled=false;}
    }
  }

  function pickMime(){
    var want=['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4',
              'video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    for(var i=0;i<want.length;i++){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(want[i])) return want[i];
    }
    return null;
  }

  async function makeVideo(){
    var st=function(m,bad){var e=document.getElementById("renderstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    var photos=current.photos||[];
    if(!timelineReady()){
      st("⑦ 음성 싱크를 먼저 완료해주세요. 0.9초 균등 배치로 만들지 않습니다.",true);return;
    }
    if(!current.tts || !current.ttsRaw || current.ttsProcessedRawId!==current.ttsRaw.id){
      st("⑥ 후처리 음성 파일이 없어요.",true);return;
    }
    if(!photos.length){ st("⑧ 사진 소스를 먼저 올려주세요.",true); return; }
    if(!window.MediaRecorder){ st("이 브라우저는 영상 녹화를 지원하지 않아요.",true); return; }
    var mime=pickMime();
    if(!mime){ st("이 브라우저가 만들 수 있는 영상 형식이 없어요.",true); return; }

    st("사진을 준비하는 중...");
    if(fontsReady.cover){
      try{ await document.fonts.load('110px "ReelCover"'); }catch(e){}
    }
    if(fontsReady.body){
      try{ await document.fonts.load('72px "ReelBody"'); }catch(e){}
    }
    // ⑩의 선택은 사진 ID 그대로 유지한다. 유효한 ⑨ 영상이 있으면 ⑪에서만 MP4를 우선한다.
    var renderMap=ensureMap(), selectedPhotos={};
    renderMap.forEach(function(pi){ selectedPhotos[pi]=true; });
    var imgs=[], clipVideos=[], coverCanvas=null;
    try{
      for(var i=0;i<photos.length;i++){
        var clip=selectedPhotos[i] ? renderClipForPhoto(current,photos[i]) : null;
        if(clip){
          var video=await loadClipVideo(blobUrl(clip.id));
          clipVideos[i]={video:video,duration:video.duration};
          imgs.push(video);
        }else{
          imgs.push(await loadImg(blobUrl(srcId(photos[i]))));
        }
      }
      // 선택한 ⑪ 전체 영상 시점에서 커버 한 장을 캡처한다.
      // 기존 사진, Kling MP4, 부족 구간 마젠타 모두 사용 가능하며 커버 문구까지 합성한다.
      coverCanvas=await makeSelectedCoverCanvas(current);
    }catch(e){
      releaseClipVideos(clipVideos);
      st("사진·Kling 영상 준비 실패: "+((e&&e.message)||"파일을 확인해주세요."),true); return;
    }

    var cuts=(current.script||"").split("\n").map(function(x){return x.trim()})
             .filter(function(x){return x});

    // 두 트랙을 따로 받아 각자 음량을 먹인 뒤 한 갈래로 합친다.
    var actx=null, dest=null, narBuf=null, bgmBuf=null;
    var useNar=!!(current.tts && !current.ttsMute);
    var useBgm=!!(current.bgm && !current.bgmMute);
    if(useNar || useBgm){
      st("소리를 준비하는 중...");
      try{
        actx=new (window.AudioContext||window.webkitAudioContext)();
        if(actx.state==="suspended") await actx.resume();
        dest=actx.createMediaStreamDestination();
        if(useNar) narBuf=await loadAudio(actx, current.tts);
        if(useBgm) bgmBuf=await loadAudio(actx, current.bgm);
      }catch(e){
        st("소리를 불러오지 못했어요. 음성 싱크가 깨질 수 있어 영상 제작을 중단합니다.",true);
        if(actx)try{await actx.close();}catch(e2){}
        releaseClipVideos(clipVideos);
        return;
      }
    }

    var cv=document.createElement("canvas");
    cv.width=VIDEO.w; cv.height=VIDEO.h;
    var g=cv.getContext("2d");
    var stream=cv.captureStream(VIDEO.fps);
    if(dest) dest.stream.getAudioTracks().forEach(function(tr){ stream.addTrack(tr); });
    var chunks=[], rec;
    try{ rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000}); }
    catch(e){
      st("녹화를 시작하지 못했어요.",true);
      if(actx)try{await actx.close();}catch(e2){}
      releaseClipVideos(clipVideos);
      return;
    }
    rec.ondataavailable=function(ev){ if(ev.data && ev.data.size) chunks.push(ev.data); };

    var done=new Promise(function(res){ rec.onstop=res; });
    rec.start();

    // 어떤 컷에 어떤 사진을 쓸지는 ⑤ 컷 맞추기에서 정한 값을 그대로 쓴다.
    // 같은 사진이 연달아 나오면 켄번즈 줌을 그 구간 전체에 걸쳐 이어서 멈춘 느낌을 없앤다.
    var N=cuts.length || imgs.length;
    var mp=renderMap;
    var span=[], runFrom=[], runLen=[];
    for(var ci=0; ci<N; ci++){
      var v=mp[ci];
      span.push((typeof v==="number" && v>=0 && v<imgs.length)
                ? v : Math.min(imgs.length-1, Math.floor(ci*imgs.length/N)));
    }
    for(var ci2=0; ci2<N; ci2++){
      var a2=ci2; while(a2>0 && span[a2-1]===span[ci2]) a2--;
      var b2=ci2; while(b2<N-1 && span[b2+1]===span[ci2]) b2++;
      runFrom.push(a2); runLen.push(b2-a2+1);
    }

    // 자막별 실제 발화 시각을 사용한다. 컷당 0.9초/음성 균등분할 금지.
    var coverMs=VIDEO.coverHold*1000;
    var windows=current.cutTimeline;
    if(windows.length!==N){
      rec.stop(); await done;
      if(actx)try{await actx.close();}catch(e){}
      releaseClipVideos(clipVideos);
      st("컷 수와 싱크 수가 달라요. ⑦에서 다시 배치해주세요.",true);return;
    }
    var voiceMs=narBuf ? narBuf.duration*1000 : Number(current.ttsDuration)*1000;
    var total=coverMs+voiceMs;

    var vol=function(k,d){
      var v=current[k+"Vol"];
      return (typeof v==="number") ? v : d;
    };
    if(actx){
      if(narBuf){
        var ns=actx.createBufferSource(); ns.buffer=narBuf;
        var ng=actx.createGain(); ng.gain.value=vol("tts",1);
        ns.connect(ng).connect(dest);
        ns.start(actx.currentTime + coverMs/1000);     // 커버가 지나고 말이 시작된다
      }
      if(bgmBuf){
        var bs=actx.createBufferSource(); bs.buffer=bgmBuf; bs.loop=true;
        var bg=actx.createGain(); bg.gain.value=vol("bgm",0.22);
        // 끝에서 뚝 끊기지 않게 마지막 0.6초를 줄인다
        var endT=actx.currentTime + total/1000;
        bg.gain.setValueAtTime(vol("bgm",0.22), Math.max(actx.currentTime, endT-0.6));
        bg.gain.linearRampToValueAtTime(0.0001, endT);
        bs.connect(bg).connect(dest);
        bs.start();
      }
    }

    var t0=performance.now(), activeVideo=null, activeRun=-1, playbackError=null;

    try{
      await new Promise(function(res,rej){
        function frame(){
          try{
            if(playbackError) throw playbackError;
            var el=performance.now()-t0;
            if(el>=total){ res(); return; }
            if(el<coverMs){ g.drawImage(coverCanvas,0,0,VIDEO.w,VIDEO.h); }
            else{
              var rel=(el-coverMs)/1000, lo=0, hi=N-1;
              while(lo<hi){
                var mid=(lo+hi+1)>>1;
                if(windows[mid].start<=rel)lo=mid;else hi=mid-1;
              }
              var idx=lo, pi=span[idx];
              var runStart=windows[runFrom[idx]].start;
              var runEnd=windows[runFrom[idx]+runLen[idx]-1].end;
              var k=Math.max(0,Math.min(1,(rel-runStart)/Math.max(0.01,runEnd-runStart)));
              var clip=clipVideos[pi];
              if(clip){
                // 같은 사진의 연속 컷이면 영상 시간도 계속 진행한다.
                var elapsed=clipElapsedInRun(windows,runFrom,idx,rel);
                if(activeVideo!==clip.video || activeRun!==runFrom[idx]){
                  if(activeVideo) activeVideo.pause();
                  activeVideo=clip.video; activeRun=runFrom[idx];
                  clip.video.pause();
                  if(elapsed<clip.duration){
                    if(clip.video.currentTime>0.05) clip.video.currentTime=0;
                    var playback=clip.video.play();
                    if(playback && playback.catch) playback.catch(function(e){
                      playbackError=new Error("Kling MP4 재생 실패: "+((e&&e.message)||e));
                    });
                  }
                }
                if(elapsed>=clip.duration){
                  clip.video.pause(); // 남는 시간은 반복하지 않고 아래 drawClipCut이 마젠타로 그림
                }else if(!clip.video.seeking && Math.abs(clip.video.currentTime-elapsed)>0.45){
                  // 브라우저 디코딩이 실제 발화 시간과 어긋나면 타임라인을 따라간다.
                  clip.video.currentTime=Math.min(elapsed,Math.max(0,clip.duration-0.04));
                }
                drawClipCut(g,clip.video,cuts[idx]||"",elapsed,clip.duration);
              }else{
                if(activeVideo){activeVideo.pause();activeVideo=null;activeRun=-1;}
                drawCut(g,imgs[pi],cuts[idx]||"",k);
              }
            }
            st("만드는 중... "+Math.round(el/total*100)+"%  (화면을 끄지 마세요)");
            requestAnimationFrame(frame);
          }catch(e){rej(e);}
        }
        requestAnimationFrame(frame);
      });
    }catch(e){
      try{rec.stop();await done;}catch(x){}
      if(actx){try{await actx.close();}catch(x){}}
      releaseClipVideos(clipVideos);
      st("영상 렌더링 실패: "+((e&&e.message)||String(e)),true);
      return;
    }

    rec.stop();
    await done;
    if(actx){ try{ await actx.close(); }catch(e){} }
    releaseClipVideos(clipVideos);

    var ext = mime.indexOf("mp4")>=0 ? "mp4" : "webm";
    var blob=new Blob(chunks,{type:mime});
    st("저장할게요... "+(blob.size/1048576).toFixed(1)+"MB / ."+ext);
    if(!downloads){ st("이 화면에서는 저장을 못 해요.",true); return; }
    try{
      await downloads.save({filename:((current.folder||"reels").trim())+"."+ext, data:blob});
      st(ext==="mp4" ? "완성했어요. 인스타에 바로 올리시면 돼요."
        : "완성했지만 형식이 webm 이에요. 인스타는 webm 을 안 받아서 mp4 변환이 필요해요.", ext!=="mp4");
    }catch(e){
      st(e&&e.code==="declined"?"취소했어요.":"저장하지 못했어요.",true);
    }
  }

  // ---------- 자동저장 ----------
  // 폰에서는 다른 앱을 보는 사이 탭이 통째로 정리되는 일이 잦다.
  // 타이핑이 멈추면 바로 저장해서, 화면이 날아가도 입력이 남게 한다.
  var saveTimer=null, saveMark=null;

  function markSaving(){
    saveMark=document.getElementById("savemark");
    if(saveMark) saveMark.textContent="저장 중...";
  }
  function markSaved(ok){
    saveMark=document.getElementById("savemark");
    if(saveMark) saveMark.textContent = ok? "저장됨" : "저장 안 됨";
  }

  function autosave(){
    if(!current) return;
    markSaving();
    clearTimeout(saveTimer);
    saveTimer=setTimeout(flushSave, 1200);
  }

  function flushSave(){
    clearTimeout(saveTimer);
    if(!current) return;
    if(!(current.folder||"").trim() && !(current.name||"").trim()) return;
    if(projects.indexOf(current)<0) projects.unshift(current);
    persist(current).then(markSaved);
  }

  // 앱을 내리거나 탭을 숨길 때는 기다리지 않고 바로 저장한다.
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden") flushSave();
  });
  window.addEventListener("pagehide", flushSave);
  window.addEventListener("blur", flushSave);

  // ---------- 편집 ----------
  // ---------- ⑨ 이미지 가공 ----------
  // ⑧ 사진 한 장 한 장에 그 사진만의 프롬프트와 레퍼런스를 붙여 GPT Image 2.5 Sunburst 로
  // 원본 사진의 가로세로 비율로 생성한다. 공통 프롬프트나 공통 레퍼런스는 없다.
  // 결과가 있는 사진은 ⑩ 컷 배치와 ⑪ 영상에서 결과로 바뀐다. 결과를 지우면 원본으로 돌아간다.
  // 가공 사진이 생기면 같은 줄에서 Kling 3.0 Pro(Omni) 로 9:16 영상(클립)도 만들 수 있다.
  // ⑩은 기존 사진 선택을 유지하며, ⑪은 유효한 클립이 있으면 MP4를 우선 사용한다.
  //
  // 저장 구조
  //   current.editSpecs[사진id] = { prompt:"...", refs:[{id,w,h,size}], vprompt:"...", vdur:"5" }  ← 사진별 입력
  //   current.edits[사진id]     = { id, w, h, ... }                        ← 사진별 결과
  //   current.clips[사진id]     = { id, size, dur, fromEdit, inputs, at }  ← 사진별 영상
  //   current.clipJobs[사진id]  = { op, at, dur, fromEdit, inputs }        ← 만드는 중인 영상 작업
  var EDIT = {
    maxRefs:15,
    qualities:[["medium","보통 · 빠름"],["high","높음 · 기본"],["xhigh","아주 높음 · 느림"],["max","최고 · 가장 느림"]]
  };
  var editBusy=false, editTimer=null;
  // Kling 3.0 Pro(Omni) 레퍼런스 영상. 이미지는 최대 7장(Kling Omni 한도):
  // 가공 사진(image_1) → 원본(image_2) → 이 사진의 레퍼런스(image_3~7).
  // 함수 쪽 한도(supabase/functions/lodging-reels-clip/clip.ts)와 같아야 한다.
  var CLIP = {
    maxInputs:7, maxPrompt:2500, minDur:3, maxDur:15, dur:5, minSide:300, maxRatio:2.5,
    pollMs:8000, giveUpMs:40*60*1000, maxMisses:15
  };
  var clipPollTimer=null, clipClock=null, clipInflight={}, clipErrors={}, clipMisses={};

  // ⑩·⑪ 이 쓸 실제 이미지. 가공본이 있으면 그걸, 없으면 원본.
  function srcId(p){
    var e = p && current && current.edits ? current.edits[p.id] : null;
    return (e && e.id) || (p && p.id);
  }
  // ⑪ 사진 소스 선택은 유지하고, 현재 가공본에서 만든 정상 영상이 있을 때만 MP4를 우선한다.
  // 가공 사진을 다시 만들거나 결과를 지운 경우에는 과거 영상을 쓰지 않는다.
  function renderClipForPhoto(proj, photo){
    if(!proj || !photo) return null;
    var e=(proj.edits||{})[photo.id], c=(proj.clips||{})[photo.id];
    return (c && c.id && e && e.id && c.fromEdit===e.id) ? c : null;
  }

  // 읽기 전용. 아직 입력이 없으면 빈 값을 돌려준다(프로젝트를 건드리지 않는다).
  // 공통 프롬프트 시절(editPrompt + editNotes)에 적어 둔 글이 있으면 그 사진의 프롬프트로 이어 받는다.
  function peekSpec(proj, pid){
    var sp=(proj.editSpecs||{})[pid];
    if(sp) return {prompt:sp.prompt||"", refs:sp.refs||[], vprompt:sp.vprompt||"", vdur:sp.vdur==null?"":String(sp.vdur)};
    var legacy=[(proj.editPrompt||"").trim(), ((proj.editNotes||{})[pid]||"").trim()].filter(Boolean).join("\n");
    return {prompt:legacy, refs:[], vprompt:"", vdur:""};
  }
  // 쓰기용. 없으면 만들어서 프로젝트에 붙인다.
  function specOf(proj, pid){
    proj.editSpecs=proj.editSpecs||{};
    if(!proj.editSpecs[pid]){
      var seed=peekSpec(proj, pid);
      proj.editSpecs[pid]={prompt:seed.prompt, refs:seed.refs.slice(), vprompt:seed.vprompt, vdur:seed.vdur};
    }
    return proj.editSpecs[pid];
  }

  // Sunburst generateImage: Image 1은 실제 숙소 원본 사진, Image 2부터는 사진별 레퍼런스다.
  // 원본은 실제 공간 참고, 카메라/행동은 사진별 지시 우선. 특정 인물·포즈·시점의 전역 강제 없음.
  function editHead(proj, refCount){
    var keepReal=proj.editKeepReal!==false;
    var head="Image 1 shows the real location where the requested scene takes place."+
      " Use it to understand the place and its visual identity, not as a fixed camera frame to repeat."+
      " Create a new photorealistic photograph as if someone physically present at this location captured the moment described by the user."+
      " The result should feel like an independent photograph taken here, rather than a retouch or cut-and-paste of Image 1.";
    if(refCount===1) head+=" Image 2 is an additional visual reference.";
    else if(refCount>1) head+=" Images 2-"+(refCount+1)+" are additional visual references.";
    if(keepReal){
      head+=" Preserve the actual architecture, spatial proportions and real-world relationships of major furniture, windows and permanent facilities in Image 1."+
        " Moving the camera can change their appearance and position within the picture without changing their actual arrangement."+
        " Do not invent extra rooms, windows or built-in facilities.";
    }
    if(refCount){
      head+=" Use the additional images as references for relevant people, appearance, clothing, actions, props, lighting, atmosphere or photographic composition according to the user's instructions.";
      if(keepReal) head+=" Image 1 remains the reference for the actual accommodation layout.";
    }
    return head+" Follow the user's specific instructions for subject, action, expression, gaze and camera perspective."+
      " When no camera setup is specified, choose a natural, non-formulaic viewpoint, camera height, distance and framing suited to the scene; the original viewpoint is not a required default."+
      " If people are requested, depict them naturally engaged in the described activity within the space."+
      " When no pose is specified, let gestures and body language arise from the moment rather than a stock portrait pose."+
      " Preserve Image 1's original width-to-height aspect ratio without stretching or padding.";
  }
  // ---------- ⑨ 요소 (Kling Element) ----------
  // 요소는 이름 + 기준 사진 한 장만 있으면 사진 가공/영상화에서 바로 사용 가능.
  // 다른 각도·설명은 선택사항. Kling 서버 고정 요소는 공식 API 규격상 추가 각도 1장 이상 필요.
  // [이름] 호출 시 준비된 Kling 요소면 element_id, 아니면 기준 사진을 @image_N 레퍼런스로 전달한다.
  //   current.elements = [{ key, name, desc, front:{id,w,h,size}, angles:[{id,w,h,size}],
  //                         kling:{ status:"pending"|"ready"|"failed", taskId, elementId, sig, at, msg } }]
  var ELEM = { nameMax:20, descMax:100, maxAngles:3, minSide:300, maxRatio:2.5, giveUpMs:30*60*1000 };
  // elemDrafts: 규칙에 안 맞아 반영하지 못한 이름(칸에 그대로 남겨 고치게 한다). 저장하지 않는다.
  var elemInflight={}, elemErrors={}, elemDrafts={};

  function elemList(proj){ return (proj && proj.elements) || []; }
  function elemByKey(proj, key){ return elemList(proj).find(function(x){ return x.key===key; }) || null; }
  function elemByName(proj, name){ return elemList(proj).find(function(x){ return x.name && x.name===name; }) || null; }
  function elemPhotos(el){ return [el.front].concat(el.angles||[]).filter(function(x){ return x && x.id; }); }
  // 등록 당시 사진 묶음. 사진이 바뀌면 Kling 요소는 다시 등록해야 한다.
  function elemSig(el){ return elemPhotos(el).map(function(x){ return x.id; }).join("|"); }
  // 이름 규칙. 예약어 · [ ] @ 금지, 서로 포함되는 이름 금지(Kling 문서 권고: @Zhang / @ZhangSan).
  function elemNameProblem(proj, name, selfKey){
    name=String(name||"").trim();
    if(!name) return "이름을 적어주세요.";
    if(name.length>ELEM.nameMax) return "이름은 "+ELEM.nameMax+"자까지예요.";
    if(/[\[\]@\n]/.test(name)) return "이름에 [ ] @ 는 쓸 수 없어요.";
    if(/^(원본|가공|삭제됨|레퍼런스\s*\d+)$/.test(name)) return "「"+name+"」 — 미리 정해진 이름이라 쓸 수 없어요.";
    var hit=elemList(proj).find(function(x){
      return x.key!==selfKey && x.name && (x.name.indexOf(name)>=0 || name.indexOf(x.name)>=0);
    });
    if(hit) return hit.name===name ? "같은 이름의 요소가 있어요." : "「"+hit.name+"」 — 이름이 서로 겹쳐요. 포함되지 않게 지어주세요.";
    return "";
  }
  // draft(이름/사진 없음) / local(사진 1장, 즉시 사용) / new(고정 요소 등록 가능)
  // pending/ready/failed/stale은 Kling 고정 요소 상태. 어느 상태든 사진 참조 사용 가능.
  function elemState(proj, el){
    if(!el || !el.name || elemNameProblem(proj, el.name, el.key) ||
       !(el.front && el.front.id)) return "draft";
    if(!(el.angles||[]).length) return "local";
    var k=el.kling;
    if(!k || !k.status) return "new";
    if(k.status==="pending") return "pending";
    if(k.status==="failed") return "failed";
    if(k.status==="ready") return k.sig===elemSig(el) && k.elementId ? "ready" : "stale";
    return "new";
  }

  // ---------- [이름] 부르기 ----------
  // 프롬프트의 [원본] [가공] [레퍼런스N] [요소이름] 을 찾는다. 보낼 때 단계별 태그로 바꾼다.
  // 사용자는 태그를 볼 일이 없다.
  var MENTION_RE=/\[([^\[\]\n]{1,30})\]/g;
  function mentionsOf(proj, pid, text, stage){
    var refsN=peekSpec(proj, pid).refs.length, out=[], m, re=new RegExp(MENTION_RE.source, "g");
    while((m=re.exec(String(text||"")))){
      var name=m[1].trim(), t={raw:m[0], name:name, kind:"unknown"}, rm=name.match(/^레퍼런스\s*(\d+)$/);
      if(name==="원본") t.kind="original";
      else if(name==="가공") t.kind = stage==="edit" ? "bad_edited" : "edited";
      else if(rm){ t.n=+rm[1]; t.kind = t.n>=1 && t.n<=refsN ? "ref" : "bad_ref"; }
      else if(name==="삭제됨") t.kind="deleted";
      else { var el=elemByName(proj, name); if(el){ t.kind="element"; t.el=el; } }
      out.push(t);
    }
    return out;
  }
  // 프롬프트에 쓴 요소. 쓴 순서대로, 겹치지 않게.
  function mentionedElements(proj, pid, text, stage){
    var list=[], keys={};
    mentionsOf(proj, pid, text, stage).forEach(function(t){
      if(t.kind==="element" && !keys[t.el.key]){ keys[t.el.key]=1; list.push(t.el); }
    });
    return list;
  }
  // 줄에 표시만 하는 안내. 보내는 건 막지 않는다(글자 그대로 간다).
  function mentionWarnings(proj, pid, text, stage){
    var refsN=peekSpec(proj, pid).refs.length, w=[], said={};
    mentionsOf(proj, pid, text, stage).forEach(function(t){
      var msg="";
      if(t.kind==="unknown") msg=t.raw+" — 등록된 요소가 아니에요";
      else if(t.kind==="deleted") msg="[삭제됨] — 지운 요소예요. 다른 요소로 바꿔주세요";
      else if(t.kind==="bad_edited") msg="[가공] — 사진 가공에서는 쓸 수 없어요 (지금 만드는 결과물이에요)";
      else if(t.kind==="bad_ref") msg=t.raw+" — 이 줄 레퍼런스는 "+refsN+"장이에요";
      else if(t.kind==="element" && !elemPhotos(t.el).length) msg=t.raw+" — 요소에 사진이 없어요";
      if(msg && !said[msg]){ said[msg]=1; w.push(msg); }
    });
    return w;
  }
  // [이름] 을 바꾼다. map(t) 가 문자열을 돌려주면 그걸로, null 이면 그대로 둔다.
  function replaceMentions(proj, pid, text, stage, map){
    var toks=mentionsOf(proj, pid, text, stage), i=0;
    return String(text||"").replace(new RegExp(MENTION_RE.source, "g"), function(raw){
      var t=toks[i++], r=t ? map(t) : null;
      return r==null ? raw : r;
    });
  }

  // 사진 가공 레퍼런스: 그 줄 레퍼런스 → 프롬프트에 쓴 요소의 사진들(쓴 순서대로). Image 1 은 원본.
  function editRefPlan(proj, pid){
    var sp=peekSpec(proj, pid), ids=sp.refs.map(function(r){ return r.id; }), groups=[];
    mentionedElements(proj, pid, sp.prompt, "edit").forEach(function(el){
      var ph=elemPhotos(el);
      if(!ph.length) return;
      groups.push({el:el, from:ids.length+2, to:ids.length+1+ph.length});
      ph.forEach(function(x){ ids.push(x.id); });
    });
    return {ids:ids, groups:groups, over:ids.length>EDIT.maxRefs};
  }
  function imagesLabel(from, to){ return from===to ? "Image "+from : "Images "+from+"-"+to; }

  // 모델에 보내는 최종 프롬프트. 요소는 "Images 4-7 show "아이": 설명." 을 앞에 붙이고,
  // 본문의 [원본] [레퍼런스N] [이름] 을 Image 번호로 바꾼다.
  function editPromptText(proj, pid){
    var sp=peekSpec(proj, pid), plan=editRefPlan(proj, pid), byKey={};
    var head=editHead(proj, plan.ids.length);
    plan.groups.forEach(function(g){
      byKey[g.el.key]=g;
      head+=" "+imagesLabel(g.from, g.to)+(g.from===g.to ? " shows" : " show")+' "'+g.el.name+'"'+
        (String(g.el.desc||"").trim() ? ": "+String(g.el.desc).trim() : "")+".";
    });
    var text=replaceMentions(proj, pid, sp.prompt.trim(), "edit", function(t){
      if(t.kind==="original") return "Image 1";
      if(t.kind==="ref") return "Image "+(t.n+1);
      if(t.kind==="element" && byKey[t.el.key]) return t.el.name+" ("+imagesLabel(byKey[t.el.key].from, byKey[t.el.key].to)+")";
      return null;
    });
    return head+"\n\n"+text;
  }

  // 함수로 보낼 요청 본문. 프롬프트가 없으면 만들지 않는다.
  function editRequest(proj, pid){
    var sp=peekSpec(proj, pid);
    if(!sp.prompt.trim()) return null;
    var photo=(proj.photos||[]).find(function(x){ return x.id===pid; }) || {};
    return {
      base: pid,
      baseW: photo.w||0,
      baseH: photo.h||0,
      refs: editRefPlan(proj, pid).ids,
      prompt: editPromptText(proj, pid),
      quality: proj.editQuality||"high"
    };
  }

  // '전부 만들기' 대상: 프롬프트를 적었고 아직 결과가 없는 사진.
  function editPending(proj){
    var ed=proj.edits||{};
    return (proj.photos||[]).filter(function(p){
      return !ed[p.id] && peekSpec(proj, p.id).prompt.trim();
    }).map(function(p){ return p.id; });
  }

  function editAllLabel(proj){
    var n=editPending(proj).length;
    if(n) return '프롬프트 적은 사진 전부 만들기 ('+n+'장)';
    var any=(proj.photos||[]).some(function(p){ return peekSpec(proj, p.id).prompt.trim(); });
    return any ? '프롬프트 적은 사진은 모두 만들었어요' : '프롬프트를 적은 사진이 없어요';
  }

  // ---------- ⑨ 영상화 (Kling 3.0 Pro · Omni) ----------
  // Kling 은 프롬프트에서 입력물을 @id 로 가리킨다. id 는 함수(lodging-reels-clip)가 보내는 순서대로 붙인다:
  // image_1 가공 사진, image_2 원본, image_3~ 이 사진의 레퍼런스, element_1~ 프롬프트에 쓴 요소.
  function clipHead(proj, refCount, els){
    var h="Create a vertical 9:16 photorealistic short-form video that brings the scene in @image_1 to life."+
      " @image_2 is the original photo of the real accommodation.";
    if(proj.editKeepReal!==false){
      h+=" Keep the accommodation's actual architecture, furniture, windows and layout as in @image_2;"+
         " do not add rooms or facilities that are not there.";
    }
    if(refCount===1) h+=" @image_3 is an additional reference.";
    else if(refCount>1) h+=" @image_3 to @image_"+(refCount+2)+" are additional references.";
    if(refCount) h+=" Use the additional references for people, appearance, props, style or atmosphere as described below.";
    (els||[]).forEach(function(el, k){
      h+=" @element_"+(k+1)+" is "+el.name+(String(el.desc||"").trim() ? ": "+String(el.desc).trim() : "")+".";
    });
    return h;
  }
  // 영상 입력: 가공 → 원본 → 그 줄 레퍼런스, 그리고 영상화 프롬프트에 쓴 요소. 합쳐서 7개(Kling Omni 한도).
  // 넘치면 프롬프트에서 부르지 않은 레퍼런스를 뒤에서부터 뺀다. 그래도 넘치면 over(보내기 전에 막는다).
  function clipPlan(proj, pid){
    var e=(proj.edits||{})[pid], sp=peekSpec(proj, pid), named={};
    mentionsOf(proj, pid, sp.vprompt, "clip").forEach(function(t){ if(t.kind==="ref") named[t.n]=1; });
    var mentioned=mentionedElements(proj, pid, sp.vprompt, "clip");
    // Kling 고정 요소가 ready면 element_id를, 나머지는 기준 사진 한 장을 사용한다.
    var els=mentioned.filter(function(el){ return elemState(proj,el)==="ready"; });
    var local=mentioned.filter(function(el){ return elemState(proj,el)!=="ready" && elemPhotos(el).length; });
    var missing=mentioned.filter(function(el){ return !elemPhotos(el).length; });
    var refs=sp.refs.map(function(r, j){ return {n:j+1, id:r.id, w:r.w, h:r.h}; }), dropped=[];
    var room=CLIP.maxInputs-2-els.length-local.length;
    for(var j=refs.length-1; j>=0 && refs.length>room; j--){
      if(!named[refs[j].n]){ dropped.unshift(refs[j].n); refs.splice(j, 1); }
    }
    var refImage={};
    refs.forEach(function(x, k){ refImage[x.n]=k+3; });
    var localRefs=local.map(function(el,k){
      return {el:el, photo:elemPhotos(el)[0], imageIndex:3+refs.length+k};
    });
    var total=2+refs.length+els.length+localRefs.length;
    return {
      images:e && e.id ? [e.id, pid].concat(refs.map(function(x){ return x.id; }),
        localRefs.map(function(x){ return x.photo.id; })) : [],
      refs:refs, refImage:refImage, elements:els, localRefs:localRefs, missing:missing,
      dropped:dropped, total:total, over:total>CLIP.maxInputs
    };
  }
  function clipPromptText(proj, pid){
    var sp=peekSpec(proj, pid), plan=clipPlan(proj, pid), elIdx={}, localIdx={};
    plan.elements.forEach(function(el, k){ elIdx[el.key]=k+1; });
    plan.localRefs.forEach(function(x){ localIdx[x.el.key]=x.imageIndex; });
    var text=replaceMentions(proj, pid, sp.vprompt.trim(), "clip", function(t){
      if(t.kind==="edited") return "@image_1";
      if(t.kind==="original") return "@image_2";
      if(t.kind==="ref" && plan.refImage[t.n]) return "@image_"+plan.refImage[t.n];
      if(t.kind==="element" && elIdx[t.el.key]) return "@element_"+elIdx[t.el.key];
      if(t.kind==="element" && localIdx[t.el.key]) return "@image_"+localIdx[t.el.key];
      return null;
    });
    var head=clipHead(proj, plan.refs.length, plan.elements);
    plan.localRefs.forEach(function(x){
      head+=" @image_"+x.imageIndex+" shows "+x.el.name+
        (String(x.el.desc||"").trim() ? ": "+String(x.el.desc).trim() : "")+
        ". Use this photo as an appearance reference for the named subject.";
    });
    return head+"\n\n"+text;
  }
  // 예전 이름 유지: 영상에 들어가는 이미지(가공 → 원본 → 레퍼런스).
  function clipInputs(proj, pid){ return clipPlan(proj, pid).images; }
  function clipInputsHint(proj, pid){
    var plan=clipPlan(proj, pid), parts=["가공", "원본"];
    var ns=plan.refs.map(function(x){ return x.n; });
    if(ns.length) parts.push("레퍼런스 "+ns.join("·")+"번");
    plan.elements.forEach(function(el){ parts.push(el.name); });
    plan.localRefs.forEach(function(x){ parts.push(x.el.name+"(사진 참조)"); });
    var t="영상에 들어가는 것: "+parts.join(" · ")+" ("+plan.total+"/"+CLIP.maxInputs+")";
    if(plan.dropped.length) t+=" — 자리가 없어 레퍼런스 "+plan.dropped.join("·")+"번은 빠져요";
    if(plan.over) t+=" — 최대 "+CLIP.maxInputs+"개라 프롬프트에서 부른 레퍼런스나 요소를 줄여야 보낼 수 있어요";
    return t;
  }
  // Kling 이미지 조건: 가로·세로 300px 이상, 비율 1:2.5 ~ 2.5:1. 크기를 아는 것만 미리 본다.
  function clipInputProblem(proj, pid){
    var e=(proj.edits||{})[pid] || {}, ph=(proj.photos||[]).find(function(x){ return x.id===pid; }) || {};
    var plan=clipPlan(proj,pid);
    var list=[["가공 사진", e], ["원본", ph]]
      .concat(plan.refs.map(function(r){ return ["레퍼런스 "+r.n+"번", r]; }))
      .concat(plan.localRefs.map(function(x){ return ["요소 「"+x.el.name+"」", x.photo]; }));
    for(var k=0;k<list.length;k++){
      var w=+list[k][1].w||0, h=+list[k][1].h||0;
      if(!(w>0 && h>0)) continue;
      if(Math.min(w,h)<CLIP.minSide) return list[k][0]+"이 너무 작아요 ("+w+"×"+h+"). Kling 은 가로·세로 "+CLIP.minSide+"px 이상만 받아요.";
      if(Math.max(w,h)/Math.min(w,h)>CLIP.maxRatio) return list[k][0]+" 비율이 너무 길어요 ("+w+"×"+h+"). Kling 은 1:2.5 ~ 2.5:1 까지만 받아요.";
    }
    return "";
  }
  // Kling 미등록·등록 중·실패 요소도 기준 사진을 참조하므로 영상 요청을 막지 않는다.
  // 이름/사진이 없거나 이미지·요소 수가 한도를 넘는 경우만 차단한다.
  function clipBlocker(proj, pid){
    var plan=clipPlan(proj, pid);
    if(plan.missing.length) return "["+plan.missing[0].name+"] — 요소 사진을 먼저 추가해주세요.";
    if(plan.over) return "영상에 넣을 이미지·요소가 "+plan.total+"개예요 (최대 "+CLIP.maxInputs+"개). 요소를 줄여주세요.";
    return clipInputProblem(proj, pid);
  }
  // 영상 길이는 사진마다 키보드로 적는다. 비우면 5초. 3~15 정수가 아니면 null(만들기 전에 막는다).
  function clipDuration(proj, pid){
    var raw=String(peekSpec(proj, pid).vdur||"").trim();
    if(!raw) return CLIP.dur;
    if(!/^\d+$/.test(raw)) return null;
    var d=+raw;
    return d>=CLIP.minDur && d<=CLIP.maxDur ? d : null;
  }
  // 함수로 보낼 start 요청. 가공 사진이나 영상화 프롬프트가 없으면 만들지 않는다.
  function clipRequest(proj, pid){
    var e=(proj.edits||{})[pid];
    if(!e || !e.id || !peekSpec(proj, pid).vprompt.trim()) return null;
    var plan=clipPlan(proj, pid);
    return {
      action:"start", projectId:proj.id,
      edited:plan.images[0], original:plan.images[1], refs:plan.images.slice(2),
      elements:plan.elements.map(function(el){ return el.kling && el.kling.elementId ? String(el.kling.elementId) : ""; }),
      prompt:clipPromptText(proj, pid), duration:clipDuration(proj, pid)
    };
  }
  // 줄마다 보여 줄 상태.
  function clipState(proj, pid){
    var job=(proj.clipJobs||{})[pid], c=(proj.clips||{})[pid], e=(proj.edits||{})[pid];
    return {
      job:job||null, clip:c||null,
      // 영상을 만든 뒤 가공 사진을 다시 만들었거나 지웠으면 영상은 옛 사진 기준이다.
      stale:!!(c && (!e || e.id!==c.fromEdit)),
      canMake:!!(e && e.id) && !job
    };
  }
  function clipElapsed(job){
    var s=Math.max(0, Math.round((Date.now()-((job && job.at) || Date.now()))/1000));
    return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  }
  function clipJobIds(proj){ return Object.keys((proj && proj.clipJobs) || {}); }

  // 한 줄의 영상화 칸: 프롬프트 · 레퍼런스 안내 · 영상 만들기/지우기.
  function clipHintText(proj, pid){
    return (proj.edits||{})[pid] ? clipInputsHint(proj, pid) : "가공 사진을 만들면 영상을 만들 수 있어요.";
  }
  function clipControls(p, i, sp, cs){
    var h='<div class="eclip">'+
      '<label class="elab" for="vp_'+i+'">영상화</label>'+
      '<textarea id="vp_'+i+'" data-vprompt="'+esc(p.id)+'" placeholder="'+(i+1)+'번 가공 사진이 어떻게 움직일지 적어주세요. @ 를 치면 요소·사진을 고를 수 있어요">'+esc(sp.vprompt)+'</textarea>'+
      '<p class="hint mwarn" data-vwarn="'+esc(p.id)+'">'+esc(mentionWarnings(current, p.id, sp.vprompt, "clip").join(" · "))+'</p>'+
      '<div class="vdur"><label for="vd_'+i+'">영상 길이</label>'+
        '<input id="vd_'+i+'" data-vdur="'+esc(p.id)+'" type="number" inputmode="numeric" min="'+CLIP.minDur+'" max="'+CLIP.maxDur+'" step="1" '+
        'placeholder="'+CLIP.dur+'" value="'+esc(sp.vdur)+'"'+(clipDuration(current, p.id)===null ? ' class="bad"' : '')+'>'+
        '<span>초 ('+CLIP.minDur+'~'+CLIP.maxDur+', 비우면 '+CLIP.dur+')</span></div>'+
      '<p class="hint" data-vhint="'+esc(p.id)+'">'+esc(clipHintText(current, p.id))+'</p>'+
      '<div class="ebtns">'+
        '<button type="button" data-clip="'+i+'"'+(cs.canMake && !editBusy ? '' : ' disabled')+'>'+
          (cs.job ? '영상 만드는 중' : cs.clip ? '영상 다시 만들기' : '영상 만들기')+'</button>'+
        (cs.job ? '<button type="button" class="ghost" data-clipstop="'+i+'">기다리기 그만</button>'
          : cs.clip ? '<button type="button" class="ghost" data-unclip="'+i+'"'+(editBusy ? ' disabled' : '')+'>영상 지우기</button>' : '')+
      '</div>';
    if(cs.clip){
      var c=cs.clip, meta=[(c.dur||CLIP.dur)+"초 · 9:16"];
      if(c.size) meta.push((c.size/1048576).toFixed(1)+"MB");
      if(c.ms) meta.push("만드는 데 "+clipElapsed({at:Date.now()-c.ms}));
      h+='<p class="hint">'+esc(meta.join(" · "))+'</p>';
    }
    if(cs.stale) h+='<p class="hint">가공 사진이 바뀌었어요. 이 영상은 이전 사진으로 만든 거예요.</p>';
    if(clipErrors[p.id]) h+='<p class="status bad">'+esc(clipErrors[p.id])+'</p>';
    return h+'</div>';
  }

  // 프롬프트를 적는 중이면 커서가 날아가지 않게, 칸에서 나올 때 다시 그린다.
  function renderClipsSoon(proj){
    if(current!==proj) return;
    var a=document.activeElement;
    if(a && view.contains(a) && /^(TEXTAREA|INPUT|SELECT)$/.test(a.tagName)){
      if(!a._clipRerender){
        a._clipRerender=true;
        a.addEventListener("blur",function(){
          a._clipRerender=false;
          setTimeout(function(){ if(current===proj) renderEdit(proj); },0);
        },{once:true});
      }
      return;
    }
    renderEdit(proj);
  }

  // 작업만 걸고 바로 돌아온다. 결과는 clipCheck 가 몇 초마다 확인한다.
  async function clipStart(proj, pid){
    var idx=(proj.photos||[]).findIndex(function(x){ return x.id===pid; });
    if(idx<0) return;
    proj.clipJobs=proj.clipJobs||{};
    if(proj.clipJobs[pid]) return;
    var body=clipRequest(proj, pid);
    if(!body){
      clipErrors[pid]=(proj.edits||{})[pid] ? (idx+1)+"번 영상화 프롬프트를 먼저 적어주세요." : "가공 사진을 먼저 만들어주세요.";
      renderClipsSoon(proj); return;
    }
    if(body.duration===null){
      clipErrors[pid]=(idx+1)+"번 영상 길이는 "+CLIP.minDur+"~"+CLIP.maxDur+"초 사이 정수로 적어주세요.";
      renderClipsSoon(proj); return;
    }
    var bad=clipBlocker(proj, pid);
    if(bad){ clipErrors[pid]=bad; renderClipsSoon(proj); return; }
    if(body.prompt.length>CLIP.maxPrompt){
      clipErrors[pid]="영상화 프롬프트가 너무 길어요 (앞 문장 포함 "+body.prompt.length+"자 / 최대 "+CLIP.maxPrompt+"자).";
      renderClipsSoon(proj); return;
    }
    delete clipErrors[pid];
    // 응답 오기 전에 버튼부터 잠근다. 두 번 눌러 요금이 두 번 나가지 않게.
    var job={op:null, at:Date.now(), dur:body.duration, fromEdit:body.edited, inputs:2+body.refs.length+body.elements.length};
    proj.clipJobs[pid]=job;
    renderClipsSoon(proj);
    try{
      var r=await api(FN.clip,{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
      var t=await r.text(), j=null;
      try{ j=JSON.parse(t); }catch(e){}
      if(!r.ok || !j || j.operation==null){
        var msg=(j && (j.message||j.error)) || t.slice(0,160) || ("HTTP "+r.status);
        if(r.status===404) msg="영상 함수(lodging-reels-clip)가 아직 배포되지 않았어요.";
        throw new Error(msg);
      }
      if(proj.clipJobs[pid]===job){
        job.op=j.operation;
        await persist(proj);
        ensureClipPoll();
      }
    }catch(e){
      if(proj.clipJobs[pid]===job) delete proj.clipJobs[pid];
      clipErrors[pid]=(idx+1)+"번 영상 요청 실패: "+((e && e.message) || String(e));
      console.error("clip start failed", e);
    }
    renderClipsSoon(proj);
  }

  function ensureClipPoll(){
    if(!clipPollTimer) clipPollTimer=setTimeout(clipPollTick, CLIP.pollMs);
    if(!clipClock) clipClock=setInterval(clipClockTick, 1000);
  }
  function clipClockTick(){
    var ids=clipJobIds(current);
    if(!ids.length && !elemPendingKeys(current).length){ clearInterval(clipClock); clipClock=null; return; }
    ids.forEach(function(pid){
      var el=view.querySelector('[data-cliptime="'+pid.replace(/"/g,'\\"')+'"]');
      if(el) el.textContent=clipElapsed(current.clipJobs[pid]);
    });
  }
  // 영상 작업과 요소 등록을 같은 타이머로 확인한다.
  function elemPendingKeys(proj){
    return elemList(proj).filter(function(el){ return el.kling && el.kling.status==="pending"; }).map(function(el){ return el.key; });
  }
  async function clipPollTick(){
    clipPollTimer=null;
    var proj=current;
    if(!proj || !uid) return;
    var ids=clipJobIds(proj), keys=elemPendingKeys(proj);
    if(!ids.length && !keys.length) return;
    await Promise.all(ids.map(function(pid){ return clipCheck(proj, pid); })
      .concat(keys.map(function(k){ return elemCheck(proj, k); })));
    if(clipJobIds(current).length || elemPendingKeys(current).length) ensureClipPoll();
  }

  async function clipCheck(proj, pid){
    var job=(proj.clipJobs||{})[pid];
    if(!job || clipInflight[pid]) return;
    var idx=(proj.photos||[]).findIndex(function(x){ return x.id===pid; });
    var name=(idx+1)+"번 영상";
    var giveUp=async function(msg){
      if((proj.clipJobs||{})[pid]===job) delete proj.clipJobs[pid];
      clipErrors[pid]=msg;
      await persist(proj);
      renderClipsSoon(proj);
    };
    if(!job.op){
      // 요청 도중 페이지를 닫아 작업 번호를 못 받은 경우
      if(Date.now()-job.at>120000) await giveUp(name+" 요청이 중간에 끊겼어요. 다시 만들어주세요.");
      return;
    }
    if(Date.now()-job.at>CLIP.giveUpMs){
      await giveUp(name+"이 40분 넘게 안 끝나서 기다리기를 멈췄어요. 다시 만들어주세요.");
      return;
    }
    clipInflight[pid]=true;
    try{
      var r=await api(FN.clip,{method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"status", projectId:proj.id, operation:job.op})});
      var t=await r.text(), j=null;
      try{ j=JSON.parse(t); }catch(e){}
      if(!r.ok || !j || !j.status){
        // 네트워크·5xx·429 는 다음 차례에 다시 본다. 4xx 이거나 너무 여러 번 연속이면 멈춘다.
        clipMisses[pid]=(clipMisses[pid]||0)+1;
        var hard=r.status>=400 && r.status<500 && r.status!==429;
        if(hard || clipMisses[pid]>=CLIP.maxMisses){
          await giveUp(name+" 확인 실패: "+((j && (j.message||j.error)) || t.slice(0,160) || ("HTTP "+r.status)));
        }
        return;
      }
      clipMisses[pid]=0;
      if(j.status==="pending") return;
      // 기다리는 사이에 사진을 지웠거나 '기다리기 그만'을 눌렀거나 새로 걸었으면 이 결과는 버린다.
      if((proj.clipJobs||{})[pid]!==job){
        if(j.status==="completed" && j.id && !Object.keys(proj.clips||{}).some(function(k){ return proj.clips[k].id===j.id; })){
          try{ await storeDelete(j.id); }catch(e){}
        }
        return;
      }
      if(j.status==="completed" && j.id){
        proj.clips=proj.clips||{};
        var old=proj.clips[pid];
        proj.clips[pid]={id:j.id, size:j.size||0, mime:j.mime||"video/mp4", dur:job.dur, fromEdit:job.fromEdit,
          inputs:job.inputs, at:Date.now(), ms:Date.now()-job.at};
        delete proj.clipJobs[pid];
        delete clipErrors[pid];
        await persist(proj);
        if(old && old.id && old.id!==j.id){ try{ await storeDelete(old.id); }catch(e){} }
        if(current===proj) toast(name+"이 완성됐어요");
        renderClipsSoon(proj);
      }else{
        await giveUp(name+" 만들기 실패: "+(j.message || j.error || "알 수 없는 오류"));
      }
    }catch(e){
      clipMisses[pid]=(clipMisses[pid]||0)+1;
      console.error("clip status failed", e);
    }finally{
      delete clipInflight[pid];
    }
  }

  async function dropClip(pid){
    var c=(current.clips||{})[pid];
    if(!c) return;
    delete current.clips[pid];
    await persist(current);
    try{ await storeDelete(c.id); }catch(e){}
    renderEdit(current);
  }

  // 결과만 안 받는다. 이미 걸린 작업은 Kling 쪽에서 계속 돌고 요금도 나간다.
  async function stopClipJob(pid){
    if(!(current.clipJobs||{})[pid]) return;
    delete current.clipJobs[pid];
    await persist(current);
    renderEdit(current);
  }

  // ---------- ⑨ 요소 관리 ----------
  function newElemKey(){ return "el"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  function elemAdd(){
    current.elements=current.elements||[];
    var key=newElemKey();
    current.elements.push({key:key, name:"", desc:"", front:null, angles:[]});
    flushSave();
    renderEdit(current);
    var inp=view.querySelector('input[data-elname="'+key+'"]');
    if(inp) inp.focus();
  }

  // 사진 올리기: 정면이 없으면 첫 장이 정면, 나머지는 다른 각도(최대 3장). Kling 조건에 안 맞으면 거른다.
  async function elemAddPhotos(files, key){
    if(!uid){ toast("로그인이 필요해요"); return; }
    var proj=current, el=elemByKey(proj, key);
    if(!el) return;
    var done=0, fail=0, msg="";
    for(var k=0;k<files.length;k++){
      var room=(el.front ? 0 : 1)+ELEM.maxAngles-(el.angles||[]).length;
      if(room<=0){ msg="요소 사진은 정면 1장 + 다른 각도 "+ELEM.maxAngles+"장까지예요"; break; }
      toast("요소 사진 올리는 중 "+(k+1)+"/"+files.length);
      try{
        var r=await shrink(files[k], "element");
        if(Math.min(r.w, r.h)<ELEM.minSide){ fail++; msg="가로·세로 "+ELEM.minSide+"px 이상 사진만 쓸 수 있어요 (Kling 조건)"; continue; }
        if(Math.max(r.w, r.h)/Math.min(r.w, r.h)>ELEM.maxRatio){ fail++; msg="너무 길쭉한 사진은 쓸 수 없어요 (1:2.5 ~ 2.5:1, Kling 조건)"; continue; }
        var up=await storeUpload(newPath(proj.id, "element", "jpg"), r.blob, "image/jpeg");
        var item={id:up.id, w:r.w, h:r.h, size:up.sizeBytes};
        if(!el.front) el.front=item;
        else { el.angles=el.angles||[]; el.angles.push(item); }
        done++;
      }catch(e){
        fail++;
        if(/quota|exceed|413/i.test(String(e && e.message))){ msg="저장 공간이 꽉 찼어요"; break; }
      }
    }
    await persist(proj);
    if(current===proj) renderEdit(proj);
    toast(msg || (fail ? done+"장 올렸고 "+fail+"장 실패했어요" : done+"장 올렸어요"));
  }

  // idx 0 = 정면. 정면을 지우면 첫 번째 다른 각도가 정면이 된다.
  async function elemDropPhoto(key, idx){
    var el=elemByKey(current, key);
    if(!el) return;
    var gone;
    if(idx===0){ gone=el.front; el.front=(el.angles||[]).shift()||null; }
    else gone=(el.angles||[]).splice(idx-1, 1)[0];
    await persist(current);
    if(gone && gone.id){ try{ await storeDelete(gone.id); }catch(e){} }
    renderEdit(current);
  }

  // 이 숙소 모든 프롬프트(사진 가공·영상화)의 [from] 을 [to] 로.
  function renameMentions(proj, from, to){
    var a="["+from+"]", b="["+to+"]", n=0;
    Object.keys(proj.editSpecs||{}).forEach(function(pid){
      var sp=proj.editSpecs[pid];
      ["prompt", "vprompt"].forEach(function(k){
        if(typeof sp[k]==="string" && sp[k].indexOf(a)>=0){ sp[k]=sp[k].split(a).join(b); n++; }
      });
    });
    return n;
  }
  // 이 요소를 쓰는 줄 번호
  function elemUsage(proj, name){
    var a="["+name+"]", rows=[];
    (proj.photos||[]).forEach(function(p, i){
      var sp=(proj.editSpecs||{})[p.id];
      if(sp && (String(sp.prompt||"").indexOf(a)>=0 || String(sp.vprompt||"").indexOf(a)>=0)) rows.push(i+1);
    });
    return rows;
  }
  // 이름 바꾸기: 규칙에 맞으면 [옛이름] 도 같이 바꾼다. 안 맞으면 이유를 남기고 false.
  function elemRename(proj, key, name){
    var el=elemByKey(proj, key);
    if(!el) return false;
    name=String(name||"").trim();
    if(name===el.name){ delete elemErrors[key]; delete elemDrafts[key]; return true; }
    var bad=elemNameProblem(proj, name, key);
    if(bad){ elemErrors[key]=bad; elemDrafts[key]=name; return false; }
    var old=el.name;
    el.name=name;
    delete elemErrors[key]; delete elemDrafts[key];
    if(old) renameMentions(proj, old, name);
    return true;
  }

  // 지우기: 쓰는 줄이 있으면 한 번 묻고, 그 줄의 [이름] 은 [삭제됨] 으로 바꾼다.
  async function elemDelete(key){
    var el=elemByKey(current, key);
    if(!el) return;
    var rows=el.name ? elemUsage(current, el.name) : [];
    var q=rows.length
      ? "「"+el.name+"」 요소를 "+rows.join("·")+"번 줄에서 쓰고 있어요.\n지우면 그 줄의 ["+el.name+"] 은 [삭제됨] 으로 바뀌어요. 지울까요?"
      : "「"+(el.name||"이름 없는")+"」 요소를 지울까요?";
    if(!confirm(q)) return;
    if(el.name) renameMentions(current, el.name, "삭제됨");
    current.elements=elemList(current).filter(function(x){ return x.key!==key; });
    delete elemErrors[key]; delete elemDrafts[key];
    await persist(current);
    elemPhotos(el).forEach(function(x){ storeDelete(x.id).catch(function(){}); });
    // Kling 쪽 등록도 지운다. 실패해도 화면 쪽 삭제는 그대로다.
    if(el.kling && el.kling.elementId) klingElementDelete(el.kling.elementId);
    renderEdit(current);
  }
  function klingElementDelete(elementId){
    api(FN.clip,{method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"element_delete", elementId:String(elementId)})}).catch(function(){});
  }

  // Kling 고정 요소 등록(선택). 사진 한 장만 있으면 등록 없이 이미지 참조로 사용한다.
  async function elemRegister(key){
    var proj=current, el=elemByKey(proj, key);
    if(!el || elemInflight[key]) return;
    var st=elemState(proj, el);
    if(st==="draft"){ elemErrors[key]="요소 이름과 기준 사진 한 장을 먼저 넣어주세요."; renderClipsSoon(proj); return; }
    if(st==="local"){ elemErrors[key]="사진 한 장으로 이미 사용할 수 있어요. Kling 고정 요소로 등록하려면 다른 각도 사진을 한 장 이상 추가해주세요."; renderClipsSoon(proj); return; }
    if(st==="pending" || st==="ready") return;
    var prev=el.kling || null;
    var body={action:"element_create", projectId:proj.id, name:el.name, desc:String(el.desc||"").trim(),
      front:el.front.id, angles:(el.angles||[]).map(function(x){ return x.id; })};
    var job={status:"pending", taskId:null, sig:elemSig(el), at:Date.now(),
      prevElementId: prev && prev.elementId ? String(prev.elementId) : ""};
    elemInflight[key]=true;
    delete elemErrors[key];
    el.kling=job;
    renderClipsSoon(proj);
    try{
      var r=await api(FN.clip,{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
      var t=await r.text(), j=null;
      try{ j=JSON.parse(t); }catch(e){}
      if(!r.ok || !j || !j.operation || !j.operation.taskId){
        var msg=(j && (j.message||j.error)) || t.slice(0,160) || ("HTTP "+r.status);
        if(r.status===404) msg="영상 함수(lodging-reels-clip)가 아직 배포되지 않았어요.";
        throw new Error(msg);
      }
      if(el.kling===job){
        job.taskId=String(j.operation.taskId);
        await persist(proj);
        ensureClipPoll();
      }
    }catch(e){
      if(el.kling===job) el.kling=prev;
      elemErrors[key]="Kling 등록 요청 실패: "+((e && e.message) || String(e));
    }finally{
      delete elemInflight[key];
    }
    renderClipsSoon(proj);
  }

  async function elemCheck(proj, key){
    var el=elemByKey(proj, key), k=el && el.kling;
    if(!k || k.status!=="pending" || elemInflight[key]) return;
    var done=async function(next, msg){
      if(el.kling!==k) return;
      el.kling=next;
      if(msg) elemErrors[key]=msg; else delete elemErrors[key];
      await persist(proj);
      // 프롬프트를 적는 중이어도 상태 줄은 바로 바뀌게(화면 전체를 다시 그리지 않는다).
      if(current===proj) elemRefreshLive();
    };
    if(!k.taskId){
      if(Date.now()-k.at>120000) await done({status:"failed", msg:"요청이 중간에 끊겼어요", sig:k.sig, at:Date.now()});
      return;
    }
    if(Date.now()-k.at>ELEM.giveUpMs){
      await done({status:"failed", msg:"30분 넘게 안 끝났어요", sig:k.sig, at:Date.now()});
      return;
    }
    elemInflight[key]=true;
    try{
      var r=await api(FN.clip,{method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"element_status", projectId:proj.id, operation:{taskId:k.taskId}})});
      var t=await r.text(), j=null;
      try{ j=JSON.parse(t); }catch(e){}
      if(!r.ok || !j || !j.status){
        if(r.status>=400 && r.status<500 && r.status!==429){
          await done({status:"failed", msg:(j && (j.message||j.error)) || ("HTTP "+r.status), sig:k.sig, at:Date.now()});
        }
        return;
      }
      if(j.status==="pending") return;
      if(j.status==="ready" && j.elementId){
        await done({status:"ready", elementId:String(j.elementId), taskId:k.taskId, sig:k.sig, at:Date.now()});
        if(k.prevElementId && k.prevElementId!==String(j.elementId)) klingElementDelete(k.prevElementId);
        if(current===proj) toast("「"+el.name+"」 Kling 등록이 끝났어요");
      }else{
        await done({status:"failed", msg:j.message || j.error || "알 수 없는 오류", sig:k.sig, at:Date.now()});
      }
    }catch(e){
      console.error("element status failed", e);
    }finally{
      delete elemInflight[key];
    }
  }

  function elemSection(){
    var els=elemList(current);
    var h='<div class="elems"><label class="elab">요소 <span>이 숙소에서 쓸 사람·물건·배경</span></label>'+
      '<p class="hint" style="margin:0 0 4px">이름과 기준 사진 1장만 넣으면 바로 사용해요. 설명과 다른 각도(최대 '+ELEM.maxAngles+'장)는 선택사항이에요. '+
      '[이름] 또는 @ 목록으로 부르면 사진 가공과 영상화에 자동으로 사진 참조가 들어가요. '+
      '사진을 추가하면 Kling 고정 요소로도 등록할 수 있어요. 카테고리는 따로 고를 필요 없어요.</p>';
    els.forEach(function(el){ h+=elemCard(el); });
    h+='<button type="button" class="eadd" id="elemadd" style="margin-top:8px">+ 요소 추가</button></div>';
    return h;
  }
  function elemCard(el){
    var ph=elemPhotos(el), key=esc(el.key);
    var h='<div class="elem" data-elem="'+key+'"><div class="elem-ph">';
    ph.forEach(function(x, j){
      h+='<div class="eref">'+previewImg(blobUrl(x.id), (el.name||"요소")+(j ? " 다른 각도 "+j : " 정면"))+
         '<i>'+(j ? "각도 "+j : "정면")+'</i>'+
         '<button type="button" data-elphdel="'+key+':'+j+'" aria-label="요소 사진 지우기">×</button></div>';
    });
    if(ph.length<1+ELEM.maxAngles){
      h+='<button type="button" class="eadd" data-elpick="'+key+'">+ '+
         (el.front ? '다른 각도 ('+(el.angles||[]).length+'/'+ELEM.maxAngles+')' : '정면 사진')+'</button>'+
         '<input class="sr" type="file" accept="image/*" multiple data-elfile="'+key+'">';
    }
    var draft=Object.prototype.hasOwnProperty.call(elemDrafts, el.key);
    h+='</div><div class="elem-f">'+
      '<input class="nm'+(draft ? ' bad' : '')+'" type="text" data-elname="'+key+'" maxlength="'+ELEM.nameMax+'" placeholder="이름 (예: 아이)" value="'+
        esc(draft ? elemDrafts[el.key] : (el.name||""))+'" aria-label="요소 이름" autocomplete="off">'+
      '<input type="text" data-eldesc="'+key+'" maxlength="'+ELEM.descMax+'" placeholder="설명 (선택 · 예: 7세 여자아이)" value="'+esc(el.desc||"")+'" aria-label="요소 설명 (선택)" autocomplete="off">'+
      '</div>';
    return h+'<div data-elstate="'+key+'">'+elemStateHtml(el)+'</div></div>';
  }
  // 등록 상태 · 버튼 · 오류. 사진만 있어도 가공/영상화 참조 가능.
  function elemStateHtml(el){
    var st=elemState(current, el), k=el.kling || {}, key=esc(el.key), h='';
    var label={
      draft:"요소 이름과 기준 사진을 넣으면 바로 사용할 수 있어요",
      local:"사진 1장으로 가공·영상화 사용 가능 · Kling 고정 등록은 추가 사진이 필요해요",
      "new":"사진 참조로 바로 사용 가능 · 원하면 Kling 고정 요소 등록",
      pending:"사진 참조로 사용 가능 · Kling 고정 요소 등록 중…",
      ready:"Kling 고정 요소 준비됨",
      failed:"사진 참조로 사용 가능 · Kling 고정 등록 실패"+(k.msg ? ": "+k.msg : ""),
      stale:"사진 참조로 사용 가능 · 변경된 사진은 Kling 고정 요소를 다시 등록해야 해요"
    }[st];
    var cls=(st==="ready" || st==="local" || st==="new") ? " ok" : (st==="failed" || st==="stale") ? " bad" : "";
    h+='<div class="elem-k"><span class="st'+cls+'">'+esc(label)+'</span>'+
      (st==="new" || st==="failed" || st==="stale"
        ? '<button type="button" class="primary" data-elreg="'+key+'">'+(st==="new" ? "Kling 등록" : "다시 등록")+'</button>' : '')+
      '<button type="button" class="ghost danger" data-eldel="'+key+'">지우기</button></div>';
    if(elemErrors[el.key]) h+='<p class="status bad">'+esc(elemErrors[el.key])+'</p>';
    return h;
  }

  // 요소 칸을 고친 뒤 화면 전체를 다시 그리지 않는다(적고 있는 칸의 커서·포커스 유지).
  // 상태 줄, 각 사진 줄의 프롬프트 글자([옛이름] → [새이름])·안내·요소 묶음만 고친다.
  function elemRefreshLive(){
    if(!current) return;
    Array.prototype.forEach.call(view.querySelectorAll("[data-elstate]"),function(box){
      var el=elemByKey(current, box.dataset.elstate);
      if(el) box.innerHTML=elemStateHtml(el);
    });
    (current.photos||[]).forEach(function(p){ rowRefreshLive(p.id); });
  }
  function rowRefreshLive(pid){
    var sp=peekSpec(current, pid), q='="'+String(pid).replace(/"/g,'\\"')+'"]';
    var one=function(attr){ return view.querySelector("["+attr+q); };
    var ta=one("data-eprompt"), va=one("data-vprompt");
    if(ta && document.activeElement!==ta && ta.value!==sp.prompt) ta.value=sp.prompt;
    if(va && document.activeElement!==va && va.value!==sp.vprompt) va.value=sp.vprompt;
    var ew=one("data-ewarn"), lk=one("data-elinks"), vw=one("data-vwarn"), vh=one("data-vhint");
    if(ew) ew.textContent=mentionWarnings(current, pid, sp.prompt, "edit").join(" · ");
    if(lk) lk.innerHTML=elemLinksHtml(current, pid);
    if(vw) vw.textContent=mentionWarnings(current, pid, sp.vprompt, "clip").join(" · ");
    if(vh) vh.textContent=clipHintText(current, pid);
  }

  // 요소 칸 이벤트는 #view 에 한 번만 건다(카드가 다시 그려져도 그대로 동작).
  function elemTarget(ev, attr){
    return ev.target && ev.target.closest ? ev.target.closest("["+attr+"]") : null;
  }
  view.addEventListener("click",function(ev){
    if(!current) return;
    var b;
    if((b=elemTarget(ev, "data-elpick"))){
      var inp=view.querySelector('input[data-elfile="'+b.dataset.elpick+'"]');
      if(inp) inp.click();
    }else if((b=elemTarget(ev, "data-elphdel"))){
      var a=b.dataset.elphdel, at=a.lastIndexOf(":");
      if(confirm("이 요소 사진을 지울까요?")) elemDropPhoto(a.slice(0, at), +a.slice(at+1));
    }else if((b=elemTarget(ev, "data-elreg"))){
      elemRegister(b.dataset.elreg);
    }else if((b=elemTarget(ev, "data-eldel"))){
      elemDelete(b.dataset.eldel);
    }else if(ev.target && ev.target.id==="elemadd"){
      elemAdd();
    }
  });
  view.addEventListener("change",function(ev){
    if(!current) return;
    var t=ev.target;
    if(t.matches && t.matches("input[data-elfile]")){
      if(t.files && t.files.length){
        view.classList.add("busy");
        elemAddPhotos(Array.prototype.slice.call(t.files), t.dataset.elfile)
          .finally(function(){ view.classList.remove("busy"); });
      }
    }else if(t.matches && t.matches("input[data-elname]")){
      var ok=elemRename(current, t.dataset.elname, t.value);
      t.classList.toggle("bad", !ok);
      if(ok) t.value=(elemByKey(current, t.dataset.elname) || {}).name || "";
      elemRefreshLive();
      flushSave();
    }else if(t.matches && t.matches("input[data-eldesc]")){
      flushSave();
    }
  });
  view.addEventListener("input",function(ev){
    if(!current) return;
    var t=ev.target, el;
    if(t.matches && t.matches("input[data-eldesc]") && (el=elemByKey(current, t.dataset.eldesc))){
      el.desc=t.value;
