<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙소 릴스 러너</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  /* 폰트는 Storage 에 한 번만 올려두고 쓴다. 규칙은 실행 중에 붙인다. */
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f6f5f2; --card:#fff; --ink:#1c1b19; --mute:#6f6b64;
    --line:#e2dfd9; --accent:#8a5a2b; --accent-ink:#fff;
    --warn:#a4442c; --ok:#2e6b4f; --field:#fbfaf8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17161a; --card:#201f24; --ink:#eceae6; --mute:#9d978e;
      --line:#34323a; --accent:#c89262; --accent-ink:#1c1b19;
      --warn:#e08a72; --ok:#7fc0a0; --field:#1a191e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17161a; --card:#201f24; --ink:#eceae6; --mute:#9d978e;
    --line:#34323a; --accent:#c89262; --accent-ink:#1c1b19;
    --warn:#e08a72; --ok:#7fc0a0; --field:#1a191e;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{-webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:16px; line-height:1.55}
  .wrap{max-width:680px; margin:0 auto; padding:16px 14px 124px}
  header{display:flex; align-items:baseline; gap:10px; margin:6px 0 18px}
  h1{font-size:19px; margin:0; letter-spacing:-.02em}
  h2{font-size:15px; margin:24px 0 10px; letter-spacing:-.01em}
  .sub{font-size:12.5px; color:var(--mute)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .proj{cursor:pointer}
  .proj h3{margin:0 0 3px; font-size:16px}
  .proj p{margin:0; font-size:13px; color:var(--mute)}
  label{display:block; margin:16px 0 6px; font-size:13.5px; font-weight:600}
  label span{font-weight:400; color:var(--mute); font-size:12.5px}
  input[type=text],textarea,select{width:100%; padding:11px 12px; font:inherit; font-size:15.5px;
    color:var(--ink); background:var(--field); border:1px solid var(--line);
    border-radius:10px; outline:none}
  input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{min-height:92px; resize:vertical}
  .hint{font-size:12.5px; color:var(--mute); margin:5px 0 0}
  button{font:inherit; font-size:15px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); border-radius:10px; padding:11px 14px;
    background:var(--card); color:var(--ink)}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  button.ghost{background:transparent}
  button.danger{color:var(--warn)}
  button:disabled{opacity:.45; cursor:default}
  .bar{position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); z-index:5;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
  .bar .inner{max-width:680px; margin:0 auto; display:flex; gap:8px}
  .bar button{flex:1}
  .note{font-size:13px; color:var(--mute); background:var(--field);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px}
  .note b{color:var(--ink)}
  pre{margin:0; padding:12px; background:var(--field); border:1px solid var(--line);
    border-radius:10px; font-size:12.5px; line-height:1.5; overflow-x:auto;
    white-space:pre; font-family:ui-monospace,Menlo,monospace}
  .toast{position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(86px + env(safe-area-inset-bottom,0px)); background:var(--ink);
    color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px;
    z-index:9; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%}
  .toast.on{opacity:1}
  .empty{text-align:center; color:var(--mute); padding:36px 10px; font-size:14px}
  .status{font-size:12.5px; color:var(--mute); margin-top:10px}
  .status.bad{color:var(--warn)}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:10px}
  .thumb{position:relative; border:1px solid var(--line); border-radius:10px;
    overflow:hidden; background:var(--field); aspect-ratio:3/4}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .thumb .n{position:absolute; left:4px; top:4px; background:rgba(0,0,0,.72);
    color:#fff; font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px}
  .thumb .ops{position:absolute; left:0; right:0; bottom:0; display:flex;
    background:rgba(0,0,0,.62)}
  .thumb .ops button{flex:1; padding:6px 0; font-size:13px; border:0;
    border-radius:0; background:transparent; color:#fff; font-weight:700}
  .pickbtn{width:100%; border:1.5px dashed var(--line); border-radius:12px;
    padding:16px 12px; background:var(--field); color:var(--ink);
    font-size:15px; font-weight:600}
  .pickbtn:active{border-color:var(--accent)}
  .sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%);
    white-space:nowrap; border:0}
  .meter{height:5px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:8px}
  .meter i{display:block; height:100%; background:var(--accent)}
  .busy{pointer-events:none; opacity:.6}
  .trk{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;
    background:var(--field)}
  .trkhead{display:flex; align-items:baseline; gap:8px; margin-bottom:8px}
  .trkhead b{font-size:14.5px}
  .trkname{font-size:12.5px; color:var(--mute); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .trkline{display:flex; align-items:center; gap:8px; margin:8px 0 0;
    font-size:13.5px; font-weight:400}
  .trkline input[type=range]{flex:1; min-width:0}
  .trkline input[type=checkbox]{width:18px; height:18px; margin:0}
  .trkval{flex:0 0 32px; text-align:right; color:var(--mute);
    font-size:12.5px; font-variant-numeric:tabular-nums}
  .cut{display:flex; align-items:center; gap:10px; padding:6px 0;
    border-bottom:1px solid var(--line)}
  .cut:last-of-type{border-bottom:0}
  .cut.cover{background:var(--field); border-radius:10px; padding:6px 8px; margin-bottom:6px}
  .cut .cn{flex:0 0 32px; font-size:11.5px; font-weight:700; color:var(--mute);
    font-variant-numeric:tabular-nums}
  .cut .ct{flex:1; font-size:14.5px; line-height:1.35; min-width:0; word-break:keep-all}
  .cpick{flex:0 0 46px; width:46px; height:62px; padding:0; overflow:hidden;
    position:relative; border-radius:8px; border:1px solid var(--line); background:var(--field)}
  .cpick img{width:100%; height:100%; object-fit:cover; display:block}
  .cpick i{position:absolute; left:2px; top:2px; font-style:normal; font-size:10px;
    font-weight:700; color:#fff; background:rgba(0,0,0,.7); border-radius:4px; padding:0 4px}
  .cstrip{display:flex; gap:6px; overflow-x:auto; padding:8px 0;
    border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch}
  .cstrip button{flex:0 0 58px; width:58px; height:78px; padding:0; position:relative;
    overflow:hidden; border-radius:8px; border:1px solid var(--line)}
  .cstrip img{width:100%; height:100%; object-fit:cover; display:block}
  .cstrip i{position:absolute; left:2px; top:2px; font-style:normal; font-size:10px;
    font-weight:700; color:#fff; background:rgba(0,0,0,.7); border-radius:4px; padding:0 4px}
  .tbox{margin-top:12px}
  .tprev{position:relative; max-width:260px; margin:0 auto;
    border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#000}
  .tprev img{width:100%; display:block}
  /* 인스타 그리드는 가운데 1:1 만 보여준다. 그 범위를 표시해준다. */
  .tprev .sq{position:absolute; left:0; right:0; top:21.875%; height:56.25%;
    border:2px dashed rgba(255,255,255,.75); pointer-events:none}
  .tprev .sq b{position:absolute; right:4px; bottom:2px; font-size:10px;
    font-weight:700; color:#fff; text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>숙소 릴스 러너</h1><span class="sub" id="where"></span></header>
  <div id="view"></div>
</div>
<div class="bar"><div class="inner" id="bar"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var FIELDS = [
    {k:"folder", label:"폴더 이름", type:"text",
     hint:"PC에서 만들어질 폴더 이름이에요. 띄어쓰기 없이 짧게.", ph:"oceanview-pension"},
    {k:"name", h:"숙소명", type:"text", ph:"감성숙소 애빛"},
    {k:"area", h:"지역", type:"text", ph:"제주 제주시 구좌읍"},
    {k:"access", h:"출발지 기준 접근성", type:"text",
     hint:"영상에 그대로 나가요. 거리보다 시간이 잘 먹혀요.",
     ph:"제주공항에서 차로 40분 / 바다까지 도보 2분"},
    {k:"type", h:"숙소 유형", type:"text", ph:"독채 펜션"},
    {k:"people", h:"수용 인원", type:"text", ph:"최대 6인"},
    {k:"price", h:"가격대", type:"text", ph:"비수기 평일 18만원대 / 성수기 주말 32만원대"},
    {k:"perks", h:"확인된 혜택", type:"textarea",
     hint:"한 줄에 하나씩. 확실한 것만. 여기 없는 건 영상에서 말 안 해요.",
     ph:"반려견 동반 가능 (중형견까지)\n야외 자쿠지 (사계절 온수)"},
    {k:"links", h:"참고 링크", type:"textarea",
     hint:"예약 페이지, 공식 사이트, 인스타. 한 줄에 하나씩.",
     ph:"https://booking.naver.com/..."},
    {k:"keyword", h:"댓글 키워드", type:"text",
     hint:"릴스마다 다르게. 지역명 2~4글자가 제일 좋아요.", ph:"구좌"},
    {k:"hide", h:"영상에 넣으면 안 되는 것", type:"textarea",
     ph:"정확한 주소\n숙소 공식 계정 아이디"},
    {k:"deal", h:"제휴 여부", type:"select", opts:["유상 제휴","무상 제공","제휴 없음"]},
    {k:"memo", h:"추가 메모", type:"textarea", ph:"겨울 성수기 예약이 빨리 차는 편."}
  ];

  // 대본을 어떤 각도로 쓸지. 숙소의 속성이 아니라 이번 영상의 연출 선택이라
  // ② 숙소 정보가 아니라 ③ 대본 패널 맨 위에 둔다.
  var ANGLES = ["자동 (AI가 판단)",
    "절대가 저렴 — 숫자 자체가 싸다",
    "1인당 저렴 — 여럿이 나누면 싸다",
    "가치 대비 — 포함된 걸 세어보면 값을 한다",
    "희소성 — 여기밖에 없다 (가격은 거의 말 안 함)",
    "지금 할인 — 특가가 열린 시점이다"];

  var PREAMBLE =
    "# 숙소 정보\n\n대본 생성기가 읽는 파일이에요.\n" +
    "**여기 적은 것만 사실로 취급해요.** 빈 항목은 영상에서 언급 안 해요.\n\n---\n";

  // 사진은 영상이 1080x1920 이라 2160px 이면 충분하다.
  // 상세페이지는 글씨를 읽어야 해서 더 크게 남긴다.
  var LIMITS = {photo:{edge:2160, q:0.88}, info:{edge:2400, q:0.92}};

  // ---------- Supabase ----------
  // SDK 없이 REST 로 직접 간다. 외부 스크립트가 없으니 깨질 데가 적다.
  var SUPA = {
    url: "https://kfgtvifupumjuewwxzmz.supabase.co",
    key: "sb_publishable_KROAv1c1eX3wlEt8Mog8OQ_jNTMJzoM",
    bucket: "lodging-reels",
    table: "lodging_reels_projects"
  };
  var FN = {
    ai:  SUPA.url + "/functions/v1/lodging-reels-ai",
    tts: SUPA.url + "/functions/v1/lodging-reels-tts"
  };

  var session=null, uid=null, local=false;
  var projects=[], current=null, usage=null;
  var loadError=null, capNote="";
  var view=document.getElementById("view"), bar=document.getElementById("bar");

  function toast(m){var t=document.getElementById("toast");t.textContent=m;
    t.classList.add("on");clearTimeout(t._h);
    t._h=setTimeout(function(){t.classList.remove("on")},2400);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  function nid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

  // 파일 경로가 곧 id 다. 공개 버킷이라 그대로 <img src> 로 쓴다.
  function blobUrl(id){
    return SUPA.url + "/storage/v1/object/public/" + SUPA.bucket + "/" + id;
  }

  // ---------- 로그인 ----------
  function saveSession(s){
    session=s; uid=(s && s.user && s.user.id) || null;
    try{ localStorage.setItem("lr_session", JSON.stringify(s||null)); }catch(e){}
  }
  function readSession(){
    try{ return JSON.parse(localStorage.getItem("lr_session")||"null"); }catch(e){ return null; }
  }
  function authHeaders(extra){
    var h = Object.assign({apikey:SUPA.key}, extra||{});
    if(session && session.access_token) h.Authorization="Bearer "+session.access_token;
    return h;
  }

  async function signIn(email, password){
    var r=await fetch(SUPA.url+"/auth/v1/token?grant_type=password",{
      method:"POST",
      headers:{apikey:SUPA.key,"Content-Type":"application/json"},
      body:JSON.stringify({email:email, password:password})
    });
    var j=await r.json();
    if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "로그인 실패");
    saveSession(j); return j;
  }
  async function signUp(email, password){
    var r=await fetch(SUPA.url+"/auth/v1/signup",{
      method:"POST",
      headers:{apikey:SUPA.key,"Content-Type":"application/json"},
      body:JSON.stringify({email:email, password:password})
    });
    var j=await r.json();
    if(!r.ok) throw new Error(j.error_description || j.msg || j.message || "가입 실패");
    if(j.access_token) saveSession(j);
    return j;
  }
  async function refresh(){
    if(!session || !session.refresh_token) return false;
    try{
      var r=await fetch(SUPA.url+"/auth/v1/token?grant_type=refresh_token",{
        method:"POST",
        headers:{apikey:SUPA.key,"Content-Type":"application/json"},
        body:JSON.stringify({refresh_token:session.refresh_token})
      });
      if(!r.ok) return false;
      saveSession(await r.json()); return true;
    }catch(e){ return false; }
  }
  function signOut(){ saveSession(null); location.reload(); }

  // 토큰이 만료됐으면 한 번 갱신하고 다시 보낸다.
  async function api(url, opts, retry){
    opts=opts||{};
    opts.headers=authHeaders(opts.headers);
    var r=await fetch(url, opts);
    if(r.status===401 && !retry && await refresh()) return api(url, opts, true);
    return r;
  }

  // ---------- 저장 ----------
  async function loadAll(){
    if(!uid){ local=true; projects=[]; return; }
    try{
      var r=await api(SUPA.url+"/rest/v1/"+SUPA.table+
            "?select=id,data,updated_at&owner=eq."+uid+"&order=updated_at.desc");
      if(!r.ok){ loadError="HTTP "+r.status+" "+(await r.text()).slice(0,120); local=true; return; }
      var rows=await r.json();
      projects=rows.map(function(row){
        var v=Object.assign({}, row.data||{});
        v.id=row.id;
        v.photos=(v.photos||[]).map(function(x){return Object.assign({},x)});
        v.infos=(v.infos||[]).map(function(x){return Object.assign({},x)});
        return v;
      });
      local=false;
    }catch(e){
      loadError=(e&&e.message)||"알 수 없는 오류"; local=true;
    }
  }

  async function persist(p){
    if(!uid){ toast("로그인이 필요해요"); return false; }
    p.at=Date.now();
    var body={ id:p.id, owner:uid, folder:(p.folder||""), name:(p.name||""), data:p };
    try{
      var r=await api(SUPA.url+"/rest/v1/"+SUPA.table+"?on_conflict=id",{
        method:"POST",
        headers:{"Content-Type":"application/json", Prefer:"resolution=merge-duplicates,return=minimal"},
        body:JSON.stringify(body)
      });
      if(!r.ok){ toast("저장 실패: "+(await r.text()).slice(0,80)); return false; }
      return true;
    }catch(e){ toast("저장 실패: "+((e&&e.message)||"")); return false; }
  }

  async function removeProject(p){
    var ids=(p.photos||[]).concat(p.infos||[]).map(function(x){return x.id});
    [p.tts, p.bgm].forEach(function(a){ if(a && a.id) ids.push(a.id); });
    for(var i=0;i<ids.length;i++){ try{ await storeDelete(ids[i]); }catch(e){} }
    try{
      await api(SUPA.url+"/rest/v1/"+SUPA.table+"?id=eq."+encodeURIComponent(p.id),{method:"DELETE"});
    }catch(e){}
    projects=projects.filter(function(x){return x.id!==p.id});
  }

  // ---------- 스토리지 ----------
  function newPath(projId, kind, ext){
    return uid+"/"+projId+"/"+kind+"/"+
           Date.now().toString(36)+Math.random().toString(36).slice(2,8)+"."+ext;
  }
  async function storeUpload(path, blob, type){
    var r=await api(SUPA.url+"/storage/v1/object/"+SUPA.bucket+"/"+path,{
      method:"POST",
      headers:{"Content-Type":type||blob.type||"application/octet-stream","x-upsert":"true"},
      body:blob
    });
    if(!r.ok) throw new Error((await r.text()).slice(0,120));
    return {id:path, url:blobUrl(path), sizeBytes:blob.size};
  }
  async function storeDelete(path){
    if(!path) return;
    await api(SUPA.url+"/storage/v1/object/"+SUPA.bucket+"/"+path,{method:"DELETE"});
  }
  async function storeUsage(){
    try{
      var r=await api(SUPA.url+"/storage/v1/object/list/"+SUPA.bucket,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prefix:uid+"/", limit:1000})
      });
      if(!r.ok) return null;
      var rows=await r.json(), bytes=0;
      rows.forEach(function(o){
        var m=o.metadata||{}; bytes += (m.size||0);
      });
      return {bytes:bytes, maxBytes:1073741824};
    }catch(e){ return null; }
  }

  // ---------- 파일 내려주기 ----------
  var downloads = {
    save: function(o){
      return new Promise(function(res,rej){
        try{
          var u=URL.createObjectURL(o.data);
          var a=document.createElement("a");
          a.href=u; a.download=o.filename||"download";
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(u) }, 60000);
          res(true);
        }catch(e){ rej(e); }
      });
    }
  };

  // ---------- 이미지 ----------
  function shrink(file, kind){
    var lim=LIMITS[kind];
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var w=img.naturalWidth, h=img.naturalHeight;
          var s=Math.min(1, lim.edge/Math.max(w,h));
          var cw=Math.round(w*s), ch=Math.round(h*s);
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          c.getContext("2d").drawImage(img,0,0,cw,ch);
          c.toBlob(function(b){ b?res({blob:b,w:cw,h:ch}):rej(new Error("변환 실패")); },
                   "image/jpeg", lim.q);
        };

  var ocrWorker=null;

  async function getOcr(onProgress){
    if(ocrWorker) return ocrWorker;
    if(typeof Tesseract==="undefined") throw new Error("ocr_script");
    ocrWorker = await Tesseract.createWorker("kor+eng", 1, {
      logger:function(m){
        if(m && m.status && onProgress) onProgress(m.status, m.progress||0);
      }
    });
    return ocrWorker;
  }

  // 캡처는 세로로 길어서 통째로 넣으면 글자가 뭉개진다. 잘라서 읽는다.
  function sliceFor(blob){
    return new Promise(function(res){
      var img=new Image(), url=URL.createObjectURL(blob);
      img.onload=function(){
        var w=img.naturalWidth, h=img.naturalHeight, out=[];
        var band=Math.round(w*1.3), step=Math.round(band*0.94);
        var n = h<=band ? 1 : Math.min(8, Math.ceil((h-band)/step)+1);
        for(var i=0;i<n;i++){
          var y = n===1 ? 0 : Math.min(i*step, h-band);
          var c=document.createElement("canvas");
          var ch=Math.min(band,h);
          // 글자를 키워서 인식률을 올린다
          var scale = Math.min(2, 1600/w);
          c.width=Math.round(w*scale); c.height=Math.round(ch*scale);
          var g=c.getContext("2d");
          g.drawImage(img, 0, y, w, ch, 0, 0, c.width, c.height);
          out.push(c);
        }
        URL.revokeObjectURL(url); res(out);
      };
      img.onerror=function(){ URL.revokeObjectURL(url); res([]); };
      img.src=url;
    });
  }

  async function ocrAll(blobs){
    var w = await getOcr(function(st,pr){
      if(st==="loading language traineddata" || st==="loading tesseract core")
        setStat("글자 인식 준비 중이에요... "+Math.round(pr*100)+"%");
    });
    var texts=[];
    for(var i=0;i<blobs.length;i++){
      var parts = await sliceFor(blobs[i]);
      for(var j=0;j<parts.length;j++){
        setStat("캡처 "+(i+1)+"/"+blobs.length+" 읽는 중 ("+(j+1)+"/"+parts.length+")...");
        try{
          var r = await w.recognize(parts[j]);
          if(r && r.data && r.data.text) texts.push(r.data.text.trim());
        }catch(e){}
      }
    }
    return texts.join("\n").replace(/\n{3,}/g,"\n\n").slice(0, 20000);
  }

  function applyFields(got){
    if(!got || typeof got!=="object"){
      setStat("읽은 내용을 해석하지 못했어요. 직접 입력해주세요.", true);
      return false;
    }
    var filled=[], skipped=0;
    AUTO.forEach(function(f){
      var v=got[f.k];
      if(v==null || String(v).trim()==="") return;
      if((current[f.k]||"").trim()){ skipped++; return; }
      current[f.k]=String(v).trim(); filled.push(f.k);
    });
    if(!filled.length){
      setStat(skipped ? "이미 적어두신 칸이라 건드리지 않았어요."
                      : "캡처에서 쓸 정보를 못 찾았어요. 글씨가 작으면 확대해서 다시 찍어주세요.", true);
      return false;
    }
    persist(current).then(function(){
      renderEdit(current);
      setStat(filled.length+"개 칸을 채웠어요. 가격과 인원은 꼭 확인해주세요.");
    });
    return true;
  }

  async function autofill(blobs){
    if(!uid){ setStat("로그인이 필요해요.", true); return; }
    if(!blobs || !blobs.length){ setStat("읽을 캡처가 없어요.", true); return; }

    setStat("캡처에서 글자를 읽는 중이에요...");
    var text;
    try{
      text = await ocrAll(blobs);
    }catch(e){
      setStat(e && e.message==="ocr_script"
        ? "글자 인식 도구를 못 불러왔어요. 새로고침 후 다시 시도해주세요."
        : "글자를 읽어내지 못했어요"+(e&&e.message?" ("+String(e.message).slice(0,60)+")":"")+".", true);
      return;
    }

    if(!text || text.replace(/\s/g,"").length<30){
      setStat("캡처에서 글자를 거의 못 찾았어요. 화면을 확대해서 다시 캡처해주세요.", true);
      return;
    }

    setStat("읽은 글자를 정리하는 중이에요...");
    try{
      applyFields(await askJSON(fillPrompt("\n\n--- 읽어낸 내용 ---\n"+text), 2));
    }catch(e2){
      var c2=(e2&&e2.code)||"";
      setStat(c2==="unauthorized" ? "로그인이 풀렸어요. 새로고침해주세요."
            : c2==="rate_limited" ? "요청이 많아요. 잠시 뒤 다시 눌러주세요."
            : "정리에 실패했어요"+(c2?" ("+c2+")":"")+".", true);
    }
  }

  var VIDEO = {w:1080, h:1920, fps:30, cut:0.9, coverHold:0.5, subY:496};

  // 레퍼런스 상위 전환군(댓글/팔로워 2.5~11%)은 컷 18~35개, 컷당 0.73~0.95초였다.
  // 대본을 먼저 쓰므로 사진 수가 아니라 원하는 컷 수로 분량을 정한다.
  function targetLines(){
    var v=parseInt(current.lines,10);
    return (v>=10 && v<=30) ? v : 20;
  }
  function scriptLines(){
    return (current.script||"").split("\n")
      .map(function(x){return x.trim()}).filter(function(x){return x});
  }
  function cutCount(){ return scriptLines().length || targetLines(); }

  // 컷마다 어떤 사진을 쓸지. 비어 있으면 고르게 나눠 붙인다.
  function ensureMap(){
    var C=scriptLines().length, n=(current.photos||[]).length;
    var m=(current.map||[]).slice();
    for(var i=0;i<C;i++){
      if(typeof m[i]!=="number" || m[i]<0 || m[i]>=n){
        m[i] = n ? Math.min(n-1, Math.floor(i*n/C)) : 0;
      }
    }
    m.length=C;
    current.map=m;
    return m;
  }

  // ---------- ⑥ 소리 ----------
  // 오디오는 에셋 저장소가 안 받아서 base64 텍스트로 넣는다. 그래야 새로고침해도 남는다.
  var TRACKS=[{k:"tts", h:"나레이션", hint:"일레븐랩스에서 만든 mp3 를 올리세요."},
              {k:"bgm", h:"배경음악", hint:"영상 길이에 맞춰 반복 재생돼요."}];

  function trackRow(t){

      '</div>';

       '<input class="sr" type="file" accept="audio/*" id="aud_'+t.k+'" data-aud="'+t.k+'">';

      h+='<button type="button" class="primary" id="mktts" style="width:100%;margin-top:8px">'+

  async function addAudio(file, kind){
    var st=function(m,bad){var e=document.getElementById("vdstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!uid){ st("로그인이 필요해요.",true); return; }
    if(file.size > 45*1024*1024){ st("파일이 너무 커요. 45MB 아래로 줄여주세요.",true); return; }
    st("소리를 올리는 중...");
    try{
      await putAudio(file, kind, file.name);
      st("올렸어요: "+file.name);
    }catch(e){
      st("올리지 못했어요"+(e&&e.message?" ("+String(e.message).slice(0,60)+")":"")+".",true);
    }
  }

  // 파일에서 올리든 TTS 로 만들든 저장하는 길은 하나로 둔다.
  async function putAudio(blob, kind, label){
    var ext=/wav/i.test(blob.type)?"wav":(/ogg/i.test(blob.type)?"ogg":"mp3");
    var up=await storeUpload(newPath(current.id, kind, ext), blob, blob.type||"audio/mpeg");
    var old=current[kind];
    current[kind]={id:up.id, name:label||("audio."+ext), mime:blob.type||"audio/mpeg", bytes:blob.size};
    await persist(current);
    if(old && old.id && old.id!==up.id){ try{ await storeDelete(old.id); }catch(e){} }
    audioCache={};
    renderEdit(current);
    return current[kind];
  }

  async function dropAudio(kind){
    var rec=current[kind];
    current[kind]=null;
    await persist(current);
    if(rec && rec.id){ try{ await storeDelete(rec.id); }catch(e){} }
    audioCache={};
    renderEdit(current);
  }

  // 대본을 음성으로. 키는 Edge Function 안에 있어서 브라우저로 안 나온다.
  async function makeTTS(){
    var st=function(m,bad){var e=document.getElementById("vdstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!uid){ st("로그인이 필요해요.",true); return; }
    var txt=scriptLines().join(" ").replace(/\s+/g," ").trim();
    if(!txt){ st("대본을 먼저 만들어주세요.",true); return; }

    st("목소리를 만드는 중이에요... 10~30초 걸려요");
    var r;
    try{
      r=await api(FN.tts,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:txt})
      });
    }catch(e){ st("요청을 보내지 못했어요.",true); return; }

    if(!r.ok){
      var t=await r.text(), code="";
      try{ var j=JSON.parse(t); code=j.error||""; t=j.message||t; }catch(e){}
      st(code==="no_key"  ? "TTS 키가 설정되지 않았어요."
        :code==="bad_key" ? "TTS 키가 잘못됐어요."
        :code==="no_voice"? "목소리 ID 가 설정되지 않았어요."
        :code==="rate_limited" ? "요청이 많아요. 잠시 뒤 다시 눌러주세요."
        :"목소리를 만들지 못했어요: "+String(t).slice(0,120), true);
      return;
    }

    try{
      var blob=await r.blob();
      if(blob.size < 500){ st("빈 음성이 왔어요. 설정을 확인해주세요.",true); return; }
      current.ttsMute=false;
      await putAudio(blob, "tts", "나레이션.mp3");
      var e2=document.getElementById("vdstat");
      if(e2){ e2.className="status";
        e2.textContent="목소리를 만들었어요 ("+(blob.size/1024).toFixed(0)+"KB). 영상 만들기를 누르세요."; }
    }catch(e){ st("저장하지 못했어요.",true); }
  }

  var audioCache={};
  async function loadAudio(ctx, rec){
    if(!rec || !rec.id) return null;
    if(audioCache[rec.id]) return audioCache[rec.id];
    var r=await fetch(blobUrl(rec.id));
    var buf=await ctx.decodeAudioData(await r.arrayBuffer());
    audioCache[rec.id]=buf;
    return buf;
  }

  // 사진 고르는 줄. 누른 컷 아래에 띠로 펼친다.
  function openPicker(btn, cutIdx){
    var old=document.querySelector(".cstrip");
    var same = old && old.dataset.cut===String(cutIdx);
    if(old) old.remove();
    if(same) return;
    var ph=current.photos||[];
    var row=btn.closest(".cut");
    var d=document.createElement("div");
    d.className="cstrip"; d.dataset.cut=String(cutIdx);
    d.innerHTML=ph.map(function(x,i){
      return '<button type="button" data-pi="'+i+'"><img src="'+blobUrl(x.id)+'" alt=""><i>'+(i+1)+'</i></button>';
    }).join("");
    row.insertAdjacentElement("afterend", d);
    Array.prototype.forEach.call(d.querySelectorAll("button"),function(b){
      b.addEventListener("click",function(){
        var pi=+b.dataset.pi;
        if(cutIdx<0) current.coverPhoto=pi;
        else { ensureMap(); current.map[cutIdx]=pi; }
        flushSave();
        renderEdit(current);
      });
    });
    d.scrollIntoView({block:"nearest"});
  }

      "영상도 캡션도 숙소를 알려주지 않고, 댓글을 단 사람에게만 DM 으로 알려주는 구조예요.\n\n"+

      "- 아랫줄에 시설 이름이나 개수를 적지 마세요. 그건 대본이 할 일이에요.\n"+
      "- 두 줄을 이어 읽으면 한 문장이어야 해요.\n"+
      "- '이걸 · 이 가격' 같은 말은 윗줄에 가리킬 대상이 분명할 때만 쓰세요.\n"+
      "- 대본 1컷은 커버의 다음 장면부터 시작하세요.\n"+
      "  커버와 대본 첫 줄에 같은 단어가 겹치면 안 돼요.\n\n"+
      "# 레퍼런스 활용 (가져다 쓰되, 문장을 통째로 옮기지는 마세요)\n"+
      "어휘·말투·구조는 공용 재료예요. 마음껏 쓰세요.\n"+
      "역대급, 국보급, 인생 최고의, 돈이 안 아까운, 대궐같은, 그야말로 — 다 써도 돼요.\n\n"+
      "다만 아래 '문장'은 특정 계정의 것으로 읽혀요. 같은 틀로 새로 지으세요.\n"+
      "- 아무리 봐도 / 객실값이 잘못됐어요\n"+
      "- 소문나면 망하는 국보급 리조트입니다\n"+
      "- 10명도 한 객실? / 제발 객실 나누지 마세요\n"+
      "- 대가족 여행 / 돈이 안아까운 리조트\n"+
      "- 이래도 안 가요? / 인스파이어 가격 근황\n"+
      "- 어디까지 이어지는 거예요...?!\n"+
      "판별 기준: 위 문장과 연속 6자 이상 같으면 다시 쓰세요. 그 아래로는 괜찮아요.\n\n"+
      "마무리 CTA는 예외예요. '남들은 모르는 / 특가로 가는 방법 / 지금 공개할게요' 는\n"+
      "업계가 공통으로 쓰는 마무리라 그대로 쓰셔도 되고 바꿔 쓰셔도 돼요.\n"+
      "전환율 상위 네 개가 전부 이 형태였어요. 효과가 검증된 쪽을 택하세요.\n\n"+
      "# 금지\n"+
      "- 설명조 형용사: 아름다운, 쾌적한, 다양한, 완비, 보유\n"+
      "- 감탄사나 말줄임표로 대본을 시작하는 것\n"+
      "- 정보에 없는 시설·가격·거리를 지어내는 것\n"+
      "- 규칙을 자막으로 설명하는 것. '숙소 이름은 못 적어요', '비밀이라서' 같은 말이요.\n"+
      "  이름을 안 쓰는 건 그냥 안 쓰면 돼요. 안 쓴다고 말하면 김이 빠져요.\n"+
      "- 한 줄을 통째로 붙여 쓰는 것\n"+
      "- 비싼 가격을 싸다고 말하는 것. 안 믿기고 역효과예요.\n"+
      "- 근거 없이 '할인 중'이라고 하는 것\n\n"+

      "JSON 하나만 답하세요. 설명 없이요.\n"+
      '{"cover":["윗줄","아랫줄"],"script":["1컷","2컷", ... "'+L+'컷"]}';
  }

  // ---------- 검사 ----------
  var RE_WON=/[0-9][0-9,]{3,}\s*원/;
  var RE_META=/(이름|상호|어디인지|위치).{0,4}(못|안|비밀|공개)|비밀이라서|말 ?못/;

  // 줄 단위로 무엇이 왜 잘못됐는지. 고칠 때 그 줄만 다시 받으려고 인덱스를 남긴다.
  function lineProblems(lines, cover){
    var out=[];
    lines.forEach(function(t,i){
      var why=[], tag=[], bare=t.replace(/\s/g,"");
      if(bare.length>=8 && t.indexOf(" ")<0){ why.push("띄어쓰기가 빠졌어요"); tag.push("띄어쓰기"); }
      if(bare.length>14){ why.push("너무 길어요. 공백 빼고 14자 이내로"); tag.push("긴 줄"); }
      if(RE_WON.test(t)){ why.push("원 단위 금액은 '30만원대' 처럼 만원 단위로"); tag.push("원 단위 금액"); }
      if(RE_META.test(t)){ why.push("규칙을 설명하는 말은 빼세요"); tag.push("규칙 설명"); }
      if(why.length) out.push({i:i, text:t, why:why.join(" / "), tag:tag});
    });
    // 커버에서 한 말을 1~2컷이 또 하면 앞 3초를 버리는 셈이다.
    var cv=String(cover||"").replace(/\s/g,"");
    for(var k=0;k<Math.min(2,lines.length);k++){
      var head=lines[k].replace(/\s/g,""), hit=false;
      for(var j=0;j+3<=cv.length;j++) if(head.indexOf(cv.substr(j,3))>=0){ hit=true; break; }
      if(hit && !out.some(function(o){return o.i===k}))
        out.push({i:k, text:lines[k], tag:["커버 중복"],
                  why:"커버에서 이미 한 말이에요. 그 다음 장면으로 넘어가세요"});
    }
    return out.sort(function(x,y){return x.i-y.i});
  }

  function summarize(probs){
    var m={};
    probs.forEach(function(o){ (o.tag||[]).forEach(function(w){ m[w]=(m[w]||0)+1; }); });
    return Object.keys(m).map(function(k){ return k+" "+m[k]+"줄"; }).slice(0,3);
  }

  // ---------- 모델 호출 ----------
  function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms) }); }

  // 키는 Edge Function 안에 있다. 브라우저는 토큰만 들고 간다.
  async function askOnce(prompt){
    var r=await api(FN.ai,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:prompt, json:true, max_tokens:3000})
    });
    var t=await r.text();
    if(!r.ok){
      var code="upstream_error";
      try{ code=(JSON.parse(t).error)||code; }catch(e){}
      var err=new Error(t.slice(0,200)); err.code=code; throw err;
    }
    var got=JSON.parse(t).text||"";
    // 모델이 코드블록으로 감싸는 경우가 있어 벗겨낸다.
    got=got.replace(/^```(json)?/i,"").replace(/```\s*$/,"").trim();
    try{ return JSON.parse(got); }
    catch(e){
      var i=got.indexOf("{"), j=got.lastIndexOf("}");
      if(i>=0 && j>i) return JSON.parse(got.slice(i,j+1));
      var e2=new Error("JSON 해석 실패"); e2.code="bad_json"; throw e2;
    }
  }

  // upstream_error 는 규칙 문제가 아니라 호출이 끊긴 것이다. 몇 번은 그냥 다시 걸면 된다.
  async function askJSON(prompt, tries, onTry){
    var last=null;
    for(var i=0;i<tries;i++){
      if(onTry && i) onTry(i+1, tries);
      try{
        var r=await askOnce(prompt);
        if(r) return r;
        last=new Error("empty");
      }catch(e){
        last=e;
        var c=(e&&e.code)||"";
        if(c==="unauthorized" || c==="no_key" || c==="bad_key") throw e;  // 다시 걸어도 소용없다
      }
      await sleep(800*(i+1));
    }
    throw last || new Error("failed");
  }

  // 규칙을 다 넣은 프롬프트가 계속 실패하면, 핵심만 남긴 짧은 걸로 한 번 더 간다.
  function shortPrompt(){
    var L=targetLines();
    var f=function(k){ return (current[k]||"").trim(); };
    var kw=f("keyword")||"특가";
    return "인스타 숙소 홍보 릴스 대본을 써주세요. 목표는 댓글이에요.\n\n"+
      "숙소: "+f("name")+" / "+f("area")+" / "+f("type")+" / "+f("people")+" / "+f("price")+"\n"+
      "혜택:\n"+f("perks")+"\n\n"+
      "- 컷 자막 "+L+"줄. 한 줄 6~10자, 최대 14자. 띄어쓰기는 정확히.\n"+
      "- 첫 두 줄은 긴장으로. 사양 나열 금지.\n"+
      "- 숙소명·주소·브랜드명은 쓰지 마세요.\n"+
      "- 금액은 '30만원대' 처럼 만원 단위로.\n"+
      "- 마지막 3~4줄은 댓글 유도. 키워드는 \""+kw+"\".\n"+
      "- 커버 2줄: 1줄째 윗줄(16자 이내), 2줄째 아랫줄(10자 이내).\n\n"+
      'JSON 만: {"cover":["윗줄","아랫줄"],"script":["1컷", ... "'+L+'컷"]}';
  }

  // 틀린 줄만 다시 받는다. 전체를 다시 만들면 멀쩡한 줄까지 바뀐다.
  async function repairLines(lines, probs, cover){
    var list=probs.slice(0,8);
    var prompt="인스타 릴스 자막 중 몇 줄이 규칙을 어겼어요. 그 줄만 고쳐주세요.\n\n"+
      "커버 문구:\n"+String(cover||"")+"\n\n"+
      "전체 자막 (흐름 참고용, 번호는 1부터):\n"+
      lines.map(function(t,i){ return (i+1)+". "+t; }).join("\n")+"\n\n"+
      "고칠 줄:\n"+
      list.map(function(o){ return (o.i+1)+". \""+o.text+"\" → "+o.why; }).join("\n")+"\n\n"+
      "규칙:\n"+
      "- 뜻과 역할은 그대로 두고 표현만 고치세요. 앞뒤 줄과 이어져야 해요.\n"+
      "- 한 줄은 공백 빼고 6~10자, 최대 14자.\n"+
      "- 띄어쓰기는 평소대로 정확히 하세요.\n"+
      "- 금액은 만원 단위로. 숙소명·브랜드명은 쓰지 마세요.\n"+
      "- 고치라고 한 줄만 주세요. 나머지는 건드리지 마세요.\n\n"+
      "JSON 하나만 답하세요. 키는 줄 번호(1부터)예요.\n"+
      '{"fixed":{"'+(list[0].i+1)+'":"고친 줄", ...}}';
    var got=await askJSON(prompt, 2);
    var fx=got && got.fixed;
    if(!fx) return 0;
    var n=0;
    list.forEach(function(o){
      var v=fx[String(o.i+1)];
      if(v==null) v=fx[o.i+1];
      if(v==null) return;
      v=String(v).trim();
      if(v && v!==lines[o.i]){ lines[o.i]=v; n++; }
    });
    return n;
  }

  // 줄 수가 모자라면 모자란 만큼만 더 받는다.
  async function extendLines(lines, want, cover){
    var need=want-lines.length;
    if(need<=0) return 0;
    var prompt="인스타 릴스 자막이 "+need+"줄 모자라요. 뒤에 이어질 "+need+"줄만 써주세요.\n\n"+
      "커버 문구:\n"+String(cover||"")+"\n\n"+
      "지금까지의 자막:\n"+lines.map(function(t,i){return (i+1)+". "+t}).join("\n")+"\n\n"+
      "규칙:\n"+
      "- 한 줄은 공백 빼고 6~10자, 최대 14자. 띄어쓰기는 정확히.\n"+
      "- 마지막 3~4줄은 댓글 유도로 끝나야 해요. 키워드는 \""+((current.keyword||"").trim()||"특가")+"\".\n"+
      "- 숙소명·브랜드명·원 단위 금액은 쓰지 마세요.\n\n"+
      'JSON 하나만: {"more":["...", ... '+need+'개]}';
    var got=await askJSON(prompt, 2);
    var more=got && [].concat(got.more||[]).map(function(x){return String(x).trim()}).filter(Boolean);
    if(!more || !more.length) return 0;
    more.slice(0,need).forEach(function(t){ lines.push(t); });
    return more.length;
  }

  async function makeScript(){
    var st=function(m,bad){var e=document.getElementById("scstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!uid){ st("로그인이 필요해요.",true); return; }
    if(!(current.name||"").trim() && !(current.perks||"").trim()){
      st("숙소 정보가 비어 있어요. 먼저 채워주세요.",true); return;
    }

    var want=targetLines(), got=null, why="";
    st("대본을 쓰는 중이에요... 20~60초 걸려요");
    try{
      got=await askJSON(scriptPrompt(), 3, function(i,n){
        st("호출이 끊겼어요. 다시 거는 중 "+i+"/"+n+"...");
      });
    }catch(e){
      why=(e&&e.code)||(e&&e.message)||"";
      if(why==="unauthorized"){ st("로그인이 풀렸어요. 새로고침해주세요.",true); return; }
      if(why==="no_key"||why==="bad_key"){
        st("ANTHROPIC_API_KEY 가 설정되지 않았거나 잘못됐어요.",true); return; }
      // 규칙을 다 넣은 프롬프트가 안 먹히는 경우가 있다. 짧은 걸로 한 번 더.
      st("긴 지시가 안 먹히네요. 짧은 지시로 다시 해볼게요...");
      try{ got=await askJSON(shortPrompt(), 2); }
      catch(e2){ why=(e2&&e2.code)||(e2&&e2.message)||why; }
    }
    if(!got || !got.script){
      st("대본 생성에 실패했어요"+(why?" ("+why+")":"")+". 잠시 뒤 다시 눌러주세요.",true);
      return;
    }

    var lines=[].concat(got.script).map(function(x){return String(x).trim()}).filter(Boolean);
    var cvText=[].concat(got.cover||[]).map(function(x){return String(x).trim()}).join("\n");

    // 모자란 줄 채우기
    if(lines.length < want){
      st("자막이 "+(want-lines.length)+"줄 모자라요. 그만큼만 더 받는 중...");
      try{ await extendLines(lines, want, cvText); }catch(e3){}
    }
    if(lines.length > want) lines=lines.slice(0, want);

    // 틀린 줄만 고치기. 될 때까지가 아니라 나아지는 동안만 돈다.
    var probs=lineProblems(lines, cvText), round=0;
    while(probs.length && round<3){
      round++;
      st("규칙을 어긴 "+probs.length+"줄을 고치는 중... ("+round+"/3)");
      var fixed=0;
      try{ fixed=await repairLines(lines, probs, cvText); }catch(e4){ break; }
      if(!fixed) break;                       // 더 못 고치면 사람에게 넘긴다
      var next=lineProblems(lines, cvText);
      if(next.length>=probs.length) { probs=next; break; }
      probs=next;
    }

    current.script=lines.join("\n");
    current.map=[];
    current.cover=cvText;
    await persist(current);
    renderEdit(current);

    var e2=document.getElementById("scstat");
    if(e2){
      var left=summarize(probs);
      e2.className="status"+(left.length?" bad":"");
      e2.textContent="자막 "+lines.length+"줄 · 약 "+
        (lines.length*VIDEO.cut+VIDEO.coverHold).toFixed(1)+"초."+
        (left.length ? "  못 고친 곳: "+left.join(" / ")+". 직접 손봐주세요."
                     : "  규칙 검사 통과. 읽어보고 사진을 올리세요.");
    }
  }

  // ---------- 영상 만들기 ----------
  function wrapText(t,max){
    var out=[],cur="";
    String(t).split(/\s+/).forEach(function(w){
      var c=(cur+" "+w).trim();
      if(c.length<=max||!cur) cur=c; else { out.push(cur); cur=w; }
    });
    if(cur) out.push(cur);
    return out;
  }

  function loadImg(url){
    return new Promise(function(res,rej){
      var im=new Image(); im.crossOrigin="anonymous";
      im.onload=function(){res(im)}; im.onerror=function(){rej(new Error("이미지 로드 실패"))};
      im.src=url;
    });
  }

  // 글자가 화면을 넘지 않는 가장 큰 크기를 찾는다.
  function fitSize(g,lines,family,want,maxW){
    var sz=want;
    for(; sz>30; sz-=2){
      g.font=sz+'px "'+family+'", sans-serif';
      var ok=true;
      for(var i=0;i<lines.length;i++){
        if(g.measureText(lines[i]).width>maxW){ ok=false; break; }
      }
      if(ok) break;
    }
    g.font=sz+'px "'+family+'", sans-serif';
    return sz;
  }

  function drawCover(g,im,lines){
    var W=VIDEO.w,H=VIDEO.h;
    drawFill(g,im,1,0.5,0.5);
    g.fillStyle="rgba(0,0,0,0.40)"; g.fillRect(0,0,W,H);
    g.textAlign="center"; g.lineJoin="round";

    // 레퍼런스 커버는 전부 '설정 → 펀치' 순서다.
    // 윗줄로 상황을 깔고, 아랫줄에서 결론을 때린다. 글자 크기도 그 순서를 따른다.
    var lead =wrapText(lines[0]||"",16);
    var punch=wrapText(lines[1]||"",10);
    if(!punch.length){ punch=lead; lead=[]; }   // 한 줄만 썼으면 그 줄이 펀치다

    var ls = lead.length  ? fitSize(g,lead,"ReelCover",80,940)  : 0;
    var ps = punch.length ? fitSize(g,punch,"ReelCover",176,930) : 0;
    var lh = ls*1.30, ph = ps*1.14;
    var gap = lead.length ? Math.round(ps*0.22) : 0;
    var total = lead.length*lh + gap + punch.length*ph;

    // 인스타 그리드는 가운데 1:1 만 보여준다. 그 한가운데에 블록을 둔다.
    var y = H/2 - total/2;

    if(lead.length){
      g.font=ls+'px "ReelCover", sans-serif';
      lead.forEach(function(t,i){
        stroked(g,t,W/2,y+i*lh+lh*0.78,"#FFE55C",Math.max(6,Math.round(ls*0.13)));
      });
      y += lead.length*lh + gap;
    }
    g.font=ps+'px "ReelCover", sans-serif';
    punch.forEach(function(t,i){
      stroked(g,t,W/2,y+i*ph+ph*0.8,"#fff",Math.max(8,Math.round(ps*0.085)));
    });
  }

  function stroked(g,t,x,y,fill,w){
    g.strokeStyle="rgba(0,0,0,0.9)"; g.lineWidth=w; g.strokeText(t,x,y);
    g.fillStyle=fill; g.fillText(t,x,y);
  }

  // 사진을 화면에 꽉 채우되 비율을 유지한다. zoom 과 중심점으로 켄번즈를 만든다.
  function drawFill(g,im,zoom,cx,cy){
    var W=VIDEO.w,H=VIDEO.h;
    var s=Math.max(W/im.width,H/im.height)*zoom;
    var dw=im.width*s, dh=im.height*s;
    var dx=(W-dw)*cx, dy=(H-dh)*cy;
    g.drawImage(im,dx,dy,dw,dh);
  }

  function drawCut(g,im,text,t){
    var W=VIDEO.w;
    drawFill(g,im,1.0+0.18*t,0.5,0.5);
    if(!text) return;
    g.textAlign="center"; g.lineJoin="round";
    // 자막은 줄을 접지 않는다. 길면 글자를 줄여서 한 줄에 넣는다.
    var sz=fitSize(g,[text],"ReelBody",72,980);
    stroked(g, text, W/2, VIDEO.subY, "#fff", Math.max(4,Math.round(sz*0.07)));
  }

  // ---------- 썸네일 따로 보기 / 따로 저장 ----------
  var thumbBlob=null, thumbUrl=null;

  async function drawCoverTo(canvas){
    var photos=current.photos||[];
    if(!photos.length) throw new Error("no_photo");
    try{ await document.fonts.load('176px "ReelCover"'); }catch(e){}
    var ci=(typeof current.coverPhoto==="number" && current.coverPhoto<photos.length)
           ? current.coverPhoto : 0;
    var im=await loadImg(blobUrl(photos[ci].id));
    canvas.width=VIDEO.w; canvas.height=VIDEO.h;
    var g=canvas.getContext("2d");
    drawCover(g, im, (current.cover||"").split("\n").map(function(x){return x.trim()}));
  }

  async function makeThumb(){
    var box=document.getElementById("thumbbox");
    var st=function(m,bad){var e=document.getElementById("vdstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!box) return;
    if(!(current.photos||[]).length){ st("사진을 먼저 올려주세요. 첫 장이 썸네일이 돼요.",true); return; }
    st("썸네일을 그리는 중...");
    var cv=document.createElement("canvas");
    try{ await drawCoverTo(cv); }
    catch(e){ st("썸네일을 만들지 못했어요.",true); return; }

    var blob=await new Promise(function(res){ cv.toBlob(res,"image/jpeg",0.93); });
    if(!blob){ st("썸네일을 만들지 못했어요.",true); return; }
    thumbBlob=blob;
    if(thumbUrl) URL.revokeObjectURL(thumbUrl);
    thumbUrl=URL.createObjectURL(blob);

    box.innerHTML='<div class="tprev"><img alt="썸네일" src="'+thumbUrl+'">'+
      '<div class="sq"><b>그리드에 보이는 범위</b></div></div>'+
      '<p class="hint" style="text-align:center;margin-top:8px">'+
      VIDEO.w+'×'+VIDEO.h+' · '+(blob.size/1024).toFixed(0)+'KB</p>'+
      '<button type="button" id="savethumb" style="width:100%;margin-top:8px">썸네일 저장</button>';
    st("점선 안이 인스타 프로필 그리드에 보이는 부분이에요.");

    var sb=document.getElementById("savethumb");
    if(sb) sb.addEventListener("click",async function(){
      if(!downloads){ st("이 화면에서는 저장을 못 해요.",true); return; }
      if(!thumbBlob){ st("먼저 썸네일 보기를 눌러주세요.",true); return; }
      sb.disabled=true;
      try{
        await downloads.save({filename:((current.folder||"reels").trim())+"_cover.jpg", data:thumbBlob});
        st("썸네일을 저장했어요.");
      }catch(e){
        st(e&&e.code==="declined"?"취소했어요.":"저장하지 못했어요.",true);
      }finally{ sb.disabled=false; }
    });
  }

  function pickMime(){
    var want=['video/mp4;codecs="avc1.42E01E,mp4a.40.2"','video/mp4',
              'video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    for(var i=0;i<want.length;i++){
      if(window.MediaRecorder && MediaRecorder.isTypeSupported(want[i])) return want[i];
    }
    return null;
  }

  async function makeVideo(){
    var st=function(m,bad){var e=document.getElementById("vdstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    var photos=current.photos||[];
    if(!photos.length){ st("영상에 들어갈 사진을 먼저 올려주세요.",true); return; }
    if(!window.MediaRecorder){ st("이 브라우저는 영상 녹화를 지원하지 않아요.",true); return; }
    var mime=pickMime();
    if(!mime){ st("이 브라우저가 만들 수 있는 영상 형식이 없어요.",true); return; }

    st("폰트와 사진을 준비하는 중...");
    try{ await document.fonts.load('110px "ReelCover"'); await document.fonts.load('72px "ReelBody"'); }catch(e){}
    var imgs=[];
    try{
      for(var i=0;i<photos.length;i++) imgs.push(await loadImg(blobUrl(photos[i].id)));
    }catch(e){ st("사진을 불러오지 못했어요.",true); return; }

    var cuts=(current.script||"").split("\n").map(function(x){return x.trim()})
             .filter(function(x){return x});
    var cover=(current.cover||"").split("\n").map(function(x){return x.trim()});

    // 두 트랙을 따로 받아 각자 음량을 먹인 뒤 한 갈래로 합친다.
    var actx=null, dest=null, narBuf=null, bgmBuf=null;
    var useNar=!!(current.tts && !current.ttsMute);
    var useBgm=!!(current.bgm && !current.bgmMute);
    if(useNar || useBgm){
      st("소리를 준비하는 중...");
      try{
        actx=new (window.AudioContext||window.webkitAudioContext)();
        if(actx.state==="suspended") await actx.resume();
        dest=actx.createMediaStreamDestination();
        if(useNar) narBuf=await loadAudio(actx, current.tts);
        if(useBgm) bgmBuf=await loadAudio(actx, current.bgm);
      }catch(e){
        st("소리를 불러오지 못했어요. 소리 없이 만들게요.");
        actx=null; dest=null; narBuf=null; bgmBuf=null;
      }
    }

    var cv=document.createElement("canvas");
    cv.width=VIDEO.w; cv.height=VIDEO.h;
    var g=cv.getContext("2d");
    var stream=cv.captureStream(VIDEO.fps);
    if(dest) dest.stream.getAudioTracks().forEach(function(tr){ stream.addTrack(tr); });
    var chunks=[], rec;
    try{ rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000}); }
    catch(e){ st("녹화를 시작하지 못했어요.",true); return; }
    rec.ondataavailable=function(ev){ if(ev.data && ev.data.size) chunks.push(ev.data); };

    var cIdx=(typeof current.coverPhoto==="number" && current.coverPhoto<imgs.length)
             ? current.coverPhoto : 0;
    var done=new Promise(function(res){ rec.onstop=res; });
    rec.start();

    // 어떤 컷에 어떤 사진을 쓸지는 ⑤ 컷 맞추기에서 정한 값을 그대로 쓴다.
    // 같은 사진이 연달아 나오면 켄번즈 줌을 그 구간 전체에 걸쳐 이어서 멈춘 느낌을 없앤다.
    var N=cuts.length || imgs.length;
    var mp=ensureMap();
    var span=[], runFrom=[], runLen=[];
    for(var ci=0; ci<N; ci++){
      var v=mp[ci];
      span.push((typeof v==="number" && v>=0 && v<imgs.length)
                ? v : Math.min(imgs.length-1, Math.floor(ci*imgs.length/N)));
    }
    for(var ci2=0; ci2<N; ci2++){
      var a2=ci2; while(a2>0 && span[a2-1]===span[ci2]) a2--;
      var b2=ci2; while(b2<N-1 && span[b2+1]===span[ci2]) b2++;
      runFrom.push(a2); runLen.push(b2-a2+1);
    }

    var coverMs=VIDEO.coverHold*1000, cutMs=VIDEO.cut*1000;
    // 나레이션이 있으면 컷이 음성 길이에 맞춰 늘어난다.
    if(narBuf && current.fitToNar!==false && N>0){
      cutMs=Math.max(500, (narBuf.duration*1000)/N);
    }
    var total=coverMs+cutMs*N;

    var vol=function(k,d){
      var v=current[k+"Vol"];
      return (typeof v==="number") ? v : d;
    };
    if(actx){
      if(narBuf){
        var ns=actx.createBufferSource(); ns.buffer=narBuf;
        var ng=actx.createGain(); ng.gain.value=vol("tts",1);
        ns.connect(ng).connect(dest);
        ns.start(actx.currentTime + coverMs/1000);     // 커버가 지나고 말이 시작된다
      }
      if(bgmBuf){
        var bs=actx.createBufferSource(); bs.buffer=bgmBuf; bs.loop=true;
        var bg=actx.createGain(); bg.gain.value=vol("bgm",0.22);
        // 끝에서 뚝 끊기지 않게 마지막 0.6초를 줄인다
        var endT=actx.currentTime + total/1000;
        bg.gain.setValueAtTime(vol("bgm",0.22), Math.max(actx.currentTime, endT-0.6));
        bg.gain.linearRampToValueAtTime(0.0001, endT);
        bs.connect(bg).connect(dest);
        bs.start();
      }
    }

    var t0=performance.now();

    await new Promise(function(res){
      function frame(){
        var el=performance.now()-t0;
        if(el>=total){ res(); return; }
        if(el<coverMs){ drawCover(g,imgs[cIdx],cover); }
        else{
          var idx=Math.min(N-1, Math.floor((el-coverMs)/cutMs));
          var inCut=((el-coverMs)-idx*cutMs)/cutMs;
          var k=(idx-runFrom[idx]+inCut)/runLen[idx];
          drawCut(g,imgs[span[idx]],cuts[idx]||"",k);
        }
        st("만드는 중... "+Math.round(el/total*100)+"%  (화면을 끄지 마세요)");
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });

    rec.stop();
    await done;
    if(actx){ try{ await actx.close(); }catch(e){} }

    var ext = mime.indexOf("mp4")>=0 ? "mp4" : "webm";
    var blob=new Blob(chunks,{type:mime});
    st("저장할게요... "+(blob.size/1048576).toFixed(1)+"MB / ."+ext);
    if(!downloads){ st("이 화면에서는 저장을 못 해요.",true); return; }
    try{
      await downloads.save({filename:((current.folder||"reels").trim())+"."+ext, data:blob});
      st(ext==="mp4" ? "완성했어요. 인스타에 바로 올리시면 돼요."
        : "완성했지만 형식이 webm 이에요. 인스타는 webm 을 안 받아서 mp4 변환이 필요해요.", ext!=="mp4");
    }catch(e){
      st(e&&e.code==="declined"?"취소했어요.":"저장하지 못했어요.",true);
    }
  }

  // ---------- 자동저장 ----------
  // 폰에서는 다른 앱을 보는 사이 탭이 통째로 정리되는 일이 잦다.
  // 타이핑이 멈추면 바로 저장해서, 화면이 날아가도 입력이 남게 한다.
  var saveTimer=null, saveMark=null;

  function markSaving(){
    saveMark=document.getElementById("savemark");
    if(saveMark) saveMark.textContent="저장 중...";
  }
  function markSaved(ok){
    saveMark=document.getElementById("savemark");
    if(saveMark) saveMark.textContent = ok? "저장됨" : "저장 안 됨";
  }

  function autosave(){
    if(!current) return;
    markSaving();
    clearTimeout(saveTimer);
    saveTimer=setTimeout(flushSave, 1200);
  }

  function flushSave(){
    clearTimeout(saveTimer);
    if(!current) return;
    if(!(current.folder||"").trim() && !(current.name||"").trim()) return;
    if(projects.indexOf(current)<0) projects.unshift(current);
    persist(current).then(markSaved);
  }

  // 앱을 내리거나 탭을 숨길 때는 기다리지 않고 바로 저장한다.
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden") flushSave();
  });
  window.addEventListener("pagehide", flushSave);
  window.addEventListener("blur", flushSave);

  // ---------- 편집 ----------
  function imageSection(kind, title, hint){
    var key = kind==="photo" ? "photos" : "infos";
    var list = current[key]||[];
    var h='<h2>'+esc(title)+'</h2><div class="card">';
    h+='<p class="hint" style="margin:0 0 10px">'+esc(hint)+'</p>';
    h+='<button type="button" class="pickbtn" data-pick="'+kind+'">'+
       esc(kind==="photo"?"사진 고르기":"캡처 고르기")+'</button>'+
       '<input class="sr" type="file" accept="image/*" multiple '+
       'id="file_'+kind+'" data-kind="'+kind+'">';
    if(list.length){
      h+='<div class="grid">';
      list.forEach(function(it,i){
        h+='<div class="thumb"><span class="n">'+(i+1)+'</span>'+
           '<img src="'+blobUrl(it.id)+'" alt="">'+
           '<div class="ops">'+
           '<button data-mv="-1" data-kind="'+kind+'" data-i="'+i+'">←</button>'+
           '<button data-mv="1" data-kind="'+kind+'" data-i="'+i+'">→</button>'+
           '<button data-del="1" data-kind="'+kind+'" data-i="'+i+'">×</button>'+
           '</div></div>';
      });
      h+='</div>';
    }
    if(kind==="info"){
      h+='<p class="status" id="autostat"></p>';
      if(list.length) h+='<button type="button" id="refill" style="width:100%;margin-top:8px">캡처 다시 읽기</button>';
    }
    return h+'</div>';
  }

  function renderEdit(p){
    current=p;
    current.photos=current.photos||[]; current.infos=current.infos||[];
    var h=imageSection("info","① 업체 상세페이지 캡처",
       "먼저 올리세요. 적힌 내용을 읽어서 아래 칸을 자동으로 채워줘요. "+
       "길어도 그대로 올리면 돼요. 영상에는 안 들어가요.");
    h+='<h2>② 숙소 정보</h2><div class="card">';
    FIELDS.forEach(function(f){
      var v=esc(p[f.k]||"");
      h+='<label for="f_'+f.k+'">'+esc(f.label||f.h)+
         (f.h?'':' <span>(파일에는 안 들어가요)</span>')+'</label>';
      if(f.type==="textarea") h+='<textarea id="f_'+f.k+'" placeholder="'+esc(f.ph||"")+'">'+v+'</textarea>';
      else if(f.type==="select") h+='<select id="f_'+f.k+'">'+f.opts.map(function(o){
        return '<option'+(o===(p[f.k]||f.opts[0])?' selected':'')+'>'+esc(o)+'</option>';}).join("")+'</select>';
      else h+='<input id="f_'+f.k+'" type="text" value="'+v+'" placeholder="'+esc(f.ph||"")+'">';
      if(f.hint) h+='<p class="hint">'+esc(f.hint)+'</p>';
    });
    h+='</div>';

    h+=scriptSection();

    h+=imageSection("photo","④ 영상에 들어갈 사진",
       "대본을 보면서 어울리는 컷을 올리세요. 여기 순서는 중요하지 않아요. "+
       "어떤 자막에 어떤 사진을 쓸지는 아래에서 정해요.");

    h+=matchSection();
    h+=soundSection();
    h+='<p class="status" id="savemark">저장됨</p>';
    h+='<h2>다음</h2><div class="card"><pre id="guide"></pre></div>';
    h+='<div class="row" style="margin-top:14px"><button class="ghost danger" id="del">이 숙소 삭제</button></div>';
    view.innerHTML=h;
    updateGuide();

    FIELDS.forEach(function(f){
      var el=document.getElementById("f_"+f.k);
      el.addEventListener("input",function(){
        current[f.k]=el.value;
        if(f.k==="folder") updateGuide();
        autosave();
      });
      el.addEventListener("change",function(){ current[f.k]=el.value; autosave(); });
      el.addEventListener("blur",function(){ current[f.k]=el.value; flushSave(); });
    });

    Array.prototype.forEach.call(view.querySelectorAll('[data-pick]'),function(btn){
      btn.addEventListener("click",function(){
        var inp=document.getElementById("file_"+btn.dataset.pick);
        if(inp) inp.click();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll('input[type=file]'),function(inp){
      inp.addEventListener("change",function(){
        if(inp.files && inp.files.length){
          view.classList.add("busy");
          addImages(Array.prototype.slice.call(inp.files), inp.dataset.kind)
            .finally(function(){ view.classList.remove("busy"); });
        }
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll('[data-mv]'),function(b){
      b.addEventListener("click",function(){ moveImage(b.dataset.kind, +b.dataset.i, +b.dataset.mv); });
    });
    Array.prototype.forEach.call(view.querySelectorAll('[data-del]'),function(b){
      b.addEventListener("click",function(){
        if(confirm("이 사진을 지울까요?")) dropImage(b.dataset.kind, +b.dataset.i);
      });
    });
    ["cover","script"].forEach(function(k){
      var el=document.getElementById("f_"+k);
      if(!el) return;
      el.addEventListener("input",function(){ current[k]=el.value; autosave(); });
      el.addEventListener("blur",function(){ current[k]=el.value; flushSave(); });
    });
    var ms=document.getElementById("mkscript");
    if(ms) ms.addEventListener("click",async function(){
      ms.disabled=true; try{ await makeScript(); } finally{
        var b=document.getElementById("mkscript"); if(b) b.disabled=false; }
    });
    Array.prototype.forEach.call(view.querySelectorAll('[data-aud]'),function(el){
      if(el.tagName==="BUTTON"){
        el.addEventListener("click",function(){
          var i=document.getElementById("aud_"+el.dataset.aud); if(i) i.click();
        });
      }else{
        el.addEventListener("change",function(){
          if(el.files && el.files[0]){
            view.classList.add("busy");
            addAudio(el.files[0], el.dataset.aud)
              .finally(function(){ view.classList.remove("busy"); });
          }
        });
      }
    });
    var mkt=document.getElementById("mktts");
    if(mkt) mkt.addEventListener("click",async function(){
      mkt.disabled=true;
      try{ await makeTTS(); } finally{
        var b2=document.getElementById("mktts"); if(b2) b2.disabled=false; }
    });
    Array.prototype.forEach.call(view.querySelectorAll('[data-auddel]'),function(b){
      b.addEventListener("click",function(){ dropAudio(b.dataset.auddel); });
    });
    Array.prototype.forEach.call(view.querySelectorAll('[data-mute]'),function(b){
      b.addEventListener("change",function(){
        current[b.dataset.mute+"Mute"]=!b.checked; flushSave();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll('[data-vol]'),function(b){
      b.addEventListener("input",function(){
        current[b.dataset.vol+"Vol"]=(+b.value)/100;
        var lab=b.parentNode.querySelector(".trkval");
        if(lab) lab.textContent=b.value;
        autosave();
      });
    });
    var fn=document.getElementById("fitnar");
    if(fn) fn.addEventListener("change",function(){ current.fitToNar=fn.checked; flushSave(); });

    var ag=document.getElementById("f_angle");
    if(ag) ag.addEventListener("change",function(){ current.angle=ag.value; flushSave(); });
    var cn=document.getElementById("copynar");
    if(cn) cn.addEventListener("click",async function(){
      // 자막은 끊어 읽히지만 음성은 이어 읽어야 자연스럽다.
      var txt=scriptLines().join(" ").replace(/\s+/g," ").trim();
      if(!txt){ toast("대본을 먼저 만들어주세요"); return; }
      try{ await navigator.clipboard.writeText(txt); toast("복사했어요"); }
      catch(e){
        var ta=document.createElement("textarea");
        ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); toast("복사했어요"); }
        catch(e2){ toast("복사가 안 돼요. 자막 칸에서 직접 복사해주세요"); }
        ta.remove();
      }
    });
    var ls=document.getElementById("f_lines");
    if(ls) ls.addEventListener("change",function(){ current.lines=ls.value; flushSave(); });

    Array.prototype.forEach.call(view.querySelectorAll(".cpick"),function(b){
      b.addEventListener("click",function(){ openPicker(b, +b.dataset.cut); });
    });
    var rm=document.getElementById("remap");
    if(rm) rm.addEventListener("click",function(){
      current.map=[]; current.coverPhoto=0; ensureMap(); flushSave(); renderEdit(current);
    });

    var sw=document.getElementById("swapcover");
    if(sw) sw.addEventListener("click",function(){
      var el=document.getElementById("f_cover");
      if(!el) return;
      var L=el.value.split("\n").map(function(x){return x.trim()}).filter(Boolean);
      if(L.length<2){ toast("두 줄이어야 바꿀 수 있어요"); return; }
      el.value=[L[1],L[0]].concat(L.slice(2)).join("\n");
      current.cover=el.value; flushSave(); toast("순서를 바꿨어요");
    });
    var mt=document.getElementById("mkthumb");
    if(mt) mt.addEventListener("click",async function(){
      mt.disabled=true; try{ await makeThumb(); } finally{
        var b=document.getElementById("mkthumb"); if(b) b.disabled=false; }
    });
    var mv=document.getElementById("mkvideo");
    if(mv) mv.addEventListener("click",async function(){
      mv.disabled=true; try{ await makeVideo(); } finally{
        var b=document.getElementById("mkvideo"); if(b) b.disabled=false; }
    });

    var refill=document.getElementById("refill");
    if(refill) refill.addEventListener("click",async function(){
      refill.disabled=true;
      try{ await autofill(await infoBlobs()); }
      finally{ var r2=document.getElementById("refill"); if(r2) r2.disabled=false; }
    });

    document.getElementById("del").addEventListener("click",async function(){
      if(!confirm("숙소를 통째로 삭제할까요? 올린 사진도 같이 지워져요.")) return;
      await removeProject(current); renderList(); toast("삭제했어요");
    });

    bar.innerHTML='<button class="ghost" id="back">목록</button>'+
                  '<button class="primary" id="zip">폴더 받기</button>';
    document.getElementById("back").addEventListener("click",async function(){
      clearTimeout(saveTimer);
      if((current.folder||"").trim()||(current.name||"").trim()){
        if(projects.indexOf(current)<0) projects.unshift(current);
        await persist(current);
      }
      renderList();
    });
    document.getElementById("zip").addEventListener("click",async function(){
      if(projects.indexOf(current)<0) projects.unshift(current);
      await persist(current);
      await exportZip();
    });
  }

  function updateGuide(){
    var f=((current.folder||"").trim())||"폴더명";
    document.getElementById("guide").textContent =
      "① 캡처 올리기 → 빈 칸이 자동으로 채워져요\n"+
      "② 정보 확인 (가격 어필 방식 꼭 고르기)\n"+
      "③ 대본 만들기 → 읽어보고 고치기\n"+
      "④ 대본에 어울리는 사진 올리기\n"+
      "⑤ 컷마다 사진 고르기\n"+
      "⑥ 목소리 만들고 영상 만들기\n\n"+
      "PC 로 가져가려면:\n"+
      "1. '폴더 받기' 를 누르면 "+f+".zip 이 받아져요\n\n"+
      "2. reels-runner / input / photos 안에\n"+
      "   압축을 푸세요\n\n"+
      "3. 1_make_script.bat 더블클릭\n"+
      "4. review.md 읽고 확인\n"+
      "5. 2_make_video.bat 더블클릭";
  }

  // ---------- 폰트 ----------
  // 라이선스 폰트라 저장소에 넣지 않고 사용자의 Storage 에 한 번만 올린다.
  var FONTS=[{k:"body", h:"본문(자막)용", face:"ReelBody"},
             {k:"cover", h:"썸네일 제목용", face:"ReelCover"}];
  var fontsReady={};

  function fontPath(k){ return uid+"/_fonts/"+k+".ttf"; }

  async function checkFonts(){
    fontsReady={};
    if(!uid) return;
    await Promise.all(FONTS.map(async function(f){
      try{
        var r=await fetch(blobUrl(fontPath(f.k)), {method:"HEAD", cache:"no-store"});
        if(r.ok){
          fontsReady[f.k]=true;
          var fx=new FontFace(f.face, 'url("'+blobUrl(fontPath(f.k))+'")');
          await fx.load();
          document.fonts.add(fx);
        }
      }catch(e){}
    }));
  }

  function fontSection(){
    var missing=FONTS.filter(function(f){ return !fontsReady[f.k] });
    if(!missing.length) return "";
    return '<h2>폰트</h2><div class="card">'+
      '<p class="hint" style="margin:0 0 10px">영상에 쓸 글꼴을 한 번만 올려두면 계속 쓰여요. '+
      '안 올리면 기본 글꼴로 나옵니다.</p>'+
      FONTS.map(function(f){
        return '<div class="trk"><div class="trkhead"><b>'+esc(f.h)+'</b>'+
          '<span class="trkname">'+(fontsReady[f.k]?"올려둠":"없음")+'</span></div>'+
          '<button type="button" class="pickbtn" data-font="'+f.k+'" style="padding:10px">'+
          (fontsReady[f.k]?"다른 파일로 바꾸기":"ttf 파일 고르기")+'</button>'+
          '<input class="sr" type="file" accept=".ttf,.otf,font/*" id="fnt_'+f.k+'" data-font="'+f.k+'">'+
          '</div>';
      }).join("")+
      '<p class="status" id="fntstat"></p></div>';
  }

  async function addFont(file, k){
    var st=function(m,bad){var e=document.getElementById("fntstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!uid){ st("로그인이 필요해요.",true); return; }
    if(file.size > 12*1024*1024){ st("폰트 파일이 너무 커요.",true); return; }
    st("올리는 중...");
    try{
      await storeUpload(fontPath(k), file, "font/ttf");
      await checkFonts();
      renderList();
      toast("폰트를 올렸어요");
    }catch(e){ st("올리지 못했어요: "+String((e&&e.message)||"").slice(0,80), true); }
  }

  // ---------- 로그인 ----------
  function renderLogin(msg, bad){
    bar.innerHTML="";
    document.getElementById("where").textContent="";
    view.innerHTML=
      '<div class="card" style="max-width:380px;margin:40px auto">'+
        '<h2 style="margin:0 0 4px">로그인</h2>'+
        '<p class="hint" style="margin:0 0 12px">이 기기에 로그인해두면 다음부터는 바로 열려요.</p>'+
        '<label for="lg_mail">이메일</label>'+
        '<input id="lg_mail" type="text" inputmode="email" autocomplete="username" placeholder="you@example.com">'+
        '<label for="lg_pw">비밀번호</label>'+
        '<input id="lg_pw" type="password" autocomplete="current-password" placeholder="6자 이상">'+
        '<button type="button" class="primary" id="lg_in" style="width:100%;margin-top:14px">로그인</button>'+
        '<button type="button" id="lg_up" style="width:100%;margin-top:8px">처음이에요 (가입)</button>'+
        '<p class="status'+(bad?" bad":"")+'" id="lg_st">'+esc(msg||"")+'</p>'+
      '</div>';
    var st=function(m,isBad){
      var e=document.getElementById("lg_st");
      if(e){ e.textContent=m; e.className="status"+(isBad?" bad":""); }
    };
    var go=async function(kind){
      var mail=(document.getElementById("lg_mail").value||"").trim();
      var pw=document.getElementById("lg_pw").value||"";
      if(!mail || !pw){ st("이메일과 비밀번호를 적어주세요.",true); return; }
      st(kind==="up" ? "가입하는 중..." : "로그인하는 중...");
      try{
        var j = kind==="up" ? await signUp(mail,pw) : await signIn(mail,pw);
        if(!j.access_token){
          st("메일로 보낸 확인 링크를 누른 뒤 다시 로그인해주세요.");
          return;
        }
        await start();
      }catch(e){
        st((e&&e.message)||"실패했어요.",true);
      }
    };
    document.getElementById("lg_in").addEventListener("click",function(){ go("in") });
    document.getElementById("lg_up").addEventListener("click",function(){ go("up") });
    document.getElementById("lg_pw").addEventListener("keydown",function(ev){
      if(ev.key==="Enter") go("in");
    });
  }

  // ---------- 시작 ----------
  async function start(){
    if(!session || !session.access_token){ renderLogin(); return; }
    view.innerHTML='<div class="empty">불러오는 중...</div>';
    await loadAll();
    if(!uid){ renderLogin("로그인이 풀렸어요. 다시 로그인해주세요.", true); return; }
    usage=await storeUsage();
    await checkFonts();
    capNote="";
    renderList();
    document.getElementById("where").textContent="계정 저장";
  }

  (async function init(){
    saveSession(readSession());
    if(session && session.access_token){
      // 저장된 토큰이 살아 있는지 한 번 확인한다.
      var r=await fetch(SUPA.url+"/auth/v1/user",{headers:authHeaders()});
      if(!r.ok && !(await refresh())) saveSession(null);
    }
    await start();
    // 토큰은 한 시간쯤 산다. 미리 갱신해 작업 중에 끊기지 않게 한다.
    setInterval(function(){ if(session) refresh(); }, 45*60*1000);
  })();
})();
</script>
</body>
</html>
