  // ---------- @ 목록 ----------
  // 프롬프트 칸에서 @ 를 치면 칸 바로 아래에 요소·사진 목록을 띄운다. 고르면 @… 자리에 [이름] 이 들어간다.
  var mpick=null;
  function mentionOptions(proj, pid, stage, q){
    var opts=[];
    elemList(proj).forEach(function(el){
      if(!el.name || elemNameProblem(proj, el.name, el.key)) return;
      var f=elemPhotos(el)[0];
      opts.push({label:el.name, sub:"요소", thumb:f && f.id});
    });
    if(stage==="clip"){ var e=(proj.edits||{})[pid]; opts.push({label:"가공", sub:"가공 사진", thumb:e && e.id}); }
    opts.push({label:"원본", sub:"원본 사진", thumb:pid});
    peekSpec(proj, pid).refs.forEach(function(r, j){ opts.push({label:"레퍼런스"+(j+1), sub:"레퍼런스", thumb:r.id}); });
    q=String(q||"");
    return opts.filter(function(o){ return !q || o.label.indexOf(q)>=0; });
  }
  // 커서 앞이 @… 이면 {start, q}. 메일 주소(a@b)처럼 영문·숫자 바로 뒤의 @ 는 빼고 한글 뒤는 받는다.
  function mentionQuery(text, caret){
    var m=String(text||"").slice(0, caret).match(/(^|[^A-Za-z0-9._%+-])@([^\s@\[\]]{0,20})$/);
    return m ? {start:caret-m[0].length+m[1].length, q:m[2]} : null;
  }
  // @… 을 [이름] 으로 바꾼 글과 새 커서 위치
  function mentionInsert(text, start, caret, label){
    var ins="["+label+"]";
    return {text:text.slice(0, start)+ins+text.slice(caret), caret:start+ins.length};
  }
  function mentionClose(){
    if(mpick && mpick.box && mpick.box.parentNode) mpick.box.parentNode.removeChild(mpick.box);
    mpick=null;
  }
  function mentionUpdate(ta, pid, stage){
    var mq=mentionQuery(ta.value, ta.selectionStart==null ? ta.value.length : ta.selectionStart);
    if(!mq || ta.selectionStart!==ta.selectionEnd){ mentionClose(); return; }
    var items=mentionOptions(current, pid, stage, mq.q);
    if(!items.length){ mentionClose(); return; }
    if(!mpick || mpick.ta!==ta){
      mentionClose();
      var box=document.createElement("div");
      box.className="mbox"; box.setAttribute("role", "listbox");
      ta.insertAdjacentElement("afterend", box);
      mpick={ta:ta, box:box, pid:pid, stage:stage, sel:0};
      // 누르는 동안 칸에서 포커스가 빠지지 않게
      box.addEventListener("pointerdown", function(ev){ ev.preventDefault(); });
      box.addEventListener("click", function(ev){
        var b=ev.target.closest ? ev.target.closest("button[data-mi]") : null;
        if(b) mentionPick(+b.dataset.mi);
      });
    }
    mpick.items=items; mpick.start=mq.start;
    if(mpick.sel>=items.length) mpick.sel=0;
    mentionDraw();
  }
  function mentionDraw(){
    if(!mpick) return;
    mpick.box.innerHTML=mpick.items.map(function(o, k){
      return '<button type="button" role="option" data-mi="'+k+'"'+(k===mpick.sel ? ' class="on" aria-selected="true"' : '')+'>'+
        (o.thumb ? '<img src="'+esc(blobUrl(o.thumb))+'" alt="">' : '<span class="noimg"></span>')+
        '<span>'+esc(o.label)+'</span><small>'+esc(o.sub)+'</small></button>';
    }).join("");
  }
  function mentionPick(k){
    if(!mpick || !mpick.items[k]) return;
    var ta=mpick.ta, caret=ta.selectionStart==null ? ta.value.length : ta.selectionStart;
    var r=mentionInsert(ta.value, mpick.start, caret, mpick.items[k].label);
    mentionClose();
    ta.value=r.text;
    ta.focus();
    try{ ta.setSelectionRange(r.caret, r.caret); }catch(e){}
    ta.dispatchEvent(new Event("input", {bubbles:true}));
  }
  function mentionKey(ev){
    if(!mpick || ev.target!==mpick.ta || ev.isComposing) return;
    if(ev.key==="ArrowDown" || ev.key==="ArrowUp"){
      ev.preventDefault();
      var n=mpick.items.length;
      mpick.sel=(mpick.sel+(ev.key==="ArrowDown" ? 1 : n-1))%n;
      mentionDraw();
    }else if(ev.key==="Enter" || ev.key==="Tab"){
      ev.preventDefault();
      mentionPick(mpick.sel);
    }else if(ev.key==="Escape"){
      ev.preventDefault();
      mentionClose();
    }
  }

  function b64ToBlob(b64, mime){
    var bin=atob(b64), n=bin.length, u=new Uint8Array(n);
    for(var i=0;i<n;i++) u[i]=bin.charCodeAt(i);
    return new Blob([u], {type:mime||"image/jpeg"});
  }

  // 생성 결과를 원본 사진 비율로 저장한다. 16의 배수 반올림 차이도 보정한다.
  // 모델이 다른 비율을 반환하면 원본 비율에 맞춰 최소한만 중앙 크롭하고 알림을 남긴다.
  function fitOriginalAspect(blob, targetW, targetH){
    return new Promise(function(res,rej){
      var u=URL.createObjectURL(blob), img=new Image();
      img.onload=function(){
        var sw=img.naturalWidth, sh=img.naturalHeight;
        var ratio=(targetW>0 && targetH>0) ? targetW/targetH : sw/sh;
        var cw=sw, ch=sh, sx=0, sy=0;
        if(sw/sh>ratio){
          cw=sh*ratio; sx=(sw-cw)/2;
        }else{
          ch=sw/ratio; sy=(sh-ch)/2;
        }
        var W=Math.max(1,Math.round(cw)), H=Math.max(1,Math.round(ch));
        var c=document.createElement("canvas");c.width=W;c.height=H;
        var g=c.getContext("2d");g.imageSmoothingQuality="high";
        g.drawImage(img,sx,sy,cw,ch,0,0,W,H);
        URL.revokeObjectURL(u);
        var note=Math.abs(sw/sh-ratio)>0.02 ?
          ("생성 결과 "+sw+"×"+sh+" 를 원본 사진 비율에 맞춰 잘랐어요"):"";
        c.toBlob(function(b){b?res({blob:b,w:W,h:H,srcW:sw,srcH:sh,note:note}):rej(new Error("변환 실패"));},
                 "image/jpeg",0.92);
      };
      img.onerror=function(){URL.revokeObjectURL(u);rej(new Error("결과 이미지를 못 읽었어요"));};
      img.src=u;
    });
  }

  async function editOne(proj, photoId){
    var idx=(proj.photos||[]).findIndex(function(x){ return x.id===photoId; });
    if(idx<0) throw new Error("사진이 없어요");
    var body=editRequest(proj, photoId);
    if(!body) throw new Error((idx+1)+"번 사진 프롬프트가 비었어요");
    var plan=editRefPlan(proj, photoId);
    if(plan.over) throw new Error((idx+1)+"번 사진: 레퍼런스와 요소 사진이 합쳐서 "+plan.ids.length+"장이에요 (최대 "+EDIT.maxRefs+"장). 요소나 레퍼런스를 줄여주세요.");
    // 이전 프로젝트에 사진 크기 메타데이터가 없을 때도 원본에서 읽어 온다.
    if(!(body.baseW>0 && body.baseH>0)){
      var original=await loadImg(blobUrl(photoId));
      body.baseW=original.naturalWidth;body.baseH=original.naturalHeight;
    }
    var r=await api(FN.image,{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    var t=await r.text(), j=null;
    try{ j=JSON.parse(t); }catch(e){}
    if(!r.ok || !j || !j.b64){
      var msg=(j && (j.message||j.error)) || t.slice(0,160) || ("HTTP "+r.status);
      if(r.status===404) msg="이미지 가공 함수(/api/image-edit)가 아직 배포되지 않았어요.";
      else if(r.status===504 && !j) msg="시간 초과로 끊겼어요. 품질을 한 단계 낮춰 다시 해보세요.";
      throw new Error(msg);
    }
    var fit=await fitOriginalAspect(b64ToBlob(j.b64, j.mime),body.baseW,body.baseH);
    var up=await storeUpload(newPath(proj.id, "edited", "jpg"), fit.blob, "image/jpeg");
    proj.edits=proj.edits||{};
    var old=proj.edits[photoId];
    proj.edits[photoId]={
      id:up.id, w:fit.w, h:fit.h, size:up.sizeBytes, srcW:fit.srcW, srcH:fit.srcH,
      quality:j.quality||body.quality, refs:body.refs.length, at:Date.now(),
      note: [fit.note, j.size_fallback ? "크기만 자동 선택으로 재시도했어요. 품질 "+(j.quality||body.quality)+" 설정은 유지됐어요." : ""].filter(Boolean).join(" · ")
    };
    await persist(proj);
    if(old && old.id && old.id!==up.id){ try{ await storeDelete(old.id); }catch(e){} }
  }

  // 사진 여러 장을 차례로. 한 장이 실패해도 나머지는 계속 만든다.
  async function runEdits(photoIds){
    if(editBusy || !photoIds.length) return;
    var proj=current;
    flushSave();
    editBusy=true;
    var done=0, fail=0, lastErr="", t0=0, label="";
    var tick=function(){ editStatus(label+" · "+Math.round((Date.now()-t0)/1000)+"초"); };
    if(current===proj) renderEdit(proj);
    try{
      for(var k=0;k<photoIds.length;k++){
        var idx=(proj.photos||[]).findIndex(function(x){ return x.id===photoIds[k]; });
        if(idx<0) continue;
        label=(photoIds.length>1 ? (k+1)+"/"+photoIds.length+" · " : "")+(idx+1)+"번 사진 만드는 중";
        t0=Date.now(); tick();
        clearInterval(editTimer); editTimer=setInterval(tick, 1000);
        try{
          await editOne(proj, photoIds[k]);
          done++;
        }catch(e){
          fail++; lastErr=(e && e.message) || String(e);
          console.error("image edit failed", e);
        }
        clearInterval(editTimer);
        if(current===proj) renderEdit(proj);
      }
    } finally {
      clearInterval(editTimer); editBusy=false;
      if(current===proj) renderEdit(proj);
    }
    editStatus(fail ? (done+"장 만들었고 "+fail+"장 실패했어요. "+lastErr) : (done+"장 만들었어요."), !!fail);
  }

    if(files.length>room){ toast("사진당 "+EDIT.maxRefs+"장까지라 "+room+"장만 올려요"); files=files.slice(0,room); }
    var done=0, fail=0;
    for(var k=0;k<files.length;k++){
      toast((idx+1)+"번 사진 레퍼런스 올리는 중 "+(k+1)+"/"+files.length);
      try{
        var r=await shrink(files[k], "ref");
        var up=await storeUpload(newPath(proj.id, "ref", "jpg"), r.blob, "image/jpeg");
        sp.refs.push({id:up.id, w:r.w, h:r.h, size:up.sizeBytes});
        done++;
      }catch(e){
        fail++;
        if(/quota|exceed|413/i.test(String(e&&e.message))){ toast("저장 공간이 꽉 찼어요"); break; }
      }
    }
    await persist(proj);
    if(current===proj) renderEdit(proj);
    toast(fail ? (done+"장 올렸고 "+fail+"장 실패했어요") : (done+"장 올렸어요"));
  }

  async function dropRef(idx, j){
    var ph=(current.photos||[])[idx];
    if(!ph) return;
    var sp=specOf(current, ph.id), r=sp.refs[j];
    if(!r) return;
    sp.refs.splice(j,1);
    await persist(current);
    try{ await storeDelete(r.id); }catch(e){}
    renderEdit(current);
  }

       'id="file_'+kind+'" data-kind="'+kind+'">';

      h+='<div class="grid">';
      list.forEach(function(it,i){

           '<div class="ops">'+

           '<button data-mv="1" data-kind="'+kind+'" data-i="'+i+'">→</button>'+

    Array.prototype.forEach.call(view.querySelectorAll('[data-mute]'),function(b){

      });
    });
    Array.prototype.forEach.call(view.querySelectorAll('[data-vol]'),function(b){

    var cn=document.getElementById("copynar");
    if(cn) cn.addEventListener("click",async function(){
      // 자막은 끊어 읽히지만 음성은 이어 읽어야 자연스럽다.

    Array.prototype.forEach.call(view.querySelectorAll("[data-vdur]"),function(inp){

    if(mv) mv.addEventListener("click",async function(){
      mv.disabled=true; try{ await makeVideo(); } finally{
        var b=document.getElementById("mkvideo"); if(b) b.disabled=false; }
    });

    var refill=document.getElementById("refill");
    if(refill) refill.addEventListener("click",async function(){
      refill.disabled=true;
      try{ await autofill(await infoBlobs()); }
      finally{ var r2=document.getElementById("refill"); if(r2) r2.disabled=false; }
    });

    document.getElementById("del").addEventListener("click",async function(){
      if(!confirm("숙소를 통째로 삭제할까요? 올린 사진도 같이 지워져요.")) return;
      await removeProject(current); renderList(); toast("삭제했어요");
    });

    bar.innerHTML='<button class="ghost" id="back">목록</button>'+
                  '<button class="primary" id="zip">폴더 받기</button>';
    document.getElementById("back").addEventListener("click",async function(){
      clearTimeout(saveTimer);
      if((current.folder||"").trim()||(current.name||"").trim()){
        if(projects.indexOf(current)<0) projects.unshift(current);
        await persist(current);
      }
      renderList();
    });
    document.getElementById("zip").addEventListener("click",async function(){
      if(projects.indexOf(current)<0) projects.unshift(current);
      await persist(current);
      await exportZip();
    });
  }

  function updateGuide(){
    var f=((current.folder||"").trim())||"폴더명";
    document.getElementById("guide").textContent =
      "① 캡처 올리기 → 빈 칸이 자동으로 채워져요\n"+
      "② 정보 확인 (인원·제약 조건 꼭 채우기)\n"+
      "③ 대본 만들기 → 가격 어필 방식 고르고 읽어보기\n"+
      "④~⑦ 오토태그 → 목소리 → 음성 보정 → 컷 싱크\n"+
      "⑧ 사진 올리기\n"+
      "⑨ 사진 가공 · 영상화 (선택)\n"+
      "⑩ 컷마다 사진 고르기\n"+
      "⑪ 영상 만들기\n\n"+
      "PC 로 가져가려면:\n"+
      "1. '폴더 받기' 를 누르면 "+f+".zip 이 받아져요\n\n"+
      "2. reels-runner / input / photos 안에\n"+
      "   압축을 푸세요\n\n"+
      "3. 1_make_script.bat 더블클릭\n"+
      "4. review.md 읽고 확인\n"+
      "5. 2_make_video.bat 더블클릭";
  }

  // ---------- 폰트 ----------
  // 영상 출력에 사용할 기본 웹폰트. 원본 TTF는 공개 저장소에 재배포하지 않는다.
  // 계정에서 직접 업로드한 폰트가 있다면 그 파일을 우선 사용한다.
  var FONTS=[
    {k:"body", h:"본문(자막)용", face:"ReelBody", label:"온글잎 콘콘체",
     url:"https://cdn.jsdelivr.net/gh/projectnoonnu/2412-1@1.0/Ownglyph_corncorn-Rg.woff2"},
    {k:"cover", h:"썸네일 제목용", face:"ReelCover", label:"학교안심 어항꾸미기 B",
     url:"https://cdn.jsdelivr.net/gh/fonts-archive/HakgyoansimEohangkkumigiB/Hakgyoansim_EohangkkumigiB.woff2"}
  ];
  var fontsReady={}, fontSource={}, loadedFontFaces={};

  function fontPath(k){ return uid+"/_fonts/"+k+".ttf"; }

  async function registerFont(f, url, format){
    var descriptor='url("'+url+'")'+(format?' format("'+format+'")':"");
    var fx=new FontFace(f.face,descriptor);
    await fx.load();
    if(loadedFontFaces[f.k]) document.fonts.delete(loadedFontFaces[f.k]);
    document.fonts.add(fx);
    loadedFontFaces[f.k]=fx;
  }

  async function checkFonts(){
    fontsReady={}; fontSource={};
    await Promise.all(FONTS.map(async function(f){
      // 숙소 계정에서 이전에 올려 둔 개인 폰트가 있다면 기존 선택을 존중한다.
      if(uid){
        try{
          var path=fontPath(f.k);
          var r=await fetch(blobUrl(path),{method:"HEAD",cache:"no-store"});
          if(r.ok){
            // 업로드를 다시 했을 때 이전 캐시 글꼴이 유지되지 않게 한다.
            await registerFont(f,blobUrl(path)+"?v="+Date.now());
            fontsReady[f.k]=true; fontSource[f.k]="custom";
            return;
          }
        }catch(e){}
      }
      // 업로드 없이도 PC와 휴대폰에서 동일한 영상/썸네일 폰트를 쓴다.
      try{
        await registerFont(f,f.url,"woff2");
        fontsReady[f.k]=true; fontSource[f.k]="default";
      }catch(e){
        console.warn("기본 영상 폰트 불러오기 실패:",f.label,e&&e.message||e);
      }
    }));
  }

  function fontSection(){
    return '<h2>영상 폰트</h2><div class="card">'+
      '<p class="hint" style="margin:0 0 10px">썸네일과 컷 자막에 아래 글꼴이 자동 적용돼요. '+
      '직접 올린 폰트가 있으면 그 폰트를 우선 사용합니다.</p>'+
      FONTS.map(function(f){
        var ready=!!fontsReady[f.k], custom=fontSource[f.k]==="custom";
        var status=ready ? (custom?"사용자 폰트 적용 중":"기본 적용: "+f.label)
                         : "웹폰트 로딩 실패 · 시스템 글꼴로 대체";
        return '<div class="trk"><div class="trkhead"><b>'+esc(f.h)+'</b>'+
          '<span class="trkname">'+esc(status)+'</span></div>'+
          '<button type="button" class="pickbtn" data-font="'+f.k+'" style="padding:10px">'+
          '다른 폰트 직접 올리기</button>'+
          '<input class="sr" type="file" accept=".ttf,.otf,font/*" id="fnt_'+f.k+'" data-font="'+f.k+'">'+
          '</div>';
      }).join("")+
      '<p class="status" id="fntstat"></p></div>';
  }

  async function addFont(file, k){
    var st=function(m,bad){var e=document.getElementById("fntstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!uid){ st("로그인이 필요해요.",true); return; }
    if(file.size > 12*1024*1024){ st("폰트 파일이 너무 커요.",true); return; }
    st("올리는 중...");
    try{
      await storeUpload(fontPath(k), file, "font/ttf");
      await checkFonts();
      renderList();
      toast("폰트를 적용했어요");
    }catch(e){ st("올리지 못했어요: "+String((e&&e.message)||"").slice(0,80), true); }
  }

  // ---------- 로그인 ----------
  function renderLogin(msg, bad){
    bar.innerHTML="";
    document.getElementById("where").textContent="";
    view.innerHTML=
      '<div class="card" style="max-width:380px;margin:40px auto">'+
        '<h2 style="margin:0 0 4px">로그인</h2>'+
        '<p class="hint" style="margin:0 0 12px">이 기기에 로그인해두면 다음부터는 바로 열려요.</p>'+
        '<label for="lg_mail">이메일</label>'+
        '<input id="lg_mail" type="text" inputmode="email" autocomplete="username" placeholder="you@example.com">'+
        '<label for="lg_pw">비밀번호</label>'+
        '<input id="lg_pw" type="password" autocomplete="current-password" placeholder="6자 이상">'+
        '<button type="button" class="primary" id="lg_in" style="width:100%;margin-top:14px">로그인</button>'+
        '<button type="button" id="lg_up" style="width:100%;margin-top:8px">처음이에요 (가입)</button>'+
        '<p class="status'+(bad?" bad":"")+'" id="lg_st">'+esc(msg||"")+'</p>'+
      '</div>';
    var st=function(m,isBad){
      var e=document.getElementById("lg_st");
      if(e){ e.textContent=m; e.className="status"+(isBad?" bad":""); }
    };
    var go=async function(kind){
      var mail=(document.getElementById("lg_mail").value||"").trim();
      var pw=document.getElementById("lg_pw").value||"";
      if(!mail || !pw){ st("이메일과 비밀번호를 적어주세요.",true); return; }
      st(kind==="up" ? "가입하는 중..." : "로그인하는 중...");
      try{
        var j = kind==="up" ? await signUp(mail,pw) : await signIn(mail,pw);
        if(!j.access_token){
          st("메일로 보낸 확인 링크를 누른 뒤 다시 로그인해주세요.");
          return;
        }
        await start();
      }catch(e){
        st((e&&e.message)||"실패했어요.",true);
      }
    };
    document.getElementById("lg_in").addEventListener("click",function(){ go("in") });
    document.getElementById("lg_up").addEventListener("click",function(){ go("up") });
    document.getElementById("lg_pw").addEventListener("keydown",function(ev){
      if(ev.key==="Enter") go("in");
    });
  }

  // ---------- 시작 ----------
  async function start(){
    if(!session || !session.access_token){ renderLogin(); return; }
    view.innerHTML='<div class="empty">불러오는 중...</div>';
    await loadAll();
    if(!uid){ renderLogin("로그인이 풀렸어요. 다시 로그인해주세요.", true); return; }
    usage=await storeUsage();
    await checkFonts();
    capNote="";
    renderList();
    document.getElementById("where").textContent="계정 저장";
  }

  (async function init(){
    saveSession(readSession());
    if(session && session.access_token){
      // 저장된 토큰이 살아 있는지 한 번 확인한다.
      var r=await fetch(SUPA.url+"/auth/v1/user",{headers:authHeaders()});
      if(!r.ok && !(await refresh())) saveSession(null);
    }
    await start();
    // 토큰은 한 시간쯤 산다. 미리 갱신해 작업 중에 끊기지 않게 한다.
    setInterval(function(){ if(session) refresh(); }, 45*60*1000);
  })();
})();
</script>
