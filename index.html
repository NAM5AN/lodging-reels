<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숙소 릴스 러너</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="./reels-media.js"></script>
<style>
  /* 폰트는 Storage 에 한 번만 올려두고 쓴다. 규칙은 실행 중에 붙인다. */
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f6f5f2; --card:#fff; --ink:#1c1b19; --mute:#6f6b64;
    --line:#e2dfd9; --accent:#8a5a2b; --accent-ink:#fff;
    --warn:#a4442c; --ok:#2e6b4f; --field:#fbfaf8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17161a; --card:#201f24; --ink:#eceae6; --mute:#9d978e;
      --line:#34323a; --accent:#c89262; --accent-ink:#1c1b19;
      --warn:#e08a72; --ok:#7fc0a0; --field:#1a191e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17161a; --card:#201f24; --ink:#eceae6; --mute:#9d978e;
    --line:#34323a; --accent:#c89262; --accent-ink:#1c1b19;
    --warn:#e08a72; --ok:#7fc0a0; --field:#1a191e;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{-webkit-text-size-adjust:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:16px; line-height:1.55}
  .wrap{max-width:680px; margin:0 auto; padding:16px 14px 124px}
  header{display:flex; align-items:baseline; gap:10px; margin:6px 0 18px}
  h1{font-size:19px; margin:0; letter-spacing:-.02em}
  h2{font-size:15px; margin:24px 0 10px; letter-spacing:-.01em}
  .sub{font-size:12.5px; color:var(--mute)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
  .proj{cursor:pointer}
  .proj h3{margin:0 0 3px; font-size:16px}
  .proj p{margin:0; font-size:13px; color:var(--mute)}
  label{display:block; margin:16px 0 6px; font-size:13.5px; font-weight:600}
  label span{font-weight:400; color:var(--mute); font-size:12.5px}
  input[type=text],textarea,select{width:100%; padding:11px 12px; font:inherit; font-size:15.5px;
    color:var(--ink); background:var(--field); border:1px solid var(--line);
    border-radius:10px; outline:none}
  input[type=text]:focus,textarea:focus,select:focus{border-color:var(--accent)}
  textarea{min-height:92px; resize:vertical}
  .hint{font-size:12.5px; color:var(--mute); margin:5px 0 0}
  button{font:inherit; font-size:15px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); border-radius:10px; padding:11px 14px;
    background:var(--card); color:var(--ink)}
  button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  button.ghost{background:transparent}
  button.danger{color:var(--warn)}
  button:disabled{opacity:.45; cursor:default}
  .bar{position:fixed; left:0; right:0; bottom:0; background:var(--card);
    border-top:1px solid var(--line); z-index:5;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
  .bar .inner{max-width:680px; margin:0 auto; display:flex; gap:8px}
  .bar button{flex:1}
  .note{font-size:13px; color:var(--mute); background:var(--field);
    border:1px solid var(--line); border-radius:10px; padding:11px 12px}
  .note b{color:var(--ink)}
  pre{margin:0; padding:12px; background:var(--field); border:1px solid var(--line);
    border-radius:10px; font-size:12.5px; line-height:1.5; overflow-x:auto;
    white-space:pre; font-family:ui-monospace,Menlo,monospace}
  .toast{position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(86px + env(safe-area-inset-bottom,0px)); background:var(--ink);
    color:var(--bg); padding:10px 16px; border-radius:999px; font-size:14px;
    z-index:9; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%}
  .toast.on{opacity:1}
  .empty{text-align:center; color:var(--mute); padding:36px 10px; font-size:14px}
  .status{font-size:12.5px; color:var(--mute); margin-top:10px}
  .status.bad{color:var(--warn)}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:10px}
  .thumb{position:relative; border:1px solid var(--line); border-radius:10px;
    overflow:hidden; background:var(--field); aspect-ratio:3/4}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .thumb .n{position:absolute; left:4px; top:4px; background:rgba(0,0,0,.72);
    color:#fff; font-size:11px; font-weight:700; padding:2px 6px; border-radius:6px}
  .thumb .ops{position:absolute; left:0; right:0; bottom:0; display:flex;
    background:rgba(0,0,0,.62)}
  .thumb .ops button{flex:1; padding:6px 0; font-size:13px; border:0;
    border-radius:0; background:transparent; color:#fff; font-weight:700}
  .pickbtn{width:100%; border:1.5px dashed var(--line); border-radius:12px;
    padding:16px 12px; background:var(--field); color:var(--ink);
    font-size:15px; font-weight:600}
  .pickbtn:active{border-color:var(--accent)}
  .sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%);
    white-space:nowrap; border:0}
  .meter{height:5px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:8px}
  .meter i{display:block; height:100%; background:var(--accent)}
  .busy{pointer-events:none; opacity:.6}
  .trk{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px;
    background:var(--field)}
  .trkhead{display:flex; align-items:baseline; gap:8px; margin-bottom:8px}
  .trkhead b{font-size:14.5px}
  .trkname{font-size:12.5px; color:var(--mute); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .trkline{display:flex; align-items:center; gap:8px; margin:8px 0 0;
    font-size:13.5px; font-weight:400}
  .trkline input[type=range]{flex:1; min-width:0}
  .trkline input[type=checkbox]{width:18px; height:18px; margin:0}
  .trkval{flex:0 0 32px; text-align:right; color:var(--mute);
    font-size:12.5px; font-variant-numeric:tabular-nums}
  .tts-setting-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .tts-setting-label output{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
  .tts-range{width:100%;margin:2px 0 0;accent-color:var(--accent)}
  .tts-range-hint{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--mute)}
  .tts-muted{opacity:.45}
  .cut{display:flex; align-items:center; gap:10px; padding:6px 0;
    border-bottom:1px solid var(--line)}
  .cut:last-of-type{border-bottom:0}
  .cut.cover{background:var(--field); border-radius:10px; padding:6px 8px; margin-bottom:6px}
  .cut .cn{flex:0 0 32px; font-size:11.5px; font-weight:700; color:var(--mute);
    font-variant-numeric:tabular-nums}
  .cut .ct{flex:1; font-size:14.5px; line-height:1.35; min-width:0; word-break:keep-all}
  .cpick{flex:0 0 46px; width:46px; height:62px; padding:0; overflow:hidden;
    position:relative; border-radius:8px; border:1px solid var(--line); background:var(--field)}
  .cpick img{width:100%; height:100%; object-fit:cover; display:block}
  .cpick i{position:absolute; left:2px; top:2px; font-style:normal; font-size:10px;
    font-weight:700; color:#fff; background:rgba(0,0,0,.7); border-radius:4px; padding:0 4px}
  .erow{display:flex; flex-wrap:wrap; gap:10px; padding:10px 0; border-bottom:1px solid var(--line)}
  .erow:last-child{border-bottom:0}
  .epair{display:flex; align-items:center; gap:6px; flex:0 0 auto}
  .eimg{position:relative; width:72px; aspect-ratio:9/16; border-radius:8px; overflow:hidden;
    border:1px solid var(--line); background:var(--field); display:flex; align-items:center; justify-content:center}
  .eimg img{width:100%; height:100%; object-fit:contain; display:block}
  .eimg.empty span{font-size:11px; color:var(--mute); text-align:center; padding:0 4px; word-break:keep-all}
  .eimg i{position:absolute; left:2px; top:2px; font-style:normal; font-size:10px;
    font-weight:700; color:#fff; background:rgba(0,0,0,.7); border-radius:4px; padding:0 4px}
  .earrow{color:var(--mute); font-size:14px}
  /* ⑨ 영상화: 원본 → 가공 → 영상 세 칸 */
  .eimg video{width:100%; height:100%; object-fit:contain; display:block; background:#000; cursor:pointer}
  .eimg .vopen{position:absolute; right:2px; bottom:2px; font-size:10px; font-weight:700; color:#fff;
    background:rgba(0,0,0,.72); border-radius:4px; padding:1px 4px; text-decoration:none}
  .eimg.wait{border-style:dashed}
  .eimg.wait span{font-size:11px; color:var(--accent); text-align:center; padding:0 4px; word-break:keep-all;
    font-variant-numeric:tabular-nums}
  .elab{display:block; font-size:12px; font-weight:700; color:var(--mute); margin:0 0 4px}
  .eclip{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line)}
  .vdur{display:flex; align-items:center; gap:8px; margin-top:6px}
  .vdur label{display:inline; margin:0; font-size:13px; font-weight:600}
  .vdur input{width:72px; flex:0 0 72px; padding:9px 8px; font:inherit; font-size:15.5px; color:var(--ink);
    background:var(--field); border:1px solid var(--line); border-radius:10px; outline:none;
    text-align:center; font-variant-numeric:tabular-nums}
  .vdur input:focus{border-color:var(--accent)}
  .vdur input.bad{border-color:var(--warn); color:var(--warn)}
  .vdur span{font-size:12.5px; color:var(--mute)}
  /* ⑨ 요소 (Kling Element) */
  .elems{margin:14px 0 4px; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--field)}
  .elems>.elab{margin:0 0 2px}
  .elem{padding:10px 0; border-bottom:1px solid var(--line)}
  .elem:last-of-type{border-bottom:0}
  .elem-ph{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .elem-ph .eref i{position:absolute; left:0; bottom:0; right:0; font-style:normal; font-size:9.5px; font-weight:700;
    color:#fff; background:rgba(0,0,0,.6); text-align:center}
  .elem-f{display:flex; gap:6px; margin-top:6px}
  .elem-f input{flex:1 1 0; min-width:0; padding:9px 10px; font:inherit; font-size:15px; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:10px; outline:none}
  .elem-f input.nm{flex:0 0 34%}
  .elem-f input:focus{border-color:var(--accent)}
  .elem-f input.bad{border-color:var(--warn)}
  .elem-k{display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap}
  .elem-k .st{flex:1 1 140px; font-size:12.5px; color:var(--mute)}
  .elem-k .st.ok{color:var(--accent); font-weight:600}
  .elem-k .st.bad{color:var(--warn)}
  .elem-k button{padding:8px 12px; font-size:13.5px}
  .elink{border-style:dashed}
  .elink b{position:absolute; left:0; right:0; bottom:0; font-size:9.5px; font-weight:700; color:#fff;
    background:rgba(0,0,0,.62); text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ecount{font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums}
  .elinks:empty,.mwarn:empty{display:none}
  .ecount.bad{color:var(--warn); font-weight:700}
  .mwarn{color:var(--warn)}
  .mbox{margin-top:4px; border:1px solid var(--line); border-radius:10px; background:var(--card);
    box-shadow:0 6px 18px rgba(0,0,0,.12); max-height:240px; overflow-y:auto}
  .mbox button{display:flex; align-items:center; gap:10px; width:100%; padding:7px 10px; border:0; border-radius:0;
    background:transparent; text-align:left; font-size:14.5px; font-weight:600}
  .mbox button+button{border-top:1px solid var(--line)}
  .mbox button.on{background:var(--field)}
  .mbox img,.mbox .noimg{width:34px; height:34px; flex:0 0 34px; border-radius:6px; object-fit:cover; background:var(--field)}
  .mbox small{font-weight:400; color:var(--mute); font-size:12px; margin-left:auto}
  .eside{flex:1 1 180px; min-width:0}
  .ebtns{display:flex; gap:6px; margin-top:6px}
  .eside textarea{min-height:64px; font-size:14.5px}
  .erefs{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center}
  .eref{position:relative; width:44px; height:44px; border-radius:6px; overflow:hidden;
    border:1px solid var(--line); background:var(--field)}
  .eref img{width:100%; height:100%; object-fit:cover; display:block}
  .eref button{position:absolute; right:0; top:0; width:18px; height:18px; padding:0; border:0;
    border-radius:0 0 0 6px; background:rgba(0,0,0,.72); color:#fff; font-size:12px; line-height:18px}
  .eadd{height:44px; padding:0 10px; font-size:12.5px; font-weight:600; border:1.5px dashed var(--line);
    border-radius:6px; background:transparent}
  .ebtns button{flex:1}
  label.chk{display:flex; align-items:center; gap:8px; font-weight:500}
  label.chk input{width:auto; margin:0}
  .cstrip{display:flex; gap:6px; overflow-x:auto; padding:8px 0;
    border-bottom:1px solid var(--line); -webkit-overflow-scrolling:touch}
  .cstrip button{flex:0 0 58px; width:58px; height:78px; padding:0; position:relative;
    overflow:hidden; border-radius:8px; border:1px solid var(--line)}
  .cstrip img{width:100%; height:100%; object-fit:cover; display:block}
  .cstrip i{position:absolute; left:2px; top:2px; font-style:normal; font-size:10px;
    font-weight:700; color:#fff; background:rgba(0,0,0,.7); border-radius:4px; padding:0 4px}
  .tbox{margin-top:12px}
  .tprev{position:relative; max-width:260px; margin:0 auto;
    border:1px solid var(--line); border-radius:12px; overflow:hidden; background:#000}
  .tprev img,.tprev canvas{width:100%; height:auto; display:block}
  .thumb-scrub{width:100%; margin:10px 0 4px; accent-color:var(--accent)}
  .thumb-caption{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12px; color:var(--mute)}
  .thumb-caption output{font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink)}
  /* 인스타 그리드는 가운데 1:1 만 보여준다. 그 범위를 표시해준다. */
  .tprev .sq{position:absolute; left:0; right:0; top:21.875%; height:56.25%;
    border:2px dashed rgba(255,255,255,.75); pointer-events:none}
  .tprev .sq b{position:absolute; right:4px; bottom:2px; font-size:10px;
    font-weight:700; color:#fff; text-shadow:0 1px 3px #000}

  /* 확대보기: 데스크톱 휠, 모바일 두 손가락 확대, 확대 후 드래그 이동 */
  .previewable{cursor:zoom-in;touch-action:manipulation}
  .previewable:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
  .cut-look{flex:0 0 38px;width:38px;height:44px;padding:0;border:0;background:transparent;
    font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
  .cstrip-item{position:relative;flex:0 0 58px;width:58px;height:78px}
  .cstrip .cstrip-item>button[data-pi]{width:100%;height:100%}
  .cstrip .cstrip-look{position:absolute;right:0;bottom:0;z-index:1;flex:none;width:30px;height:30px;
    padding:0;border:0;border-radius:7px 0 7px 0;background:rgba(0,0,0,.72);color:#fff;font-size:16px}
  .photo-lightbox[hidden]{display:none}
  .photo-lightbox{position:fixed;inset:0;z-index:1000;background:rgba(9,9,12,.96);overscroll-behavior:contain}
  .photo-lightbox .lb-stage{position:absolute;left:10px;right:10px;
    top:calc(60px + env(safe-area-inset-top,0px));
    bottom:calc(62px + env(safe-area-inset-bottom,0px));
    overflow:hidden;touch-action:none;cursor:grab}
  .photo-lightbox .lb-stage.dragging{cursor:grabbing}
  .photo-lightbox .lb-photo{position:absolute;left:50%;top:50%;width:0;height:0;
    max-width:none;max-height:none;object-fit:contain;touch-action:none;
    user-select:none;-webkit-user-select:none;-webkit-user-drag:none;cursor:inherit}
  .photo-lightbox .lb-close{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));
    top:calc(8px + env(safe-area-inset-top,0px));z-index:1;
    width:46px;height:46px;padding:0;color:#fff;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.28);border-radius:50%;font-size:30px;line-height:1}
  .photo-lightbox .lb-help{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));
    left:12px;right:12px;text-align:center;color:#ddd;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>숙소 릴스 러너</h1><span class="sub" id="where"></span></header>
  <div id="view"></div>
</div>
<div class="bar"><div class="inner" id="bar"></div></div>
<div class="toast" id="toast"></div>
<div id="photoLightbox" class="photo-lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
  <div class="lb-stage" id="lbStage">
    <img class="lb-photo" id="lbPhoto" alt="확대한 사진" draggable="false">
  </div>
  <button type="button" id="lbClose" class="lb-close" aria-label="사진 닫기">×</button>
  <div class="lb-help">드래그로 이동 · 휠 또는 두 손가락으로 확대/축소 · 바깥쪽 터치로 닫기</div>
</div>

<script>
(function(){
  "use strict";

  var FIELDS = [
    {k:"folder", label:"폴더 이름", type:"text",
     hint:"PC에서 만들어질 폴더 이름이에요. 띄어쓰기 없이 짧게.", ph:"oceanview-pension"},
    {k:"name", h:"숙소명", type:"text", ph:"감성숙소 애빛"},
    {k:"area", h:"지역", type:"text", ph:"제주 제주시 구좌읍"},
    {k:"access", h:"출발지 기준 접근성", type:"text",
     hint:"영상에 그대로 나가요. 거리보다 시간이 잘 먹혀요.",
     ph:"제주공항에서 차로 40분 / 바다까지 도보 2분"},
    {k:"type", h:"숙소 유형", type:"text", ph:"독채 펜션"},
    {k:"people", h:"수용 인원", type:"text",
     hint:"가격이 몇 명 값인지예요. 비워 두면 금액 줄을 못 믿게 돼요.",
     ph:"2인 기준 (최대 6인)"},
    {k:"price", h:"가격대", type:"text", ph:"비수기 평일 18만원대 / 성수기 주말 32만원대"},
    {k:"perks", h:"확인된 혜택", type:"textarea",
     hint:"한 줄에 하나씩. 확실한 것만. 여기 없는 건 영상에서 말 안 해요.",
     ph:"반려견 동반 가능 (중형견까지)\n야외 자쿠지 (사계절 온수)"},
    {k:"links", h:"참고 링크", type:"textarea",
     hint:"예약 페이지, 공식 사이트, 인스타. 한 줄에 하나씩.",
     ph:"https://booking.naver.com/..."},
    {k:"keyword", h:"댓글 키워드", type:"text",
     hint:"릴스마다 다르게. 지역명 2~4글자가 제일 좋아요.", ph:"구좌"},
    {k:"hide", h:"영상에 넣으면 안 되는 것", type:"textarea",
     ph:"정확한 주소\n숙소 공식 계정 아이디"},

  function previewConstrain(){
    var maxX=Math.max(0,(previewState.baseW*previewState.scale-previewStage.clientWidth)/2);
    var maxY=Math.max(0,(previewState.baseH*previewState.scale-previewStage.clientHeight)/2);
    previewState.x=Math.max(-maxX,Math.min(maxX,previewState.x));
    previewState.y=Math.max(-maxY,Math.min(maxY,previewState.y));

    var factor=Math.min(previewStage.clientWidth/previewPhoto.naturalWidth,
      previewStage.clientHeight/previewPhoto.naturalHeight);
    previewState.baseW=previewPhoto.naturalWidth*factor;
    previewState.baseH=previewPhoto.naturalHeight*factor;
    previewPhoto.style.width=previewState.baseW+"px";
    previewPhoto.style.height=previewState.baseH+"px";
    if(reset){ previewState.scale=1;previewState.x=0;previewState.y=0; }
    previewConstrain();

  function previewZoomAt(target, clientX, clientY){

    var box=previewStage.getBoundingClientRect();
    var px=clientX-box.left-box.width/2, py=clientY-box.top-box.height/2;
    var ratio=next/old;
    previewState.x=px-(px-previewState.x)*ratio;
    previewState.y=py-(py-previewState.y)*ratio;
    previewState.scale=next;
    previewConstrain();
    previewDraw();

    previewPointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    var after=Array.from(previewPointers.values());
    if(Math.hypot(ev.clientX-prev.x,ev.clientY-prev.y)>1)previewState.dragged=true;
    if(before.length>=2){
      var oldDist=Math.hypot(before[0].x-before[1].x,before[0].y-before[1].y);
      var newDist=Math.hypot(after[0].x-after[1].x,after[0].y-after[1].y);
      var oldX=(before[0].x+before[1].x)/2,oldY=(before[0].y+before[1].y)/2;

  // ---------- 이미지 ----------
  function shrink(file, kind){
    var lim=LIMITS[kind];
    return new Promise(function(res,rej){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var w=img.naturalWidth, h=img.naturalHeight;
          var s=Math.min(1, lim.edge/Math.max(w,h));
          var cw=Math.round(w*s), ch=Math.round(h*s);
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          c.getContext("2d").drawImage(img,0,0,cw,ch);
          c.toBlob(function(b){ b?res({blob:b,w:cw,h:ch}):rej(new Error("변환 실패")); },
                   "image/jpeg", lim.q);
        };
        img.onerror=function(){rej(new Error("이미지를 못 읽었어요"))};
        img.src=fr.result;
      };
      fr.onerror=function(){rej(new Error("파일을 못 읽었어요"))};
      fr.readAsDataURL(file);
    });
  }

  async function dropImage(kind, idx){
    var key = keyOf(kind);
    var it = current[key][idx];
    current[key].splice(idx,1);
    var ed = (kind==="photo" && it && current.edits) ? current.edits[it.id] : null;
    var sp = (kind==="photo" && it && current.editSpecs) ? current.editSpecs[it.id] : null;
    var cl = (kind==="photo" && it && current.clips) ? current.clips[it.id] : null;
    if(kind==="photo" && it){
      if(current.edits) delete current.edits[it.id];
      if(current.editSpecs) delete current.editSpecs[it.id];
      if(current.editNotes) delete current.editNotes[it.id];
      if(current.clips) delete current.clips[it.id];

      if(current.clipJobs) delete current.clipJobs[it.id];
    }
    await persist(current);
    if(it){ try{ await storeDelete(it.id); }catch(e){} }

  var ocrWorker=null;

  async function getOcr(onProgress){
    if(ocrWorker) return ocrWorker;
    if(typeof Tesseract==="undefined") throw new Error("ocr_script");
    ocrWorker = await Tesseract.createWorker("kor+eng", 1, {
      logger:function(m){
        if(m && m.status && onProgress) onProgress(m.status, m.progress||0);
      }
    });
    return ocrWorker;
  }

  // 캡처는 세로로 길어서 통째로 넣으면 글자가 뭉개진다. 잘라서 읽는다.
  function sliceFor(blob){
    return new Promise(function(res){
      var img=new Image(), url=URL.createObjectURL(blob);
      img.onload=function(){
        var w=img.naturalWidth, h=img.naturalHeight, out=[];
        var band=Math.round(w*1.3), step=Math.round(band*0.94);
        var n = h<=band ? 1 : Math.min(8, Math.ceil((h-band)/step)+1);
        for(var i=0;i<n;i++){
          var y = n===1 ? 0 : Math.min(i*step, h-band);
          var c=document.createElement("canvas");
          var ch=Math.min(band,h);
          // 글자를 키워서 인식률을 올린다
          var scale = Math.min(2, 1600/w);
          c.width=Math.round(w*scale); c.height=Math.round(ch*scale);
          var g=c.getContext("2d");
          g.drawImage(img, 0, y, w, ch, 0, 0, c.width, c.height);
          out.push(c);
        }
        URL.revokeObjectURL(url); res(out);
      };
      img.onerror=function(){ URL.revokeObjectURL(url); res([]); };
      img.src=url;
    });
  }

  async function ocrAll(blobs){
    var w = await getOcr(function(st,pr){
      if(st==="loading language traineddata" || st==="loading tesseract core")
        setStat("글자 인식 준비 중이에요... "+Math.round(pr*100)+"%");
    });
    var texts=[];
    for(var i=0;i<blobs.length;i++){
      var parts = await sliceFor(blobs[i]);
      for(var j=0;j<parts.length;j++){
        setStat("캡처 "+(i+1)+"/"+blobs.length+" 읽는 중 ("+(j+1)+"/"+parts.length+")...");
        try{
          var r = await w.recognize(parts[j]);
          if(r && r.data && r.data.text) texts.push(r.data.text.trim());
        }catch(e){}
      }
    }
    return texts.join("\n").replace(/\n{3,}/g,"\n\n").slice(0, 20000);
  }

  function applyFields(got){
    if(!got || typeof got!=="object"){
      setStat("읽은 내용을 해석하지 못했어요. 직접 입력해주세요.", true);
      return false;
    }
    var filled=[], skipped=0;
    AUTO.forEach(function(f){
      var v=got[f.k];
      if(v==null || String(v).trim()==="") return;
      if((current[f.k]||"").trim()){ skipped++; return; }
      current[f.k]=String(v).trim(); filled.push(f.k);
    });
    if(!filled.length){
      setStat(skipped ? "이미 적어두신 칸이라 건드리지 않았어요."
                      : "캡처에서 쓸 정보를 못 찾았어요. 글씨가 작으면 확대해서 다시 찍어주세요.", true);
      return false;
    }
    persist(current).then(function(){
      renderEdit(current);
      setStat(filled.length+"개 칸을 채웠어요. 가격과 인원은 꼭 확인해주세요.");
    });
    return true;
  }

  async function autofill(blobs){
    if(!uid){ setStat("로그인이 필요해요.", true); return; }
    if(!blobs || !blobs.length){ setStat("읽을 캡처가 없어요.", true); return; }

    // AI 정리 단계만 실패했을 때 12장을 다시 OCR하지 않도록,
    // 현재 캡처 목록이 그대로면 직전 OCR 결과를 재사용한다.
    var cacheKey=(current && current.infos ? current.infos : [])
      .map(function(x){return x.id}).join("|");
    var text="";
    var cache=current && current._ocrCache;
    if(cache && cache.key===cacheKey && cache.text){
      text=cache.text;
      setStat("이미 읽은 글자로 다시 정리하는 중이에요...");
    }else{
      setStat("캡처에서 글자를 읽는 중이에요...");
      try{
        text = await ocrAll(blobs);
      }catch(e){
        setStat(e && e.message==="ocr_script"
          ? "글자 인식 도구를 못 불러왔어요. 새로고침 후 다시 시도해주세요."
          : "글자를 읽어내지 못했어요"+(e&&e.message?" ("+String(e.message).slice(0,60)+")":"")+".", true);
        return;
      }

      if(!text || text.replace(/\s/g,"").length<30){
        setStat("캡처에서 글자를 거의 못 찾았어요. 화면을 확대해서 다시 캡처해주세요.", true);
        return;
      }

      if(current){
        current._ocrCache={key:cacheKey, text:text};
        await persist(current);
      }
      setStat("읽은 글자를 정리하는 중이에요...");
    }

    try{
      applyFields(await askJSON(fillPrompt("\n\n--- 읽어낸 내용 ---\n"+text), 2));
    }catch(e2){
      var c2=(e2&&e2.code)||"";
      setStat(c2==="unauthorized" ? "로그인이 풀렸어요. 새로고침해주세요."
            : c2==="rate_limited" ? "요청이 많아요. 잠시 뒤 다시 눌러주세요."
            : c2==="bad_model" ? "AI 모델 설정 오류가 있었어요. 다시 시도해주세요."
            : "정리에 실패했어요"+(c2?" ("+c2+")":"")+".", true);
    }
  }

  var VIDEO = {w:1080, h:1920, fps:30, cut:0.9, coverHold:0.5, subY:496};

  // 레퍼런스 상위 전환군(댓글/팔로워 2.5~11%)은 컷 18~35개, 컷당 0.73~0.95초였다.
  // 대본을 먼저 쓰므로 사진 수가 아니라 원하는 컷 수로 분량을 정한다.
  function targetLines(){
    var v=parseInt(current.lines,10);
    return (v>=10 && v<=30) ? v : 20;
  }
  function scriptLines(){
    return (current.script||"").split("\n")
      .map(function(x){return x.trim()}).filter(function(x){return x});
  }
  function cutCount(){ return scriptLines().length || targetLines(); }

  // 컷마다 어떤 사진을 쓸지. 비어 있으면 고르게 나눠 붙인다.
  function ensureMap(){
    var C=scriptLines().length, n=(current.photos||[]).length;
    var m=(current.map||[]).slice();
    for(var i=0;i<C;i++){
      if(typeof m[i]!=="number" || m[i]<0 || m[i]>=n){
        m[i] = n ? Math.min(n-1, Math.floor(i*n/C)) : 0;
      }
    }
    m.length=C;
    current.map=m;
    return m;
  }

  // ---------- ③ 대본 ----------
  // 경고는 대본만 보고 나오는 게 아니라 ② 입력값(제약 조건·인원·지역)에도 걸린다.
  // 그래서 생성 직후 한 번만 찍으면 안 되고, 화면을 다시 그릴 때마다 다시 계산해야 한다.
  function scStat(){
    var lines=scriptLines();
    if(!lines.length) return {text:"", bad:false};
    var w=sideWarnings(lines).concat(sceneWarnings(lines)).concat(scriptWarnings(lines));
    var len=(lines.length*VIDEO.cut+VIDEO.coverHold).toFixed(1);
    return {
      bad: !!w.length,
      text: "자막 "+lines.length+"줄 · 약 "+len+"초."+
            (w.length ? "  손봐야 할 곳: "+w.join(" / ")
                      : "  규칙 검사 통과.")
    };
  }

       '<button type="button" class="cut-look" data-preview-url="'+esc(blobUrl(srcId(ph[ci])))+'" aria-label="커버 사진 크게 보기">🔍</button>'+
       '<button type="button" class="cpick" data-cut="-1">'+
       '<img src="'+blobUrl(srcId(ph[ci]))+'" alt=""><i>'+(ci+1)+'</i></button></div>';
    cuts.forEach(function(t,i){
      var pi=Math.min(ph.length-1, m[i]||0);
      var useClip=!!renderClipForPhoto(current,ph[pi]);
      h+='<div class="cut"><span class="cn">'+String(i+1).padStart(2,"0")+'</span>'+
         '<span class="ct">'+esc(t)+'<span class="hint" style="display:block">'+
         (current.cutTimeline[i].start).toFixed(2)+'–'+(current.cutTimeline[i].end).toFixed(2)+'초 · '+(useClip?'🎬 영상':'사진')+'</span></span>'+
         '<button type="button" class="cut-look" data-preview-url="'+esc(blobUrl(srcId(ph[pi])))+'" aria-label="'+(i+1)+'번 컷 사진 크게 보기">🔍</button>'+

  // ---------- ⑥ 소리 ----------
  var TRACKS=[{k:"tts", h:"나레이션", hint:"오토태그 후 앱에서 바로 만들거나, 직접 만든 mp3 를 올릴 수 있어요."},
              {k:"bgm", h:"배경음악", hint:"영상 길이에 맞춰 반복 재생돼요."}];

  function ttsSourceText(){
    return scriptLines().join("\n").trim();
  }
  function stripAudioTags(s){
    return String(s||"").replace(/\[[^\[\]\r\n]{1,200}\]/g,"");
  }
  function canonicalTtsSpeech(s){
    return stripAudioTags(s)
      .normalize("NFKC")
      .toLocaleLowerCase("ko-KR")
      .replace(/[^\p{L}\p{N}]+/gu,"");
  }
  // Eleven v4 accepts creative English voice directions, including comma-combined
  // instructions such as [whispering, playful]. Korean/malformed tags must not be sent to TTS.
  function ttsTagLanguageError(value){
    var text=String(value||"");
    var tags=text.match(/\[[^\[\]\r\n]{1,200}\]/g)||[];
    var malformed=/[\[\]]/.test(text.replace(/\[[^\[\]\r\n]{1,200}\]/g,""));
    var invalid=tags.some(function(tag){
      return !/^\[[A-Za-z][A-Za-z0-9 ,'-]{0,119}\]$/.test(tag);
    });
    return malformed||invalid
      ? "Audio Tag는 [surprised] 또는 [whispering, playful]처럼 영어로 써야 해요. ④ 태그 다시 만들기로 자동 교정해주세요."
      : "";
  }

  function tagsMatchScript(){
    var source=ttsSourceText();
    var tagged=String(current.ttsTagged||"").trim();
    if(!source || !tagged) return false;
    if(current.ttsTagSource!==source || ttsTagLanguageError(tagged)) return false;
    return canonicalTtsSpeech(tagged)===canonicalTtsSpeech(source);
  }
  function invalidateTtsTags(){
    current.ttsTagged="";
    current.ttsTagSource="";
  }

  function ttsTagSection(){
    var source=ttsSourceText();
    var tagged=String(current.ttsTagged||"");
    var fresh=tagsMatchScript();
    var languageIssue=ttsTagLanguageError(tagged);
    var label=tagged ? "태그 다시 만들기" : "AI 오토태그 넣기";
    return '<div class="trk">'+
      '<div class="trkhead"><b>TTS 표현 태그</b>'+
      '<span class="trkname">Claude Opus 5.5 · ElevenLabs 방식 참고</span></div>'+
      '<p class="hint" style="margin-top:0">원본 자막 전체를 한 편의 나레이션으로 읽고 쉼표·마침표·물음표·느낌표·말줄임표를 호흡과 의미에 맞춰 자동으로 정리해요. [surprised]·[whispering, playful] 등 감정 태그는 영어로만 넣으며, 원래 단어·숫자는 바꾸지 않아요. gentle 계열 발화 태그는 오토태그 생성 프롬프트에서 금지했어요.</p>'+
      '<button type="button" class="primary" id="mktags" style="width:100%;margin-top:8px">'+label+'</button>'+
      '<label for="f_ttsTagged" style="margin-top:12px">태그 적용 대본 <span>직접 태그 수정 가능</span></label>'+
      '<textarea id="f_ttsTagged" style="min-height:150px" placeholder="먼저 AI 오토태그를 넣어주세요">'+esc(tagged)+'</textarea>'+
      '<div style="display:flex;gap:8px;margin-top:8px">'+
        '<button type="button" class="ghost" id="cleartags" style="flex:1">태그 지우기</button>'+
      '</div>'+
      '<p class="status'+(tagged&&!fresh?' bad':'')+'" id="tagstat">'+
        (tagged ? (languageIssue || (fresh ? "영어 Audio Tag · 원문 단어·숫자 보존 확인됨. ⑤ TTS 생성 준비됐어요." : "단어나 숫자가 바뀌었거나 대본이 수정됐어요. 태그를 다시 만들어주세요.")) : "")+
      '</p>'+
    '</div>';
  }

  // ④ 원본 단어·숫자를 유지한 채 ElevenLabs 방식 Audio Tag를 붙인다.
  // 대본 생성 AI와 별도로, 기존 lodging-reels-tts의 action=tag를 호출한다.
  async function makeTtsTags(){
    var st=function(message,bad){
      var el=document.getElementById("tagstat");
      if(el){
        el.textContent=message;
        el.className="status"+(bad?" bad":"");
      }
    };
    if(!uid){ st("로그인이 필요해요. 다시 로그인해주세요.",true); return; }
    if(!current){ st("숙소 프로젝트를 먼저 선택해주세요.",true); return; }
    var source=ttsSourceText();
    if(!source){ st("③ 대본을 먼저 만들어주세요.",true); return; }
    if(source.length>5000){ st("대본이 5,000자를 넘어 오토태그할 수 없어요.",true); return; }
    var projectId=current.id;
    st("대본 전체 흐름을 분석해 Audio Tag를 넣는 중이에요...");
    try{
      var response=await api(FN.tts,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({action:"tag",text:source})
      });
      var result;
      try{ result=await response.json(); }
      catch(e){ st("오토태그 응답을 읽지 못했어요. 다시 시도해주세요.",true); return; }
      if(!response.ok){
        var code=String(result&&result.error||"");
        var message=code==="no_tag_key" ? "Supabase에 ANTHROPIC_API_KEY를 등록해주세요. 오토태그에 필요해요."
          :code==="bad_key" ? "오토태그용 Anthropic API 키가 유효하지 않아요."
          :code==="rate_limited" ? "AI 요청 제한에 걸렸어요. 잠시 후 다시 시도해주세요."
          :code==="unauthorized" ? "로그인이 만료됐어요. 다시 로그인해주세요."
          :code==="tag_integrity_failed" ? "AI가 원문 단어나 숫자를 바꿔서 오토태그를 적용하지 않았어요. 다시 시도해주세요."
          :code==="tag_language_failed" ? "한국어 Audio Tag의 자동 영어 교정에 실패했어요. 다시 시도해주세요."
          :code==="too_long" ? "대본이 너무 길어요. 5,000자 이내로 줄여주세요."
          :"오토태그 생성에 실패했어요"+(code?" ("+code+")":"")+". 다시 시도해주세요.";
        st(message,true);
        return;
      }
      var tagged=String(result&&result.text||"").trim();
      if(!tagged){ st("오토태그 결과가 비어 있어요. 다시 시도해주세요.",true); return; }
      var issue=ttsTagLanguageError(tagged);
      if(issue){ st(issue,true); return; }
      if(canonicalTtsSpeech(tagged)!==canonicalTtsSpeech(source)){
        st("원문 단어나 숫자가 변경되어 오토태그를 적용하지 않았어요.",true);
        return;
      }
      // AI 응답을 기다리는 동안 다른 숙소나 대본으로 바뀌면 오래된 결과는 버린다.
      if(!current || current.id!==projectId || ttsSourceText()!==source){
        st("대본이 변경돼 이전 요청 결과를 적용하지 않았어요. 다시 눌러주세요.",true);
        return;
      }
      current.ttsTagged=tagged;
      current.ttsTagSource=source;
      var saved=await persist(current);
      renderEdit(current);
      var tagStat=document.getElementById("tagstat");
      if(tagStat){
        tagStat.className="status"+(saved?"":" bad");
        tagStat.textContent=saved
          ? "영어 Audio Tag를 적용하고 저장했어요. 한국어 원문·숫자 보존 확인 완료. ⑤ TTS를 생성할 수 있어요."
          : "오토태그를 생성했지만 프로젝트 저장에 실패했어요. 저장 상태를 확인해주세요.";
      }
    }catch(e){
      st("오토태그 서버 연결에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.",true);
    }
  }

  function timelineReady(){
    var cuts=scriptLines();
    return !!(current && current.tts && current.ttsRaw &&
      current.ttsProcessedRawId===current.ttsRaw.id &&
      current.ttsProcessedVersion===ReelsMedia.VERSION &&
      current.ttsScriptSource===ttsSourceText() &&
      current.ttsRawTagText===String(current.ttsTagged||"").trim() &&
      current.cutTimelineFor===current.script &&
      current.cutTimelineAudioId===current.tts.id &&
      Array.isArray(current.cutTimeline) &&
      current.cutTimeline.length===cuts.length &&
      current.cutTimeline.every(function(w){
        return w && Number.isFinite(w.start) && Number.isFinite(w.end) && w.end>w.start;
      }));
  }

  // v4의 실제 지원값만 선택적으로 API에 전달한다. 이 페이지의 다른 대본 규칙과 독립적이다.
  function ttsVoiceSettings(){
    var cfg=current.ttsVoiceSettings||{};
    var sane=function(v,fallback){
      return typeof v==="number" && Number.isFinite(v) && v>=0 && v<=1
        ? Math.round(v*100)/100 : fallback;
    };
    return {custom:cfg.custom===true,
      stability:sane(cfg.stability,0.50),similarity:sane(cfg.similarity,0.75)};
  }

  function ttsVoiceFingerprint(){
    var s=ttsVoiceSettings();
    return JSON.stringify({
      voiceId:String(current.ttsVoiceId||"").trim(),
      custom:s.custom,
      settings:s.custom ? [s.stability,s.similarity] : null
    });
  }

  function ttsSettingsSection(){
    var s=ttsVoiceSettings();
    var disabled=s.custom?"":" disabled";
    var changed=!!(current.ttsRaw && current.ttsVoiceFingerprint &&
      current.ttsVoiceFingerprint!==ttsVoiceFingerprint());
    var h='<div class="trk" id="tts-settings-panel">'+
      '<div class="trkhead"><b>⑤ 목소리 설정</b><span class="trkname">Eleven v4</span></div>'+
      '<p class="hint">이 숙소의 설정으로 저장돼요. ElevenLabs 계정의 목소리 기본값은 변경하지 않아요.</p>'+
      '<label class="trkline" style="margin-top:12px">'+
      '<input id="ttsOverride" type="checkbox"'+(s.custom?' checked':'')+'>'+
      '안정성·유사도 직접 조절</label>'+
      '<p class="hint">끄면 ElevenLabs에 저장된 목소리 기본 설정을 그대로 사용해요.</p>'+
      '<div id="ttsSliders" class="'+(s.custom?'':'tts-muted')+'">'+
      '<label class="tts-setting-label" for="ttsStability">Stability (안정성)'+
      '<output id="ttsStabilityValue">'+s.stability.toFixed(2)+'</output></label>'+
      '<input class="tts-range" id="ttsStability" type="range" min="0" max="1" step="0.05" value="'+s.stability+'"'+disabled+'>'+
      '<div class="tts-range-hint"><span>다양하고 감정적인 표현</span><span>안정적인 톤</span></div>'+
      '<label class="tts-setting-label" for="ttsSimilarity">Similarity (유사도)'+
      '<output id="ttsSimilarityValue">'+s.similarity.toFixed(2)+'</output></label>'+
      '<input class="tts-range" id="ttsSimilarity" type="range" min="0" max="1" step="0.05" value="'+s.similarity+'"'+disabled+'>'+
      '<div class="tts-range-hint"><span>자유로운 변형</span><span>원래 목소리에 가까움</span></div>'+
      '<button type="button" class="ghost" id="ttsReset" style="width:100%;margin-top:12px">권장값으로 초기화 (0.50 / 0.75)</button>'+
      '</div>'+
      '<label for="ttsVoiceId">Voice ID <span>선택 · 비워두면 Supabase에 등록된 목소리</span></label>'+
      '<input type="text" id="ttsVoiceId" autocomplete="off" spellcheck="false" value="'+esc(current.ttsVoiceId||"")+'" placeholder="ElevenLabs Voice ID (선택)">'+
      '<p class="hint">모델 Eleven v4 · 언어 한국어 · 출력 MP3 44.1kHz / 128kbps</p>'+
      '<p class="hint">Speed 1.2배 · Pitch +1반음은 ⑥ 음성 후처리에서 적용해요. Eleven v4는 Speed·Style 조절을 직접 지원하지 않아요.</p>'+
      '<p class="status'+(changed?' bad':'')+'" id="ttsChangeNotice">'+
      (changed?'음성 설정이 바뀌었어요. 새 설정을 쓰려면 ⑤ TTS를 다시 생성해주세요.':'')+
      '</p></div>';
    return h;
  }

  function videoSection(){

  // 파일에서 올리든 TTS 로 만들든 저장하는 길은 하나로 둔다.
  async function putAudio(blob, kind, label){
    var ext=/wav/i.test(blob.type)?"wav":(/ogg/i.test(blob.type)?"ogg":"mp3");
    var up=await storeUpload(newPath(current.id, kind, ext), blob, blob.type||"audio/mpeg");
    var old=current[kind];
    current[kind]={id:up.id, name:label||("audio."+ext), mime:blob.type||"audio/mpeg", bytes:blob.size};
    await persist(current);
    if(old && old.id && old.id!==up.id){ try{ await storeDelete(old.id); }catch(e){} }
    audioCache={};
    renderEdit(current);
    return current[kind];
  }

  async function dropAudio(kind){
    var rec=current[kind];
    current[kind]=null;
    await persist(current);
    if(rec && rec.id){ try{ await storeDelete(rec.id); }catch(e){} }
    audioCache={};
    renderEdit(current);
  }

  // 태그가 적용된 대본을 ElevenLabs v4로 음성화한다.
  // base64 로 수신한 MP3는 음성 파일만 Storage에 저장한다.
  // 문자별 시간은 프로젝트의 metadata로 별도 저장해 재생성 시 비용을 아낀다.
  function mp3FromBase64(encoded){
    var clean=String(encoded||"").replace(/\s/g,"");
    var bytes=atob(clean), out=new Uint8Array(bytes.length);
    for(var i=0;i<bytes.length;i++)out[i]=bytes.charCodeAt(i);
    return new Blob([out],{type:"audio/mpeg"});
  }

  // ⑤ ElevenLabs v4 음성과 실제 문자별 타임스탬프를 함께 받는다.
  async function makeTTS(){
    var st=function(m,bad){var e=document.getElementById("vdstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!uid){ st("로그인이 필요해요.",true); return; }
    var source=ttsSourceText();
    if(!source){ st("대본을 먼저 만들어주세요.",true); return; }
    var tagged=String(current.ttsTagged||"").trim();
    if(tagged && ttsTagLanguageError(tagged)){
      st(ttsTagLanguageError(tagged),true); return;
    }
    if(!tagged || !tagsMatchScript()){
      st("먼저 ④ 오토태그를 완료해주세요.",true); return;
    }
    var voiceSettings=ttsVoiceSettings();
    var requestedVoiceId=String(current.ttsVoiceId||"").trim();
    if(requestedVoiceId && !/^[A-Za-z0-9_-]{8,100}$/.test(requestedVoiceId)){
      st("Voice ID는 영문·숫자로 된 ElevenLabs ID를 입력해주세요.",true);return;
    }
    var payload={action:"synthesize_timed",text:tagged,model:"eleven_v4"};
    if(requestedVoiceId)payload.voice_id=requestedVoiceId;
    if(voiceSettings.custom){
      payload.voice_settings={
        stability:voiceSettings.stability,similarity:voiceSettings.similarity
      };
    }
    st("ElevenLabs v4 음성과 타임스탬프를 함께 만드는 중...");
    var r;
    try{
      r=await api(FN.tts,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });
    }catch(e){ st("ElevenLabs에 연결하지 못했어요.",true); return; }
    var data;
    try{ data=await r.json(); }
    catch(e){ st("TTS 응답을 읽지 못했어요.",true); return; }
    if(!r.ok){
      var code=data.error||"", msg=String(data.message||code);
      st(code==="bad_voice_settings" || code==="unsupported_voice_settings"
        ? "음성 설정이 올바르지 않아요. 값을 확인해주세요."
        :code==="no_key" ? "ElevenLabs API 키를 Supabase Secrets에 넣어주세요."
        :code==="no_voice" ? "ElevenLabs 목소리 ID를 설정해주세요."
        :code==="invalid_audio_tags" ? "한국어 Audio Tag가 있어요. ④ 태그 다시 만들기로 영어 태그를 적용해주세요."
        :code==="rate_limited" ? "TTS 요청 제한에 걸렸어요. 잠시 뒤 시도해주세요."
        :"음성 생성 실패: "+msg.slice(0,170),true);
      return;
    }
    if(!data.audio_base64 || !data.alignment){
      st("음성 또는 문자별 타임스탬프가 없어서 진행을 멈췄어요.",true); return;
    }
    try{
      var mp3=mp3FromBase64(data.audio_base64);
      if(mp3.size<500)throw new Error("생성된 MP3가 너무 작아요.");
      var up=await storeUpload(newPath(current.id,"ttsraw","mp3"),mp3,"audio/mpeg");
      var oldRaw=current.ttsRaw;
      current.ttsRaw={id:up.id,name:"나레이션_원본.mp3",mime:"audio/mpeg",bytes:up.sizeBytes};
      current.ttsRawTagText=tagged;
      current.ttsScriptSource=source;
      current.ttsVoiceFingerprint=ttsVoiceFingerprint();
      current.ttsAlignment=data.alignment;
      current.ttsNormalizedAlignment=data.normalized_alignment||null;
      current.tts=null;
      current.ttsProcessedRawId="";
      current.ttsProcessedVersion="";
      current.ttsDuration=0;
      current.cutTimeline=[];
      current.cutTimelineFor="";
      current.cutTimelineAudioId="";
      var saved=await persist(current);
      renderEdit(current);
      var el=document.getElementById("vdstat");
      if(el){el.className="status"+(saved?"":" bad");el.textContent=saved
        ?"MP3와 발화 시간을 저장했어요. 다음으로 ⑥ 음성 후처리를 진행하세요."
        :"음성은 생성됐지만 프로젝트 저장에 실패했어요. 다시 저장해주세요.";}
      if(saved && oldRaw && oldRaw.id!==up.id){
        try{await storeDelete(oldRaw.id);}catch(e){}
      }
    }catch(e){
      st("TTS 파일 저장 실패: "+String(e&&e.message||e).slice(0,140),true);
    }
  }

  // ⑥ 1.2배속을 유지하면서 피치는 +1반음 올린다.
  async function makeAudioProcessed(){
    var st=function(m,bad){var e=document.getElementById("poststat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!current || !current.ttsRaw || !current.ttsAlignment ||
       current.ttsScriptSource!==ttsSourceText() ||
       current.ttsRawTagText!==String(current.ttsTagged||"").trim()){
      st("⑤ TTS를 먼저 생성하거나, 바뀐 오토태그로 다시 만들어주세요.",true);return;
    }
    var rawId=current.ttsRaw.id;
    if(!window.ReelsMedia){st("음성 후처리 도구를 불러오지 못했어요. 새로고침해주세요.",true);return;}
    st("음성 디코딩 후 1.2배속·피치 +1반음을 별도로 적용하는 중...");
    try{
      var r=await fetch(blobUrl(rawId));
      if(!r.ok)throw new Error("원본 MP3를 불러오지 못했어요.");
      var processed=await ReelsMedia.processAudio(await r.blob());
      if(rawId!==(current.ttsRaw&&current.ttsRaw.id))return;
      st("후처리 WAV 파일을 저장하는 중...");
      var up=await storeUpload(newPath(current.id,"tts","wav"),processed.blob,"audio/wav");
      var old=current.tts;
      current.tts={id:up.id,name:"나레이션_1.2배_피치1.wav",
        mime:"audio/wav",bytes:processed.blob.size};
      current.ttsProcessedRawId=rawId;
      current.ttsProcessedVersion=processed.version;
      current.ttsDuration=processed.duration;
      current.ttsMute=false;
      current.cutTimeline=[];
      current.cutTimelineFor="";
      current.cutTimelineAudioId="";
      var saved=await persist(current);
      renderEdit(current);
      var el=document.getElementById("poststat");
      if(el){el.className="status"+(saved?"":" bad");el.textContent=saved
        ?"후처리 완료 ("+processed.originalDuration.toFixed(2)+"초 → "+
          processed.duration.toFixed(2)+"초). 다음은 ⑦ 컷 싱크예요."
        :"후처리는 성공했지만 저장에 실패했어요.";}
      if(saved && old && old.id!==up.id)try{await storeDelete(old.id);}catch(e){}
    }catch(e){
      st("후처리 실패: "+String(e&&e.message||e).slice(0,160),true);
    }
  }

  // ⑦ ElevenLabs 문자별 발화 타이밍으로 원래 자막 줄에 시간을 할당한다.
  async function makeSyncedCuts(){
    var st=function(m,bad){var e=document.getElementById("syncstat");
      if(e){e.textContent=m;e.className="status"+(bad?" bad":"");}};
    if(!current || !current.tts || !current.ttsRaw ||
       current.ttsProcessedRawId!==current.ttsRaw.id ||
       current.ttsProcessedVersion!==ReelsMedia.VERSION ||
       current.ttsScriptSource!==ttsSourceText()){
      st("⑤ TTS 생성과 ⑥ 후처리를 먼저 완료해주세요.",true);return;
    }
    if(current.ttsRawTagText!==String(current.ttsTagged||"").trim()){
      st("오토태그가 바뀌었어요. ⑤ TTS를 다시 생성해주세요.",true);return;
    }
    st("실제 발화 시각과 각 컷 자막을 대조하는 중...");
    var cuts=scriptLines(), timeline=null, err=null;
    var candidates=[current.ttsAlignment,current.ttsNormalizedAlignment];
    for(var k=0;k<candidates.length;k++){
      if(!candidates[k])continue;
      try{
        timeline=ReelsMedia.timelineFromAlignment(
          cuts,candidates[k],Number(current.ttsDuration),ReelsMedia.SPEED);
        break;
      }catch(e){err=e;}
    }
    if(!timeline){
      st("자동 싱크 불가: "+String(err&&err.message||"타임스탬프 불일치").slice(0,170),true);
      return;
    }
    current.cutTimeline=timeline;
    current.cutTimelineFor=current.script;
    current.cutTimelineAudioId=current.tts.id;
    var saved=await persist(current);
    renderEdit(current);
    var el=document.getElementById("syncstat");
    if(el){el.className="status"+(saved?"":" bad");el.textContent=saved
      ?"정확한 컷 시작·끝 시간 "+timeline.length+"개 저장 완료. ⑧ 사진 선택으로 진행하세요."
      :"컷 타이밍 계산은 끝났지만 저장하지 못했어요.";}
  }

  var audioCache={};
  async function loadAudio(ctx, rec){
    if(!rec || !rec.id) return null;
    if(audioCache[rec.id]) return audioCache[rec.id];
    var r=await fetch(blobUrl(rec.id));
    var buf=await ctx.decodeAudioData(await r.arrayBuffer());
    audioCache[rec.id]=buf;
    return buf;
  }

  // 사진 고르는 줄. 누른 컷 아래에 띠로 펼친다.
  function openPicker(btn, cutIdx){
    var old=document.querySelector(".cstrip");
    var same = old && old.dataset.cut===String(cutIdx);
    if(old) old.remove();
    if(same) return;
    var ph=current.photos||[];
    var row=btn.closest(".cut");
    var d=document.createElement("div");
    d.className="cstrip"; d.dataset.cut=String(cutIdx);
    d.innerHTML=ph.map(function(x,i){
      return '<div class="cstrip-item"><button type="button" data-pi="'+i+'"><img src="'+blobUrl(srcId(x))+'" alt=""><i>'+(i+1)+'</i></button>'+
        '<button type="button" class="cstrip-look" data-preview-url="'+esc(blobUrl(srcId(x)))+'" aria-label="'+(i+1)+'번 사진 크게 보기">🔍</button></div>';
    }).join("");
    row.insertAdjacentElement("afterend", d);
    Array.prototype.forEach.call(d.querySelectorAll("button[data-pi]"),function(b){
      b.addEventListener("click",function(){
        var pi=+b.dataset.pi;
        if(cutIdx<0) current.coverPhoto=pi;
        else { ensureMap(); current.map[cutIdx]=pi; }
        flushSave();
        renderEdit(current);
      });
    });
    d.scrollIntoView({block:"nearest"});
  }

  function areaWide(){ return ((current.area||"").trim().split(/\s+/)[0]||""); }

  function lineProblems(lines, cover){

      if(why.length) out.push({i:i, text:t, why:why.join(" / "), tag:tag});
    });
    // 커버에서 한 말을 1~2컷이 또 하면 앞 3초를 버리는 셈이다.
    var cv=String(cover||"").replace(/\s/g,"");
    for(var k=0;k<Math.min(2,lines.length);k++){
      var head=lines[k].replace(/\s/g,""), hit=false;
      for(var j=0;j+3<=cv.length;j++) if(head.indexOf(cv.substr(j,3))>=0){ hit=true; break; }
      if(hit && !out.some(function(o){return o.i===k}))
