name: Validate reel workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install SDK and verify image-generation exports
        run: |
          npm install --no-audit --no-fund
          node --input-type=module -e 'import { generateImage, createGateway } from "ai"; if (typeof generateImage !== "function" || typeof createGateway !== "function") process.exit(1)'
      - name: Check JS syntax
        run: |
          node --check reels-media.js
          node --check api/image-edit.js
      - name: Test timeline and verify original scriptPrompt
        run: node --test tests/*.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check and test Kling clip Edge Function (lodging-reels-clip)
        run: |
          deno check supabase/functions/lodging-reels-clip/clip.ts
          deno test --no-check tests/clip-function.test.ts
      - name: Check SoundTouch audio processing CDN assets
        run: |
          curl --fail --location --silent --show-error --head --retry 2 'https://esm.sh/@soundtouchjs/audio-worklet@2.1.1'
          curl --fail --location --silent --show-error --head --retry 2 'https://cdn.jsdelivr.net/npm/@soundtouchjs/audio-worklet@2.1.1/.dist/soundtouch-processor.js'
