name: Seed index.html

on:
  push:
    paths:
      - ".github/workflows/seed-index.yml"

permissions:
  contents: write

jobs:
  seed-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download deployed app as index.html
        run: curl -fsSL https://lodging-reels.vercel.app -o index.html

      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already up to date"
            exit 0
          fi
          git commit -m "Add deployed lodging reels app"
          git push
